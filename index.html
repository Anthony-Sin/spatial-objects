<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCRAP!</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:#FFF8EC; --ink:#2B2118; --coral:#FF6B57; --sun:#FFC53D; --sky:#5DA9E9;
    --dark-bg:#0c101a; --dark-surface:#161d2d;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    min-height:100vh; min-height:100svh; display:grid; place-items:center; overflow:hidden;
    background:var(--dark-bg); color:#fff;
    font-family:"Fredoka","Baloo 2","Avenir Next","Trebuchet MS",system-ui,sans-serif;
    position:relative;
  }

  /* Deep dark boxing arena backdrop */
  body::before {
    content:""; position:fixed; inset:0;
    z-index:0; pointer-events:none;
    background:radial-gradient(ellipse 75% 55% at 50% 45%, rgba(26, 35, 54, 0.78) 0%, rgba(12, 16, 26, 0.96) 65%, #07090e 100%);
  }

  /* subtle arena dust / particle speckle */
  body::after {
    content:""; position:fixed; inset:0;
    z-index:0; pointer-events:none;
    background-image:radial-gradient(rgba(255, 255, 255, 0.05) 1.2px, transparent 1.2px);
    background-size:28px 28px;
  }

  /* ---------- one sticker on paper ---------- */
  .stage {
    position:relative; z-index:2;
    min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column; justify-content:space-between; align-items:center;
    text-align:center; padding:clamp(16px, 2.5vh, 28px) 20px clamp(48px, 8.5vh, 88px);
    pointer-events:none;
  }
  .stage > * { pointer-events:auto; }

  /* ---------- Bottom Arcade Menu Controls ---------- */
  .menu-group {
    display:flex; flex-direction:column; align-items:center; gap:clamp(10px, 1.6vmin, 16px);
    filter:drop-shadow(0 8px 18px rgba(43,33,24,.12));
    z-index:10;
    margin-bottom:clamp(8px, 1.8vh, 22px);
  }

  /* ---------- Sticker Logo with Comic Halftone & Sparkles ---------- */
  .logo-container {
    position:relative; display:inline-flex; flex-direction:column; align-items:center;
    margin-top:clamp(4px, 1.2vh, 18px);
    user-select:none;
  }

  .comic-halftone {
    position:absolute; inset:-40px -60px -30px;
    pointer-events:none; z-index:1;
    display:flex; align-items:center; justify-content:center;
  }
  .comic-halftone svg {
    width:100%; height:100%; overflow:visible;
  }

  .logo-title {
    position:relative; z-index:2;
    margin:0; transform:rotate(-3deg);
    font-family:"Baloo 2","Fredoka",cursive,sans-serif;
    font-weight:800; font-size:clamp(84px, 16vmin, 168px);
    line-height:.85; letter-spacing:.02em;
    color:#FF654E;
    /* Chunky sticker outline and comic bevel layers */
    text-shadow:
      0 -3px 0 #FFC83B,
      -3px -3px 0 #2B2118,
      3px -3px 0 #2B2118,
      -3px 3px 0 #2B2118,
      3px 3px 0 #2B2118,
      0 -4px 0 #2B2118,
      0 4px 0 #2B2118,
      -4px 0 0 #2B2118,
      4px 0 0 #2B2118,
      0 8px 0 #2B2118;
    filter:
      drop-shadow(0 0 0 #fff)
      drop-shadow(-5px -5px 0 #fff)
      drop-shadow(5px -5px 0 #fff)
      drop-shadow(-5px 5px 0 #fff)
      drop-shadow(5px 5px 0 #fff)
      drop-shadow(0 6px 0 #fff)
      drop-shadow(0 12px 0 #2B2118)
      drop-shadow(0 18px 25px rgba(43,33,24,.18));
    transition:transform .2s cubic-bezier(.34,1.7,.5,1);
  }
  .logo-title:hover {
    transform:rotate(-1deg) scale(1.03);
  }
  .logo-title .bang {
    color:#FF654E;
  }

  .ring-canvas {
    position:fixed; inset:0; width:100%; height:100%;
    z-index:1; pointer-events:none;
  }

  /* ---------- Bottom Arcade Menu Controls ---------- */
  .menu-group {
    display:flex; flex-direction:column; align-items:center; gap:clamp(10px, 1.6vmin, 16px);
    filter:drop-shadow(0 8px 18px rgba(43,33,24,.12));
    z-index:10;
  }

  .tut-check {
    display:inline-flex; align-items:center; gap:9px;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    padding:6px 18px;
    background:#fff;
    border:3px solid var(--ink); border-radius:999px;
    box-shadow:0 3.5px 0 var(--ink);
    font-size:clamp(12px,1.4vmin,14px); font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color:var(--ink);
    transition:transform .15s cubic-bezier(.34,1.7,.5,1), box-shadow .15s;
    margin-bottom:2px;
  }
  .tut-check:hover {
    transform:translateY(-2px) rotate(-.8deg);
    box-shadow:0 5.5px 0 var(--ink);
  }
  .tut-check:active {
    transform:translateY(1px);
    box-shadow:0 1px 0 var(--ink);
  }
  .tut-check:focus-within {
    outline:3px solid var(--coral);
    outline-offset:3px;
  }
  .tut-input {
    position:absolute; opacity:0; pointer-events:none; width:0; height:0; margin:0;
  }
  .tut-box {
    width:22px; height:22px; border-radius:6px;
    border:2.5px solid var(--ink); background:#fff;
    box-shadow:0 3px 0 var(--ink);
    display:grid; place-items:center; flex-shrink:0;
    transition:background .15s, box-shadow .15s, transform .15s cubic-bezier(.34,1.7,.5,1);
  }
  .tut-check:hover .tut-box {
    box-shadow:0 4px 0 var(--ink);
  }
  .tut-box svg {
    width:14px; height:14px; fill:none;
    stroke:var(--ink); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round;
    opacity:0; transform:scale(.4) rotate(-12deg);
    transition:opacity .15s ease, transform .18s cubic-bezier(.34,1.8,.5,1);
  }
  .tut-input:checked + .tut-box {
    background:var(--sun);
  }
  .tut-input:checked + .tut-box svg {
    opacity:1; transform:scale(1) rotate(0deg);
  }
  .tut-input:focus-visible + .tut-box {
    outline:3px solid var(--sun); outline-offset:3px;
  }
  .tut-label {
    line-height:1;
  }

  .menu-row {
    display:flex; flex-direction:row; align-items:center; justify-content:center;
    gap:clamp(12px, 1.8vmin, 20px);
    flex-wrap:wrap;
  }

  /* career record strip — paper pills under the menu */
  .career {
    display:flex; flex-direction:row; align-items:center; justify-content:center;
    gap:10px; flex-wrap:wrap;
  }
  .cpill {
    display:inline-flex; align-items:center; gap:7px;
    padding:6px 15px; background:#fff;
    border:2.5px solid var(--ink); border-radius:999px;
    box-shadow:0 3.5px 0 var(--ink);
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink);
  }
  .cpill b { color:var(--coral); font-size:14px; }
  .cpill .ko-ic {
    width:13px; height:13px; border-radius:50%;
    background:var(--sun); border:2px solid var(--ink);
    box-shadow:inset 0 0 0 2px #fff;
  }

  .btn {
    display:inline-flex; align-items:center; justify-content:center;
    padding:clamp(14px,2.1vmin,20px) clamp(24px,3.2vmin,40px);
    border:3.5px solid var(--ink); border-radius:999px;
    font-family:inherit; font-weight:800; text-transform:uppercase; text-decoration:none; text-align:center;
    font-size:clamp(14px,1.75vmin,19px); letter-spacing:.12em; line-height:1.2;
    white-space:nowrap; cursor:pointer;
    box-shadow:0 6px 0 var(--ink);
    transition:transform .18s cubic-bezier(.34,1.7,.5,1), box-shadow .18s cubic-bezier(.34,1.7,.5,1);
  }
  .btn:hover  { transform:translateY(-3.5px) rotate(-.8deg); box-shadow:0 9.5px 0 var(--ink); }
  .btn:active { transform:translateY(2.5px) scale(.98); box-shadow:0 1px 0 var(--ink); transition-duration:.06s; }
  .btn:focus-visible { outline:4px solid var(--sun); outline-offset:3px; }
  .btn.main {
    background:#FF604B; color:#fff;
    box-shadow:0 6px 0 var(--ink), 0 0 16px rgba(255,96,75,.35);
  }
  .btn.alt  {
    background:#fff; color:var(--ink);
  }

  /* Round Gear Settings Button */
  .btn-gear {
    width:clamp(54px, 7vmin, 66px); height:clamp(54px, 7vmin, 66px);
    border-radius:50%;
    border:3.5px solid var(--ink); background:var(--sun); color:var(--ink);
    display:grid; place-items:center; cursor:pointer; flex-shrink:0;
    box-shadow:0 6px 0 var(--ink);
    transition:transform .18s cubic-bezier(.34,1.7,.5,1), box-shadow .18s cubic-bezier(.34,1.7,.5,1), background .15s;
    padding:0;
  }
  .btn-gear svg {
    width:55%; height:55%; fill:var(--ink);
    transition:transform .4s cubic-bezier(.34,1.7,.5,1);
  }
  .btn-gear:hover {
    transform:translateY(-3.5px) rotate(25deg);
    box-shadow:0 9.5px 0 var(--ink);
    background:#FFD05B;
  }
  .btn-gear:active {
    transform:translateY(2.5px) rotate(45deg);
    box-shadow:0 1px 0 var(--ink);
  }
  .btn-gear:focus-visible {
    outline:4px solid var(--coral); outline-offset:3px;
  }

  /* centered settings modal */
  .settings-overlay {
    position:fixed; inset:0; z-index:50;
    background:rgba(43,33,24,.45);
    backdrop-filter:blur(4px);
    display:grid; place-items:center;
    padding:16px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .settings-overlay.open {
    opacity:1; pointer-events:auto;
  }
  .settings-card {
    position:relative;
    background:var(--paper); color:var(--ink);
    border:3.5px solid var(--ink); border-radius:26px;
    box-shadow:0 10px 0 var(--ink), 0 20px 45px rgba(43,33,24,.35);
    width:min(92vw, 420px);
    padding:24px 28px 26px;
    text-align:left;
    transform:scale(.92) rotate(-1deg);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .settings-overlay.open .settings-card {
    transform:scale(1) rotate(0deg);
  }
  .settings-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px;
  }
  .settings-title {
    font-size:clamp(26px,4vmin,34px); font-weight:700;
    letter-spacing:.03em; line-height:1;
    transform:rotate(-1.5deg);
    text-shadow:.04em .04em 0 var(--coral), .08em .08em 0 rgba(43,33,24,.08);
  }
  .settings-close {
    width:34px; height:34px; border-radius:50%;
    border:2.5px solid var(--ink); background:#fff;
    font-size:18px; font-weight:800; line-height:1; cursor:pointer;
    display:grid; place-items:center; box-shadow:0 3px 0 var(--ink);
    color:var(--ink); font-family:inherit;
    transition:transform .12s, box-shadow .12s;
  }
  .settings-close:hover { transform:translateY(-2px); box-shadow:0 5px 0 var(--ink); }
  .settings-close:active { transform:translateY(1px); box-shadow:0 1px 0 var(--ink); }

  .settings-list {
    display:flex; flex-direction:column; gap:14px;
    margin-bottom:22px;
  }
  .setting-row {
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:10px 14px; background:rgba(255,255,255,.7);
    border:2px solid var(--ink); border-radius:14px;
    box-shadow:0 3px 0 rgba(43,33,24,.15);
  }
  .setting-info { display:flex; flex-direction:column; }
  .setting-label {
    font-weight:700; font-size:15px; letter-spacing:.02em;
  }
  .setting-desc {
    font-size:11px; opacity:.7; font-weight:500;
  }

  /* Switch toggle */
  .switch {
    position:relative; width:48px; height:26px; flex-shrink:0;
    cursor:pointer;
  }
  .switch input { opacity:0; width:0; height:0; position:absolute; }
  .slider {
    position:absolute; inset:0; background:#ddd;
    border:2px solid var(--ink); border-radius:999px;
    transition:background .2s cubic-bezier(.34,1.5,.64,1);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.15);
  }
  .slider::before {
    content:''; position:absolute; height:16px; width:16px;
    left:3px; top:3px; background:#fff;
    border:2px solid var(--ink); border-radius:50%;
    box-shadow:0 2px 0 var(--ink);
    transition:transform .2s cubic-bezier(.34,1.5,.64,1), background .2s;
  }
  .switch input:checked + .slider {
    background:var(--coral);
  }
  .switch input:checked + .slider::before {
    transform:translateX(20px);
    background:var(--sun);
  }
  .switch input:focus-visible + .slider {
    outline:3px solid var(--sun); outline-offset:2px;
  }

  /* Range slider */
  .range-wrap {
    display:flex; align-items:center; gap:10px; width:130px;
  }
  .range-input {
    width:100%; accent-color:var(--coral); cursor:pointer;
  }
  .range-val {
    font-size:12px; font-weight:700; min-width:32px; text-align:right;
  }

  .settings-done {
    display:block; width:100%;
    padding:12px 20px; border-radius:999px;
    border:3px solid var(--ink); background:var(--sun); color:var(--ink);
    font-family:inherit; font-size:15px; font-weight:700;
    text-transform:uppercase; letter-spacing:.12em; cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
    text-align:center;
    transition:transform .12s, box-shadow .12s;
  }
  .settings-done:hover { transform:translateY(-2px); box-shadow:0 6px 0 var(--ink); }
  .settings-done:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }

  .btn:focus-visible, .btn.sub:focus-visible, .settings-done:focus-visible, .settings-close:focus-visible {
    outline:3.5px solid var(--coral); outline-offset:3px;
  }

  /* ---------- motion ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .glove-bob { animation:bob 3.2s ease-in-out infinite; }
    .glove-shadow { animation:shrink 3.2s ease-in-out infinite; }
    .glove-wrap.jab .glove-jab { animation:jab .5s cubic-bezier(.3,1.6,.5,1); }
    .glove-wrap.jab .glove-bob { animation-play-state:paused; }
  }
  @keyframes bob {
    0%,100% { transform:rotate(-6deg) translateY(0); }
    50%     { transform:rotate(-2.5deg) translateY(-2.4%); }
  }
  @keyframes shrink {
    0%,100% { transform:translateX(-50%) scaleX(1); opacity:1; }
    50%     { transform:translateX(-50%) scaleX(.86); opacity:.6; }
  }
  @keyframes jab {
    0%   { transform:scale(1) translateY(0); }
    35%  { transform:scale(1.22) translateY(-4%); }
    100% { transform:scale(1) translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
  <canvas class="ring-canvas" id="ring-canvas"></canvas>

  <main class="stage">
    <div class="logo-container">
      <div class="comic-halftone" aria-hidden="true">
        <svg viewBox="0 0 600 220" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Halftone dot clusters left and right -->
          <g fill="#FFC53D" opacity="0.88">
            <circle cx="85" cy="55" r="3.5" />
            <circle cx="98" cy="45" r="4.5" />
            <circle cx="115" cy="40" r="5.5" />
            <circle cx="135" cy="38" r="6" />
            <circle cx="80" cy="75" r="4" />
            <circle cx="95" cy="65" r="5" />
            <circle cx="112" cy="58" r="6.5" />
            <circle cx="70" cy="98" r="3" />
            <circle cx="84" cy="88" r="4" />
            <circle cx="100" cy="80" r="5" />
            
            <circle cx="470" cy="50" r="5" />
            <circle cx="490" cy="58" r="6" />
            <circle cx="510" cy="72" r="5" />
            <circle cx="525" cy="90" r="4" />
            <circle cx="485" cy="75" r="5.5" />
            <circle cx="505" cy="92" r="4.5" />
            <circle cx="465" cy="95" r="4" />
            <circle cx="478" cy="115" r="3.5" />
          </g>
          <!-- Comic Sparkle Stars -->
          <g transform="translate(62, 120)">
            <path d="M0 -15 Q0 0 15 0 Q0 0 0 15 Q0 0 -15 0 Q0 0 0 -15 Z" fill="#5DA9E9" stroke="#2B2118" stroke-width="2.5" />
          </g>
          <g transform="translate(125, 16)">
            <path d="M0 -10 Q0 0 10 0 Q0 0 0 10 Q0 0 -10 0 Q0 0 0 -10 Z" fill="#FFC53D" stroke="#2B2118" stroke-width="2" />
          </g>
          <g transform="translate(488, 25)">
            <path d="M0 -16 Q0 0 16 0 Q0 0 0 16 Q0 0 -16 0 Q0 0 0 -16 Z" fill="#FFC53D" stroke="#2B2118" stroke-width="2.5" />
          </g>
          <g transform="translate(532, 68)">
            <path d="M0 -11 Q0 0 11 0 Q0 0 0 11 Q0 0 -11 0 Q0 0 0 -11 Z" fill="#5DA9E9" stroke="#2B2118" stroke-width="2" />
          </g>
        </svg>
      </div>
      <h1 class="logo-title">SCRAP<span class="bang">!</span></h1>
    </div>

    <div class="menu-group">
      <label class="tut-check" for="tut-toggle">
        <input type="checkbox" id="tut-toggle" class="tut-input">
        <span class="tut-box" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M3.2 8.2 l3.2 3.4 l6.4 -7.2"/></svg>
        </span>
        <span class="tut-label">Start in tutorial</span>
      </label>

      <nav class="menu-row">
        <a class="btn main" id="enter-btn" href="./lineup.html">Choose Your Fighter</a>
        <button type="button" class="btn-gear" id="settings-open-btn" aria-label="Settings" title="Game Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.45.17-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </nav>

      <!-- career record — the personal bests the lineup locks check against -->
      <div class="career" id="career">
        <span class="cpill">BEST <b data-best>0</b> PTS</span>
        <span class="cpill"><b data-wins>0</b> WINS</span>
        <span class="cpill"><i class="ko-ic"></i><b data-kos>0</b> KOs</span>
        <span class="cpill">AVG KO <b data-koavg>—</b></span>
      </div>
    </div>
  </main>

  <!-- Centered Settings Menu -->
  <div class="settings-overlay" id="settings-modal" aria-hidden="true">
    <div class="settings-card" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="settings-header">
        <h2 class="settings-title">SETTINGS</h2>
        <button class="settings-close" id="settings-close-btn" type="button" aria-label="Close Settings">✕</button>
      </div>

      <div class="settings-list">
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Sound Effects</span>
            <span class="setting-desc">Procedural punches, whooshes, bell</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="setting-sound" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Volume</span>
            <span class="setting-desc">Master audio level</span>
          </div>
          <div class="range-wrap">
            <input type="range" class="range-input" id="setting-volume" min="0" max="100" value="80">
            <span class="range-val" id="setting-volume-val">80%</span>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Mirror Camera</span>
            <span class="setting-desc">Flip video like a mirror</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="setting-mirror" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Perf HUD</span>
            <span class="setting-desc">Show FPS & tracking latency</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="setting-fps">
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Start in Tutorial</span>
            <span class="setting-desc">Warm up before real fights</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="setting-tutorial">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <button type="button" class="settings-done" id="settings-done-btn">Done</button>
    </div>
  </div>

<script type="module">
  import * as THREE from 'three';
  import { buildBoxer, VARIANTS, VARIANT_INFO } from './shared/boxing/protoBoxer.js';
  import { buildScene } from './shared/boxing/scene.js';

  // career record pills — personal best pts, wins, KOs, average KO round
  (function career() {
    const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
    const ko = get('boxing:ko', { n: 0, sum: 0 });
    document.querySelector('[data-best]').textContent = get('boxing:best', 0).toLocaleString();
    document.querySelector('[data-wins]').textContent = get('boxing:wins', 0);
    document.querySelector('[data-kos]').textContent = ko.n;
    document.querySelector('[data-koavg]').textContent = ko.n ? (ko.sum / ko.n).toFixed(1) : '—';
  })();

  // tutorial checkmark syncs with Enter the Ring destination
  const tutToggle = document.getElementById('tut-toggle');
  const enterBtn = document.getElementById('enter-btn');
  function syncTutorial() {
    enterBtn.href = tutToggle.checked ? './lineup.html?practice=1' : './lineup.html';
  }
  try {
    if (localStorage.getItem('boxing:tutorial') === '1') {
      tutToggle.checked = true;
    }
  } catch {}
  syncTutorial();
  tutToggle.addEventListener('change', () => {
    syncTutorial();
    try {
      localStorage.setItem('boxing:tutorial', tutToggle.checked ? '1' : '0');
    } catch {}
  });

  // Settings modal logic
  const settingsModal = document.getElementById('settings-modal');
  const settingsOpenBtn = document.getElementById('settings-open-btn');
  const settingsCloseBtn = document.getElementById('settings-close-btn');
  const settingsDoneBtn = document.getElementById('settings-done-btn');

  const settingSound = document.getElementById('setting-sound');
  const settingVolume = document.getElementById('setting-volume');
  const settingVolumeVal = document.getElementById('setting-volume-val');
  const settingMirror = document.getElementById('setting-mirror');
  const settingFps = document.getElementById('setting-fps');
  const settingTutorial = document.getElementById('setting-tutorial');

  function openSettings() {
    settingsModal.classList.add('open');
    settingsModal.setAttribute('aria-hidden', 'false');
  }
  function closeSettings() {
    settingsModal.classList.remove('open');
    settingsModal.setAttribute('aria-hidden', 'true');
  }

  settingsOpenBtn.addEventListener('click', openSettings);
  settingsCloseBtn.addEventListener('click', closeSettings);
  settingsDoneBtn.addEventListener('click', closeSettings);
  settingsModal.addEventListener('click', (e) => {
    if (e.target === settingsModal) closeSettings();
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && settingsModal.classList.contains('open')) closeSettings();
  });

  // Load saved settings
  try {
    if (localStorage.getItem('boxing:sound') !== null) {
      settingSound.checked = localStorage.getItem('boxing:sound') === '1';
    }
    if (localStorage.getItem('boxing:volume') !== null) {
      settingVolume.value = localStorage.getItem('boxing:volume');
      settingVolumeVal.textContent = settingVolume.value + '%';
    }
    if (localStorage.getItem('boxing:mirror') !== null) {
      settingMirror.checked = localStorage.getItem('boxing:mirror') === '1';
    }
    if (localStorage.getItem('boxing:fps') !== null) {
      settingFps.checked = localStorage.getItem('boxing:fps') === '1';
    }
    settingTutorial.checked = tutToggle.checked;
  } catch {}

  // Save settings on change
  settingSound.addEventListener('change', () => {
    try { localStorage.setItem('boxing:sound', settingSound.checked ? '1' : '0'); } catch {}
  });
  settingVolume.addEventListener('input', () => {
    settingVolumeVal.textContent = settingVolume.value + '%';
    try { localStorage.setItem('boxing:volume', settingVolume.value); } catch {}
  });
  settingMirror.addEventListener('change', () => {
    try { localStorage.setItem('boxing:mirror', settingMirror.checked ? '1' : '0'); } catch {}
  });
  settingFps.addEventListener('change', () => {
    try { localStorage.setItem('boxing:fps', settingFps.checked ? '1' : '0'); } catch {}
  });
  settingTutorial.addEventListener('change', () => {
    tutToggle.checked = settingTutorial.checked;
    syncTutorial();
    try { localStorage.setItem('boxing:tutorial', tutToggle.checked ? '1' : '0'); } catch {}
  });
  tutToggle.addEventListener('change', () => {
    settingTutorial.checked = tutToggle.checked;
  });

  // 3D Animated Ring & Boxing Characters
  (function init3D() {
    const canvas = document.getElementById('ring-canvas');
    if (!canvas) return;

    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.90;

    const sceneObj = buildScene(THREE, renderer, { low: false });
    const scene = sceneObj.scene;
    scene.background = new THREE.Color(0x0c101a);
    scene.fog = new THREE.Fog(0x0c101a, 8, 22);

    // Remove default scene lights and generic arena crowd to control exposure precisely
    const toRemove = [];
    scene.traverse(o => {
      if (o.geometry?.type === 'CylinderGeometry' && o.material?.side === THREE.BackSide) {
        toRemove.push(o);
      }
      if (o.isInstancedMesh) {
        toRemove.push(o);
      }
      if (o.geometry?.type === 'CircleGeometry' && o.material) {
        o.material.color.set(0x080c14);
      }
      if (o.isLight) {
        toRemove.push(o);
      }
    });
    toRemove.forEach(o => o.parent?.remove(o));

    // Isometric diamond orientation matching concept art
    const ringGroup = sceneObj.ring.group;
    ringGroup.rotation.y = Math.PI * 0.75;
    ringGroup.scale.set(0.74, 0.74, 0.74);

    // Style the ring skirt and corner posts in dark arena tones
    const matFlat = (c) => new THREE.MeshLambertMaterial({ color: c });
    const colWhite = 0x9ca8be;
    const colCoral = 0xa34538;
    const colBlue = 0x3d6b99;
    const colApron = 0x111624;

    // Darken ring apron skirt
    ringGroup.traverse(o => {
      if (o.isMesh && o.geometry?.type === 'BoxGeometry' && o.geometry.parameters?.height === 0.55) {
        o.material = matFlat(colApron);
      }
    });

    // Darken the outer square mat top so only the circular spotlight is brightly lit
    if (sceneObj.ring.mat && Array.isArray(sceneObj.ring.mat.material)) {
      sceneObj.ring.mat.material[2] = new THREE.MeshLambertMaterial({ color: 0x131926 });
      sceneObj.ring.mat.material[0] = new THREE.MeshLambertMaterial({ color: 0x0f1420 });
      sceneObj.ring.mat.material[1] = new THREE.MeshLambertMaterial({ color: 0x0f1420 });
      sceneObj.ring.mat.material[3] = new THREE.MeshLambertMaterial({ color: 0x0f1420 });
      sceneObj.ring.mat.material[4] = new THREE.MeshLambertMaterial({ color: 0x0f1420 });
      sceneObj.ring.mat.material[5] = new THREE.MeshLambertMaterial({ color: 0x0f1420 });
    }

    // Style 4 corner posts, caps, and turnbuckle pads using world coordinates (darker atmospheric tone)
    ringGroup.updateMatrixWorld(true);
    const tmpV = new THREE.Vector3();

    ringGroup.traverse(o => {
      if (!o.isMesh) return;
      const isPost = o.geometry?.type === 'CylinderGeometry' && o.geometry.parameters?.radiusTop < 0.1;
      const isCap = o.geometry?.type === 'SphereGeometry';
      const isPad = o.geometry?.type === 'BoxGeometry' && o.geometry.parameters?.width === 0.24;

      if (isPost || isCap || isPad) {
        o.getWorldPosition(tmpV);
        if (tmpV.x < -1.1) {
          o.material = matFlat(colCoral); // Left corner
        } else if (tmpV.x > 1.1) {
          o.material = matFlat(colBlue);  // Right corner
        } else {
          o.material = matFlat(colWhite); // Front & Back corners
        }
      }
    });

    // Ensure ropes are visible with subtle dark arena tone
    if (sceneObj.ring.ropes) {
      sceneObj.ring.ropes.forEach(r => {
        r.visible = true;
      });
    }

    // ---------- Distinct Circular Spotlight Pool on Characters ----------
    // Generate warm stage spotlight texture (natural warm parchment tone, not bleached white)
    function makeSpotCircleTexture() {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 512;
      const ctx = cv.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
      grad.addColorStop(0, '#ebd4b7');
      grad.addColorStop(0.50, '#d9bd96');
      grad.addColorStop(0.78, '#b89467');
      grad.addColorStop(0.92, 'rgba(160, 120, 70, 0.35)');
      grad.addColorStop(0.99, 'rgba(80, 50, 25, 0.04)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(256, 256, 254, 0, Math.PI * 2);
      ctx.fill();

      // Faint ring canvas accent within the circular pool
      ctx.strokeStyle = 'rgba(43, 33, 24, 0.20)';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(256, 256, 228, 0, Math.PI * 2);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const circleRadius = 1.76;
    const spotCircleGeo = new THREE.CircleGeometry(circleRadius, 64);
    spotCircleGeo.rotateX(-Math.PI / 2);
    const spotCircleMat = new THREE.MeshLambertMaterial({
      map: makeSpotCircleTexture(),
      transparent: true,
      opacity: 0.82,
    });
    const spotCircleMesh = new THREE.Mesh(spotCircleGeo, spotCircleMat);
    spotCircleMesh.position.set(0, 0.012, 0.05);
    spotCircleMesh.receiveShadow = true;
    scene.add(spotCircleMesh);

    // ---------- Overhead Spotlight & Triangular Light Beam ----------
    // Ambient fill to preserve rich cartoon colors without overexposing
    scene.add(new THREE.AmbientLight(0x283244, 0.65));

    // Warm key directional light focused on the fighters
    const keyLight = new THREE.DirectionalLight(0xffe2bf, 0.85);
    keyLight.position.set(2, 6, 4);
    keyLight.target.position.set(0, 0.4, 0.05);
    scene.add(keyLight, keyLight.target);

    // Calibrated overhead spotlight (warm amber tone, controlled exposure)
    const spot = new THREE.SpotLight(0xffe6c8, 12);
    spot.position.set(0, 5.8, 0.05);
    spot.target.position.set(0, 0.40, 0.05);
    spot.angle = 0.34;
    spot.penumbra = 0.30;
    spot.decay = 1.0;
    spot.distance = 14;
    spot.castShadow = true;
    spot.shadow.mapSize.set(1024, 1024);
    spot.shadow.bias = -0.001;
    scene.add(spot, spot.target);

    // Prominent theatrical triangular spotlight beam
    const beamGeo = new THREE.CylinderGeometry(0.12, 2.20, 5.75, 48, 1, true);
    beamGeo.translate(0, -2.875, 0);
    const beamMat = new THREE.MeshBasicMaterial({
      color: 0xffdfaa,
      transparent: true,
      opacity: 0.22,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const beam = new THREE.Mesh(beamGeo, beamMat);
    beam.position.copy(spot.position);
    beam.lookAt(spot.target.position);
    beam.rotateX(Math.PI / 2);
    scene.add(beam);

    // Front-facing triangular planar beam matching camera angle for crisp cartoon silhouette
    const triGeo = new THREE.BufferGeometry();
    const triVerts = new Float32Array([
      0, 5.8, -0.2,
      -2.2, 0.05, 0.2,
      2.2, 0.05, 0.2
    ]);
    triGeo.setAttribute('position', new THREE.BufferAttribute(triVerts, 3));
    const triMat = new THREE.MeshBasicMaterial({
      color: 0xffdfaa,
      transparent: true,
      opacity: 0.12,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const triMesh = new THREE.Mesh(triGeo, triMat);
    scene.add(triMesh);

    // Soft rim accents for the characters
    const rimL = new THREE.PointLight(0xff6b57, 1.0, 5.0);
    rimL.position.set(-2.4, 1.8, -0.6);
    const rimR = new THREE.PointLight(0x5da9e9, 1.0, 5.0);
    rimR.position.set(2.4, 1.8, -0.6);
    scene.add(rimL, rimR);

    // Dim crowd atmospheric fill: audience bleachers remain moody silhouettes in the dark
    const crowdFillL = new THREE.PointLight(0x3e5272, 1.0, 7.0);
    crowdFillL.position.set(-3.8, 2.2, -1.0);
    const crowdFillR = new THREE.PointLight(0x3e5272, 1.0, 7.0);
    crowdFillR.position.set(3.8, 2.2, -1.0);
    scene.add(crowdFillL, crowdFillR);

    // ---------- Simple Geometric Audience Heads (Circles Left & Squares Right - No Details) ----------
    const crowdGroup = new THREE.Group();
    scene.add(crowdGroup);

    // Simple bench stands in the stadium darkness
    const benchMat = new THREE.MeshLambertMaterial({ color: 0x141a26 });
    const tiers = [
      { xDist: 2.85, y: 0.35, zMin: -2.9, zMax: 0.35 },
      { xDist: 3.55, y: 0.80, zMin: -3.2, zMax: 0.35 },
      { xDist: 4.25, y: 1.25, zMin: -3.5, zMax: 0.35 },
      { xDist: 4.95, y: 1.70, zMin: -3.8, zMax: 0.25 },
    ];

    tiers.forEach(t => {
      const len = t.zMax - t.zMin + 0.5;
      const midZ = (t.zMin + t.zMax) / 2;
      const bL = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.16, len), benchMat);
      bL.position.set(-t.xDist, t.y - 0.1, midZ);
      const bR = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.16, len), benchMat);
      bR.position.set(t.xDist, t.y - 0.1, midZ);
      crowdGroup.add(bL, bR);
    });

    const crowdColors = [0xff6b57, 0xffc53d, 0x4fb06d, 0x5da9e9, 0xb565d8, 0xfff8ec, 0xffa052, 0x3ac4b2];
    const spectators = [];

    // Left bleachers: CIRCLES (spheres - Pip's crowd)
    // Right bleachers: SQUARES (cubes - Blocky's crowd)
    // Clean, non-detailed geometric shapes
    const sphereGeo = new THREE.SphereGeometry(0.18, 14, 12);
    const boxGeo = new THREE.BoxGeometry(0.32, 0.32, 0.32);

    let headIdx = 0;
    tiers.forEach(t => {
      for (let z = t.zMin; z <= t.zMax; z += 0.44) {
        // Left side: Circle heads
        const colL = crowdColors[headIdx % crowdColors.length];
        const matL = new THREE.MeshLambertMaterial({ color: colL });
        const meshL = new THREE.Mesh(sphereGeo, matL);
        meshL.position.set(-t.xDist + (Math.random() - 0.5) * 0.10, t.y + 0.16, z + (Math.random() - 0.5) * 0.08);
        meshL.lookAt(0, 0.5, 0);
        crowdGroup.add(meshL);
        spectators.push({
          mesh: meshL, y0: meshL.position.y,
          ph: Math.random() * 6.28, sp: 2.2 + Math.random() * 2.0,
          amp: 0.03 + Math.random() * 0.035
        });

        // Right side: Square heads
        const colR = crowdColors[(headIdx + 3) % crowdColors.length];
        const matR = new THREE.MeshLambertMaterial({ color: colR });
        const meshR = new THREE.Mesh(boxGeo, matR);
        meshR.position.set(t.xDist + (Math.random() - 0.5) * 0.10, t.y + 0.16, z + (Math.random() - 0.5) * 0.08);
        meshR.lookAt(0, 0.5, 0);
        crowdGroup.add(meshR);
        spectators.push({
          mesh: meshR, y0: meshR.position.y,
          ph: Math.random() * 6.28, sp: 2.2 + Math.random() * 2.2,
          amp: 0.03 + Math.random() * 0.035
        });
        headIdx++;
      }
    });

    // Boxer 1: PIP (Bubble) - Coral gloves, gold shorts (scaled up for prominent focus)
    const p1 = buildBoxer(THREE, { variant: 'bubble' });
    p1.group.scale.setScalar(1.15);
    p1.group.position.set(-0.76, 0, 0.05);
    p1.group.rotation.y = Math.PI / 2 - 0.22;
    scene.add(p1.group);

    // Boxer 2: Rival BLOCKY (square fighter to face round Pip)
    let rivalVariant = 'blocky';
    try {
      const saved = localStorage.getItem('boxing:npc') || '';
      const ko = JSON.parse(localStorage.getItem('boxing:ko') || 'null');
      if (saved.startsWith('proto:')) {
        const v = saved.split(':')[1], need = VARIANT_INFO[v]?.koAvg;
        const open = VARIANTS.includes(v) && (need == null || (ko && ko.n > 0 && ko.sum / ko.n <= need));
        if (open) rivalVariant = v;
      }
    } catch {}
    const p2 = buildBoxer(THREE, { variant: rivalVariant });
    p2.group.scale.setScalar(1.15);
    p2.group.position.set(0.76, 0, 0.05);
    p2.group.rotation.y = -Math.PI / 2 + 0.22;
    scene.add(p2.group);

    // Perspective camera with elevated isometric tilt
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 50);
    function updateCamera() {
      const aspect = window.innerWidth / window.innerHeight;
      camera.aspect = aspect;
      const zDist = aspect < 1 ? Math.max(5.8, 5.8 / aspect * 0.95) : 5.75;
      const yDist = aspect < 1 ? 3.5 : 3.3;
      camera.position.set(0, yDist, zDist);
      camera.lookAt(0, 0.52, 0);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    }
    updateCamera();
    window.addEventListener('resize', updateCamera);

    // Smooth, seamless sparring choreography loop (continuous 6.8s cycle)
    let t = 0;

    function renderFrame() {
      requestAnimationFrame(renderFrame);
      const dt = 0.016;
      t += dt;

      // 6.8-second seamlessly repeating sparring cycle with smooth sine easing
      const loopTime = t % 6.8;

      if (loopTime < 1.4) {
        // Phase 1: Pip throws a smooth jab (bell curve 0 -> 1 -> 0)
        const p = loopTime / 1.4;
        const jabT = Math.sin(p * Math.PI);
        p1.pose('jab', jabT);
        p2.pose('block', jabT * 0.85);
      } else if (loopTime < 3.4) {
        // Phase 2: Smooth idle bobbing and weaving
        const idle1 = (Math.sin(t * 3.6) + 1) * 0.5;
        const idle2 = (Math.cos(t * 3.4) + 1) * 0.5;
        p1.pose('idle', idle1);
        p2.pose('idle', idle2);
      } else if (loopTime < 4.8) {
        // Phase 3: Rival throws a smooth cross (bell curve 0 -> 1 -> 0)
        const p = (loopTime - 3.4) / 1.4;
        const jabT = Math.sin(p * Math.PI);
        p2.pose('jab', jabT);
        p1.pose('block', jabT * 0.85);
      } else {
        // Phase 4: Smooth idle bobbing and weaving back into Phase 1
        const idle1 = (Math.sin(t * 3.6) + 1) * 0.5;
        const idle2 = (Math.cos(t * 3.4) + 1) * 0.5;
        p1.pose('idle', idle1);
        p2.pose('idle', idle2);
      }

      // Smooth crowd head bobbing
      spectators.forEach(s => {
        s.mesh.position.y = s.y0 + Math.sin(t * s.sp + s.ph) * s.amp;
      });

      // Smooth spotlight beam breathing
      beamMat.opacity = 0.22 + Math.sin(t * 1.6) * 0.035;

      p1.tick(dt);
      p2.tick(dt);

      renderer.render(scene, camera);
    }
    renderFrame();
  })();
</script>
</body>
</html>
