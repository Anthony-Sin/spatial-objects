<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the dock — loading shift</title>
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/loaders/GLTFLoader.js": "./vendor/three/GLTFLoader.js"
} }
</script>
<style>
  :root { --paper:#f3ede1; --ink:#33291d; --hair:#b9ac93; --accent:#d8a03a; --accent2:#4f8f6b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #16130f; }
  body { font-family: "Avenir Next","Futura","Trebuchet MS",system-ui,sans-serif; color: var(--paper); }
  #world { position: fixed; inset: 0; display: block; }
  #hands { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  .mast { position: fixed; top: 22px; left: 30px; right: 30px; z-index: 20;
    display: flex; align-items: baseline; gap: 20px; pointer-events: none; }
  .wm { font-family: Georgia,serif; font-size: 20px; letter-spacing: .14em; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .wm span { display:block; font-style: italic; font-size: 9px; letter-spacing: .26em;
    color: rgba(243,237,225,.55); text-transform: uppercase; margin-top: 2px; }
  .status { font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: #9fd8b7; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .back { margin-left: auto; font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: rgba(243,237,225,.7); text-decoration: none; border-bottom: 1px solid rgba(243,237,225,.35);
    padding-bottom: 2px; pointer-events: auto; }
  .back + .back { margin-left: 14px; }

  .card { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 20;
    min-width: 340px; border: 1px solid rgba(243,237,225,.35); background: rgba(22,19,15,.72);
    backdrop-filter: blur(8px); border-radius: 4px; padding: 12px 18px 14px; }
  .card .who { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #d8a03a; }
  .card .job { font-family: Georgia,serif; font-style: italic; font-size: 19px; margin: 4px 0 6px; }
  .card .how { font-size: 12.5px; font-weight: 500; letter-spacing: .05em;
    color: rgba(255,250,238,.92); line-height: 1.5; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .card .prog { margin-top: 9px; height: 4px; background: rgba(243,237,225,.15); border-radius: 2px; overflow: hidden; }
  .card .prog i { display: block; height: 100%; width: 0%; background: var(--accent2); transition: width .2s; }

  .score { position: fixed; top: 84px; right: 30px; z-index: 20; text-align: right; }
  .score .n { font-family: Georgia,serif; font-size: 34px; }
  .score .l { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: rgba(243,237,225,.55); }

  .peep { position: fixed; left: 30px; bottom: 30px; z-index: 20; width: 238px;
    border: 1px solid rgba(243,237,225,.4); border-radius: 4px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .peep video { width: 100%; display: block; transform: scaleX(-1); }
  .peep .tag { position: absolute; left: 0; right: 0; bottom: 0; font-size: 8.5px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--paper);
    background: rgba(0,0,0,.55); padding: 4px 8px; }
  .peep canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .legend { position: fixed; right: 30px; bottom: 30px; z-index: 20; text-align: right;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,250,238,.8); text-shadow: 0 1px 6px rgba(0,0,0,.85); line-height: 2; }
  .legend b { color: #fff; }

  .peep[hidden] { display: none !important; }
  .replay { margin-top: 12px; padding: 8px 14px; color: #17201b;
    background: #a5eac3; border: 0; border-radius: 3px; font: 700 11px system-ui;
    letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
  .replay:hover { background: #d7f5e5; }
  @media (max-width: 700px) {
    .mast { top: 12px; left: 14px; right: 14px; flex-wrap: wrap; gap: 6px 12px; }
    .wm { width: 100%; font-size: 17px; }
    .status { font-size: 8px; }
    .back { margin-left: 0; font-size: 9px; }
    .card { top: 94px; width: calc(100% - 28px); min-width: 0; padding: 10px 12px; }
    .card .job { font-size: 17px; }
    .card .how { font-size: 11px; }
    .score { top: 18px; right: 14px; }
    .score .n { font-size: 23px; }
    .peep { left: 14px; bottom: 14px; width: 116px; }
    .legend { right: 14px; bottom: 14px; font-size: 8px; line-height: 1.6; max-width: 55vw; }
  }

  .flash { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); z-index: 30;
    font-family: Georgia,serif; font-style: italic; font-size: 34px; color: #9fd8b7;
    text-shadow: 0 2px 18px rgba(0,0,0,.8); opacity: 0; transition: opacity .4s; pointer-events: none; }
</style>
</head>
<body>
  <canvas id="world"></canvas>
  <canvas id="hands"></canvas>

  <header class="mast">
    <div class="wm">THE DOCK<span>loading shift · scan & stow</span></div>
    <div class="status" data-status>booting…</div>
    <a class="back" href="./job.html">← the bay</a>
    <a class="back" href="./theatre.html">theatre</a>
    <a class="back" href="./">app</a>
  </header>

  <div class="card">
    <div class="who">DISPATCH · MANIFEST</div>
    <div class="job" data-job>…</div>
    <div class="how" data-how></div>
    <div class="prog"><i data-prog></i></div>
  </div>

  <div class="score"><div class="n" data-score>0</div><div class="l">dock points</div></div>
  <div class="flash" data-flash></div>

  <div class="peep">
    <video data-cam muted playsinline></video>
    <canvas data-nose></canvas>
    <div class="tag" data-peep>face · —</div>
  </div>

  <div class="legend">
    <div><b>head</b> — look · <b>lean</b> — zoom · <b>c</b> — recenter</div>
    <div><b>right pinch</b> — scan & work</div>
    <div><b>left pinch</b> — lift & place freight</div>
    <div><b>point</b> — aim · <b>fist</b> — pull it to you</div>
    <div><b>mouse</b> — left/right drag · <b>shift</b> drag to look</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import Hands from './shared/hands.js';
    import { Face } from './shared/face.js';
    import { drawGlove } from './shared/glove.js';

    const params = new URLSearchParams(location.search);
    const $ = (s) => document.querySelector(s);
    const status = $('[data-status]');

    /* ================= renderer / stage ================= */
    const cvs = $('#world');
    const ren = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
    ren.setPixelRatio(Math.min(devicePixelRatio, 2));
    ren.shadowMap.enabled = true;
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x16130f, 8, 60);
    scene.background = new THREE.Color(0x1d1812);
    const cam = new THREE.PerspectiveCamera(70, 1, .05, 200);
    cam.position.set(0, 0, 0);

    scene.add(new THREE.HemisphereLight(0xf3ede1, 0x33291d, 1.1));
    const key = new THREE.DirectionalLight(0xfff2dd, 1.5);
    key.position.set(4, 8, 3); key.castShadow = true; scene.add(key);
    const dockLight = new THREE.PointLight(0x9fd4ff, 0, 6); scene.add(dockLight);

    /* ================= assets ================= */
    const GL = new GLTFLoader();
    const load = (n) => new Promise((res, rej) =>
      GL.load(`./vendor/models/glb/${n}.glb`, g => res(g.scene), undefined, rej));
    const fit = (obj, size) => {
      const b = new THREE.Box3().setFromObject(obj);
      const s = size / Math.max(...b.getSize(new THREE.Vector3()).toArray());
      obj.scale.setScalar(s);
      return obj;
    };

    const M = {};
    for (const n of ['pallet','forklift','cardboard-delivery-box','fuel-drum',
      'kfactory/box-large','kfactory/conveyor-long-stripe','kfactory/scanner-low',
      'kfactory/structure-wall','kfactory/structure-window-wide','kfactory/structure-doorway',
      'kfactory/floor-large','kfactory/door-wide-closed'])
      M[n.split('/').pop()] = await load(n).catch(() => null);

    const grabbables = [], set = new THREE.Group(); scene.add(set);
    const put = (obj, x, surfY, z, grab = false, tag = '') => {
      obj.position.set(x, 0, z);
      const b = new THREE.Box3().setFromObject(obj);
      obj.position.y = surfY - b.min.y;
      set.add(obj);
      obj.traverse(o => { o.castShadow = o.receiveShadow = true; });
      if (grab) { obj.userData.grab = true; obj.userData.tag = tag; grabbables.push(obj); }
      obj.userData.full = obj.scale.x;
      return obj;
    };

    /* spawn-on-demand — freight materializes when the manifest calls for it */
    const poppers = [];
    const park = (o) => { if (o) { o.visible = false; o.userData.parked = true; } };
    const live = (o) => {
      if (!o) return;
      o.visible = true; o.userData.parked = false;
      if (!o.userData.full) o.userData.full = o.scale.x;
      o.scale.setScalar(.02); poppers.push(o);
    };
    const popTick = () => {
      for (let i = poppers.length - 1; i >= 0; i--) {
        const o = poppers[i];
        const s = THREE.MathUtils.lerp(o.scale.x, o.userData.full, .18);
        o.scale.setScalar(s);
        if (s > o.userData.full * .97) { o.scale.setScalar(o.userData.full); poppers.splice(i, 1); }
      }
    };

    const FLOOR = -2.35;

    /* the room — same modular factory kit as the bay */
    const ROOM_H = 3.9, WALL_Z = -6.4, WALL_X = 5.6;
    const normH = (o, h) => {
      const b = new THREE.Box3().setFromObject(o);
      o.scale.setScalar(h / (b.max.y - b.min.y));
      return o;
    };
    let doorX = null;
    const wallRun = (names, x0, x1, z) => {
      let cx = x0, i = 0;
      while (cx < x1 - .01) {
        const n = names[i % names.length], proto = M[n]; if (!proto) break;
        const m = normH(proto.clone(), ROOM_H);
        const b = new THREE.Box3().setFromObject(m);
        m.position.set(cx - b.min.x, FLOOR - b.min.y, z - (b.min.z + b.max.z) / 2);
        m.userData.room = true; set.add(m);
        if (n === 'structure-doorway') doorX = cx + (b.max.x - b.min.x) / 2;
        cx += b.max.x - b.min.x; i++;
      }
    };
    const wallRunZ = (names, z0, z1, x, rotY) => {
      let cz = z0, i = 0;
      while (cz < z1 - .01) {
        const proto = M[names[i % names.length]]; if (!proto) break;
        const m = normH(proto.clone(), ROOM_H); m.rotation.y = rotY;
        const b = new THREE.Box3().setFromObject(m);
        m.position.set(x - (b.min.x + b.max.x) / 2, FLOOR - b.min.y, cz - b.min.z);
        m.userData.room = true; set.add(m); cz += b.max.z - b.min.z; i++;
      }
    };
    wallRun(['structure-wall','structure-window-wide','structure-wall',
             'structure-window-wide','structure-wall','structure-window-wide',
             'structure-wall','structure-window-wide'], -WALL_X, WALL_X, WALL_Z);
    if (M['door-wide-closed'] && doorX !== null) {
      const d = normH(M['door-wide-closed'].clone(), 2.3);
      const b = new THREE.Box3().setFromObject(d);
      d.position.set(doorX - (b.min.x + b.max.x) / 2, FLOOR - b.min.y, WALL_Z - .05);
      d.userData.room = true; set.add(d);
    }
    wallRunZ(['structure-window-wide','structure-wall','structure-window-wide','structure-wall'],
             -6.4, -0.4, -WALL_X, Math.PI / 2);
    wallRunZ(['structure-wall','structure-window-wide','structure-wall','structure-window-wide'],
             -6.4, -0.4, WALL_X, -Math.PI / 2);
    if (M['floor-large']) {
      const proto = M['floor-large'];
      const fb = new THREE.Box3().setFromObject(proto);
      const fw = fb.max.x - fb.min.x, fd = fb.max.z - fb.min.z;
      for (let x = -7; x < 7; x += fw)
        for (let z = -8.5; z < 1.5; z += fd) {
          const f = proto.clone();
          const b = new THREE.Box3().setFromObject(f);
          f.position.set(x - b.min.x, FLOOR - b.max.y, z - b.min.z);
          f.traverse(o => { o.receiveShadow = true; });
          f.userData.room = true; f.userData.floorTile = true; set.add(f);
        }
    }

    // Refinish the shared modular kit for this room's purpose. Keep the model
    // geometry and window detail, but give each training space its own palette.
    const roomColors = { panel: 0xb2b4a5, frame: 0x626963, accent: 0xc59d4d, floor: 0x737971 };
    for (const part of set.children) {
      if (!part.userData.floorTile) continue;
      part.traverse(mesh => {
        if (!mesh.isMesh) return;
        const c = mesh.material?.color;
        const color = part.userData.floorTile ? roomColors.floor :
          (c && c.r > c.g * 1.3 && c.g > c.b * 1.15) ? roomColors.accent :
          (c && (c.r + c.g + c.b) / 3 > .28) ? roomColors.panel : roomColors.frame;
        mesh.material = part.userData.floorTile
          ? new THREE.MeshStandardMaterial({ color, roughness: .88 })
          : new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
        mesh.receiveShadow = true;
      });
    }

    // A shutter behind the pallet makes the freight bay read as a loading dock.
    const shutter = new THREE.Group();
    const shutterMat = new THREE.MeshBasicMaterial({ color: 0x566269 });
    const ribMat = new THREE.MeshBasicMaterial({ color: 0x343e43 });
    const shutterPanel = new THREE.Mesh(new THREE.BoxGeometry(3.3, 2.4, .07), shutterMat);
    shutter.add(shutterPanel);
    for (let y = -1.05; y < 1.15; y += .26) {
      const rib = new THREE.Mesh(new THREE.BoxGeometry(3.35, .025, .08), ribMat);
      rib.position.y = y; rib.position.z = .05; shutter.add(rib);
    }
    shutter.position.set(0, -.82, -6.02); set.add(shutter);

    // Painted loading lanes give the pallet and conveyor a readable floor plan.
    const laneMat = new THREE.MeshBasicMaterial({ color: 0xe3b453, transparent: true, opacity: .72 });
    for (const x of [-2.05, 2.05]) {
      const lane = new THREE.Mesh(new THREE.BoxGeometry(.045, .008, 4.3), laneMat);
      lane.position.set(x, FLOOR + .015, -3.5); set.add(lane);
    }

    /* ================= the dock set ================= */
    // pallet dead center — the working drop zone
    let palletObj = null, palletTop = FLOOR;
    if (M.pallet) {
      palletObj = put(fit(M.pallet, 1.1), 0, FLOOR, -3.7);
      palletTop = new THREE.Box3().setFromObject(palletObj).max.y;
    }
    const palletRing = new THREE.Mesh(
      new THREE.RingGeometry(.45, .55, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xd8a03a, side: THREE.DoubleSide, transparent: true, opacity: .7 }));
    palletRing.position.set(0, palletTop + .02, -3.7); set.add(palletRing);
    const palletZone = new THREE.Box3(
      new THREE.Vector3(-.55, palletTop - .3, -4.25), new THREE.Vector3(.55, palletTop + .6, -3.15));

    // three cardboard crates scattered on the floor — grab, stack
    const crates = [], labelRings = [];
    if (M['cardboard-delivery-box']) {
      const spots = [[-1.5, -2.6], [1.2, -2.5], [-.4, -1.9]];
      for (const [x, z] of spots) {
        const c = put(fit(M['cardboard-delivery-box'].clone(), .42), x, FLOOR, z, true, 'crate');
        crates.push(c);
        // shipping label ring rides on the crate — scanning target
        const r = new THREE.Mesh(
          new THREE.RingGeometry(.05, .09, 20),
          new THREE.MeshBasicMaterial({ color: 0xd8a03a, side: THREE.DoubleSide, transparent: true, opacity: .9 }));
        r.position.set(0, .22, .12); r.rotation.x = -.4;
        c.add(r); labelRings.push(r);
      }
    }

    // scanner by the conveyor — the sort tool
    let scannerObj = null;
    if (M['scanner-low']) scannerObj = put(fit(M['scanner-low'], .5), 2.0, FLOOR, -2.6, true, 'scanner');

    // conveyor down the right side — the out lane
    let conveyorTop = FLOOR;
    if (M['conveyor-long-stripe']) {
      const conveyor = put(fit(M['conveyor-long-stripe'], 2.2), 3.4, FLOOR, -4.0);
      conveyorTop = new THREE.Box3().setFromObject(conveyor).max.y;
    }
    const outRing = new THREE.Mesh(
      new THREE.RingGeometry(.3, .37, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x4f8f6b, side: THREE.DoubleSide, transparent: true, opacity: .7 }));
    outRing.position.set(3.4, conveyorTop + .025, -4.0); set.add(outRing);

    // forklift + drum — the heavy work
    let forkObj = null, drumObj = null;
    if (M.forklift)  forkObj = put(fit(M.forklift, 1.3), -3.3, FLOOR, -4.2, true, 'forklift');
    if (M['fuel-drum']) drumObj = put(fit(M['fuel-drum'], .8), -2.2, FLOOR, -3.0, true, 'drum');
    let crateObj = null;
    if (M['box-large']) crateObj = put(fit(M['box-large'], .5), -1.1, FLOOR, -4.5, true, 'crate2');

    // hazmat corner for the drum + forklift parking ring
    const drumZone = new THREE.Box3(
      new THREE.Vector3(-4.9, FLOOR - .2, -5.6), new THREE.Vector3(-3.7, -1.4, -4.4));
    const drumRing = new THREE.Mesh(
      new THREE.RingGeometry(.34, .42, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xd8a03a, side: THREE.DoubleSide, transparent: true, opacity: .7 }));
    drumRing.position.set(-4.3, FLOOR + .02, -5.0); set.add(drumRing);
    const forkRing = new THREE.Mesh(
      new THREE.RingGeometry(.55, .65, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x4f8f6b, side: THREE.DoubleSide, transparent: true, opacity: .7 }));
    forkRing.position.set(2.4, FLOOR + .02, -2.6); set.add(forkRing);

    /* ================= the dispatcher ================= */
    const JOBS = [
      { id:'stack', name:'Job 00 — stack the pallet',
        how:'LEFT pinch each crate — carry it onto the gold ring on the pallet. Three up, three down.' },
      { id:'scan',  name:'Job 01 — scan the manifest',
        how:'RIGHT pinch the scanner — hold its ring over each crate\'s label until it beeps. All three.' },
      { id:'drum',  name:'Job 02 — hazmat the drum',
        how:'LEFT pinch the fuel drum — wheel it into the hazmat corner, back left by the wall.' },
      { id:'park',  name:'Job 03 — park the lift',
        how:'Pinch the forklift and drag it into the green parking ring. Mind the paint lines.' },
      { id:'out',   name:'Job 04 — send the last crate',
        how:'LEFT pinch the big crate on the floor — place it on the conveyor\'s green ring. Line\'s rolling.' },
    ];
    let ji = 0, score = 0, jobDone = false;
    const elJob = $('[data-job]'), elHow = $('[data-how]'), elProg = $('[data-prog]');
    const flash = (t) => { const f = $('[data-flash]'); f.textContent = t;
      f.style.opacity = 1; setTimeout(() => f.style.opacity = 0, 1400); };
    const setJob = (i) => {
      ji = i % JOBS.length; jobDone = false;
      elJob.textContent = JOBS[ji].name; elHow.textContent = JOBS[ji].how;
      elProg.style.width = '0%';
    };
    const award = (n, msg) => { score += n; $('[data-score]').textContent = score; flash(msg || `+${n}`); };
    const complete = (msg) => {
      if (jobDone) return; jobDone = true;
      award(100, msg || 'JOB DONE — clean work');
      if (ji < JOBS.length - 1) setTimeout(() => setJob(ji + 1), 1600);
      else setTimeout(() => {
        elJob.textContent = 'Shift complete';
        elHow.textContent = `${JOBS.length} tasks complete · ${score} points. Ready for another run?`;
        elProg.style.width = '100%';
        const replay = document.createElement('button');
        replay.className = 'replay'; replay.textContent = 'Replay shift';
        replay.onclick = () => location.reload();
        document.querySelector('.card').append(replay);
      }, 1600);
    };
    setJob(0);

    /* ================= webcam + trackers ================= */
    const video = $('[data-cam]');
    try {
      if (params.get('vid')) {
        video.src = params.get('vid'); video.loop = true; video.muted = true; await video.play();
      } else {
        video.srcObject = await navigator.mediaDevices.getUserMedia(
          { video: { width: 960, height: 540 }, audio: false });
        await video.play();
      }
      status.textContent = 'camera live';
    } catch { status.textContent = 'mouse mode'; $('.peep').hidden = true; }
    let hands = null, face = null;
    if (video.srcObject || video.src) {
      try { face = await Face.create(video, './vendor/mediapipe'); status.textContent = `face · ${face.delegate}`; } catch {}
      try { hands = await Hands.create(video, './vendor/mediapipe'); } catch {}
    }

    /* ================= view control (nose-look + drag) ================= */
    const BASE_PITCH = -20;
    const view = { yaw: 0, pitch: BASE_PITCH, fov: 72 }, tgt = { yaw: 0, pitch: BASE_PITCH, fov: 72 };
    const taskView = { stack:{yaw:0,fov:72}, scan:{yaw:0,fov:60}, drum:{yaw:-20,fov:68}, park:{yaw:14,fov:70}, out:{yaw:16,fov:66} };
    let framedJob = -1;
    let noseRef = null, savedRef = null, lostAt = 0, hadRef = false;
    const noseTick = () => {
      if (!face?.state.found) {
        if (!lostAt) lostAt = performance.now();
        if (performance.now() - lostAt > 2500) { savedRef = noseRef; noseRef = null; }
        return;
      }
      lostAt = 0;
      const n = face.state.nose;
      if (!noseRef) {
        if (hadRef && savedRef) {
          noseRef = savedRef;
          tgt.yaw = view.yaw; tgt.pitch = view.pitch;
        } else {
          noseRef = { x: n.x, y: n.y, size: face.state.size };
        }
        hadRef = true;
      }
      const dx = n.x - noseRef.x, dy = n.y - noseRef.y, DB = .028;
      const mx = Math.abs(dx) < DB ? 0 : dx - Math.sign(dx) * DB;
      const my = Math.abs(dy) < DB ? 0 : dy - Math.sign(dy) * DB;
      tgt.yaw   += (taskView[JOBS[ji].id].yaw + mx * 260 - tgt.yaw) * .12;
      tgt.pitch += (BASE_PITCH - my * 160 - tgt.pitch) * .12;
      if (Math.abs(n.x - .5) < .06 && Math.abs(n.y - .47) < .06) {
        tgt.yaw += (taskView[JOBS[ji].id].yaw - tgt.yaw) * .18;
        tgt.pitch += (BASE_PITCH - tgt.pitch) * .18;
      }
      tgt.yaw = THREE.MathUtils.clamp(tgt.yaw, -55, 55);
      tgt.pitch = THREE.MathUtils.clamp(tgt.pitch, -34, 32);
      const z = THREE.MathUtils.clamp((face.state.size - noseRef.size) / noseRef.size, -.3, .45);
      tgt.fov = taskView[JOBS[ji].id].fov - z * 25;
      $('[data-peep]').textContent = 'face · locked';
    };

    /* ================= hand cursor → 3d ================= */
    const ray = new THREE.Raycaster();
    const workPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 3.1);
    const grabPlane = new THREE.Plane();
    const hand3 = new THREE.Vector3(), camDir = new THREE.Vector3();
    let grabbed = null, grabSide = null, grabOff = new THREE.Vector3();
    let grabDepth = 2.4, pullDepth = 2.4;
    const rollQ = new THREE.Quaternion();
    const tiltQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -.22);
    const cursor3D = (nx, ny, out, plane) => {
      const nd = new THREE.Vector2(nx * 2 - 1, -(ny * 2 - 1));
      ray.setFromCamera(nd, cam);
      return ray.ray.intersectPlane(plane || workPlane, out) ? out : null;
    };
    const hit = (nx, ny) => {
      const nd = new THREE.Vector2(nx * 2 - 1, -(ny * 2 - 1));
      ray.setFromCamera(nd, cam);
      for (const hh of ray.intersectObjects(grabbables, true)) {
        let o = hh.object; while (o && !o.userData.grab) o = o.parent;
        if (o && !o.userData.parked) return o;
      }
      return null;
    };

    const handsOf = (hs) => (hs.hands || []).filter(Boolean);
    const sidePinch = (hs, s) =>
      handsOf(hs).find(h => h.side === s && h.kind === 'pinch')?.pinchAt
      || (handsOf(hs).some(h => h.side) ? null : hs.pinch);

    let aimed = null, powerObj = null, powerSide = null, powerPos = null;
    const forcePull = (hs) => {
      const pt = handsOf(hs).find(h => h.kind === 'point');
      const fk = handsOf(hs).find(h => h.kind === 'fist');
      if (pt && !grabbed && !powerObj) {
        aimed = hit(pt.indexTip.x, pt.indexTip.y);
      } else if (!fk) { aimed = null; }
      if (fk && aimed && !powerObj) { powerObj = aimed; powerSide = fk.side; aimed = null; }
      if (powerObj) {
        const f = handsOf(hs).find(h => h.side === powerSide && h.kind === 'fist')
               || handsOf(hs).find(h => h.kind === 'fist');
        if (f && !grabbed) {
          const pl = f.palm || f.wrist;
          const nd = new THREE.Vector2((pl.x * .76 + .12) * 2 - 1, -((pl.y * .76 + .1) * 2 - 1));
          ray.setFromCamera(nd, cam);
          const dst = new THREE.Vector3();
          ray.ray.at(2.0, dst);
          dst.y = Math.max(dst.y, -1.55);
          powerObj.position.lerp(dst, .16);
          powerPos = pl;
        } else { powerObj = null; powerPos = null; }
      }
    };

    /* ================= per-job interaction ================= */
    let scanProg = 0;
    const scanned = new Set();
    const ringW = new THREE.Vector3();

    const jobTick = (hs) => {
      const rp = sidePinch(hs, 'right'), lp = sidePinch(hs, 'left');
      const job = JOBS[ji];

      forcePull(hs);

      for (const [p, s] of [[lp, 'left'], [rp, 'right']]) {
        if (p && !grabbed) {
          const o = hit(p.x, p.y);
          if (o) {
            // Slide parts across their work surface. Only the hat and lever
            // need vertical travel. Pulling every object toward the camera
            // made placement targets unreachable.
            const lift = o.userData.tag === 'hardhat' || o.userData.tag === 'lever';
            const center = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
            grabPlane.set(lift ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0),
              lift ? -center.z : -center.y);
            if (!cursor3D(p.x, p.y, hand3, grabPlane)) continue;
            grabbed = o; grabSide = s; o.userData.freeLift = lift;
            grabOff.copy(o.position).sub(hand3);

          }
        }
      }
      if (grabbed && (grabSide === 'left' ? !lp : !rp)) {
        grabbed = null; grabSide = null;
      }
      if (grabbed) {
        const p = grabSide === 'left' ? lp : rp;
        if (p && cursor3D(p.x, p.y, hand3, grabPlane)) {
          const next = hand3.add(grabOff);
          next.x = THREE.MathUtils.clamp(next.x, -5, 5);
          next.z = THREE.MathUtils.clamp(next.z, -6.2, -1.25);
          if (grabbed.userData.freeLift) next.y = THREE.MathUtils.clamp(next.y, -2.5, .35);
          grabbed.position.copy(next);
        }
        const hr = handsOf(hs).find(h => h.side === grabSide && h.lm?.length >= 21);
        if (hr) {
          const w = hr.lm[0], k9 = hr.lm[9];
          const ang = Math.atan2(k9.y - w.y, (1 - k9.x) - (1 - w.x));
          cam.getWorldDirection(camDir);
          rollQ.setFromAxisAngle(camDir, ang + Math.PI / 2).multiply(tiltQ);
          grabbed.quaternion.slerp(rollQ, .12);
        }
      }

      if (job.id === 'stack') {
        const up = crates.filter(c => palletZone.containsPoint(c.position)).length;
        elProg.style.width = `${up / crates.length * 100}%`;
        if (up >= crates.length && !jobDone) complete('PALLET STACKED — tight load');
      }
      if (job.id === 'scan') {
        const ok = grabbed === scannerObj;
        if (ok && rp && cursor3D(rp.x, rp.y, hand3)) {
          for (const r of labelRings) {
            if (scanned.has(r)) continue;
            r.getWorldPosition(ringW);
            const screen = ringW.clone().project(cam);
            if (Math.hypot((screen.x + 1) / 2 - rp.x,
              (1 - screen.y) / 2 - rp.y) < .065) {
              scanned.add(r);
              r.material.color.set(0x4f8f6b);           // label goes green — beeped
              award(20, 'SCANNED');
              dockLight.intensity = 3; dockLight.position.copy(ringW).y += .2;
            }
          }
          scanProg = scanned.size / labelRings.length * 100;
          elProg.style.width = `${scanProg}%`;
          if (scanned.size >= labelRings.length) complete('MANIFEST SCANNED — all labels logged');
        } else dockLight.intensity = 0;
      }
      if (job.id === 'drum') {
        const inZ = drumObj && drumZone.containsPoint(drumObj.position);
        elProg.style.width = inZ ? '100%' : '0%';
        if (inZ && grabbed !== drumObj) complete('DRUM SECURED — hazmat corner');
      }
      if (job.id === 'park') {
        if (forkObj && !jobDone) {
          const tb = new THREE.Box3().setFromObject(forkObj);
          const c = tb.getCenter(new THREE.Vector3());
          const d = Math.hypot(c.x - forkRing.position.x, c.z - forkRing.position.z);
          elProg.style.width = `${Math.max(0, 100 - d * 100)}%`;
          if (d < .4 && grabbed !== forkObj) complete('LIFT PARKED — inside the lines');
        }
      }
      if (job.id === 'out') {
        const inZ = crateObj && Math.hypot(crateObj.position.x - outRing.position.x,
          crateObj.position.z - outRing.position.z) < .58;
        elProg.style.width = inZ ? '100%' : '0%';
        if (inZ && grabbed !== crateObj) {
          const box = new THREE.Box3().setFromObject(crateObj);
          crateObj.position.set(outRing.position.x, crateObj.position.y + conveyorTop - box.min.y,
            outRing.position.z);
          complete('CRATE AWAY — line\'s rolling');
        }
      }
    };

    /* ================= glove overlay ================= */
    const hc = $('#hands'), hx = hc.getContext('2d');
    const drawOverlay = (hs) => {
      hx.clearRect(0, 0, hc.width, hc.height);
      for (const hnd of handsOf(hs)) {
        if (!hnd.lm) continue;
        const P = hnd.lm.map(p => ({ x: (1 - p.x) * hc.width, y: p.y * hc.height }));
        drawGlove(hx, P, {
          kind: hnd.kind, side: hnd.side,
          pinchAt: hnd.pinchAt ? { x: hnd.pinchAt.x * hc.width, y: hnd.pinchAt.y * hc.height } : null,
        });
      }
      const cur = hs.pinch || hs.point;
      if (cur) {
        hx.beginPath(); hx.arc(cur.x * hc.width, cur.y * hc.height, hs.pinch ? 13 : 9, 0, 7);
        hx.strokeStyle = hs.pinch ? '#d8a03a' : 'rgba(243,237,225,.85)';
        hx.lineWidth = hs.pinch ? 3 : 2; hx.stroke();
      }
      const proj = (o) => {
        const v = o.getWorldPosition(new THREE.Vector3()).project(cam);
        return v.z < 1 ? { x: (v.x + 1) / 2 * hc.width, y: (1 - v.y) / 2 * hc.height } : null;
      };
      // Keep the current action in view; future job targets stay quiet.
      const task = JOBS[ji].id;
      const focus = { stack:crates.find(c => !palletZone.containsPoint(c.position)), scan:scannerObj, drum:drumObj, park:forkObj, out:crateObj };
      const destination = { stack:palletRing, scan:crates.find(c => !scanned.has(labelRings[crates.indexOf(c)])), drum:drumRing, park:forkRing, out:outRing };
      const mark = (o, label, color) => {
        if (!o || !o.visible || o.userData.parked) return;
        const v = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()).project(cam);
        if (v.z < -1 || v.z > 1) return;
        const x = (v.x + 1) * .5 * hc.width, y = (1 - v.y) * .5 * hc.height;
        if (x < 22 || x > hc.width - 22 || y < 200 || y > hc.height - 45) return;
        const pulse = 18 + Math.sin(performance.now() / 320) * 3;
        hx.beginPath(); hx.arc(x, y, pulse, 0, Math.PI * 2);
        hx.strokeStyle = color; hx.lineWidth = 2.5; hx.stroke();
        hx.font = '700 11px system-ui'; hx.textAlign = 'center';
        const w = hx.measureText(label).width + 18;
        hx.fillStyle = 'rgba(15,20,19,.84)'; hx.fillRect(x - w/2, y - 46, w, 21);
        hx.fillStyle = color; hx.fillText(label, x, y - 31); hx.textAlign = 'start';
      };
      if (!jobDone) {
        mark(focus[task], 'GRAB / WORK', '#ffe0a0');
        if (destination[task] !== focus[task]) mark(destination[task], 'PLACE / TARGET', '#a5eac3');
      }
      if (aimed) {
        const a = proj(aimed);
        if (a) {
          hx.setLineDash([4, 4]); hx.beginPath(); hx.arc(a.x, a.y, 16, 0, 7);
          hx.strokeStyle = '#d8a03a'; hx.lineWidth = 2; hx.stroke(); hx.setLineDash([]);
          hx.font = '600 9px system-ui'; hx.fillStyle = '#d8a03a';
          hx.fillText('FIST TO PULL', a.x - 30, a.y - 22);
        }
      }
      if (powerObj && powerPos) {
        const a = proj(powerObj), px = { x: powerPos.x * hc.width, y: powerPos.y * hc.height };
        if (a) {
          hx.setLineDash([6, 5]); hx.beginPath(); hx.moveTo(px.x, px.y); hx.lineTo(a.x, a.y);
          hx.strokeStyle = 'rgba(159,212,255,.8)'; hx.lineWidth = 2; hx.stroke(); hx.setLineDash([]);
        }
      }
    };

    /* nose dot on the peephole */
    const nc = $('[data-nose]'), nx = nc.getContext('2d');
    const noseDot = () => {
      const w = nc.width = nc.clientWidth, h = nc.height = nc.clientHeight;
      nx.clearRect(0, 0, w, h);
      if (face?.state.found) {
        nx.beginPath(); nx.arc(face.state.nose.x * w, face.state.nose.y * h, 4, 0, 7);
        nx.fillStyle = '#d8a03a'; nx.fill();
      }
    };

    /* ================= pointer controls ================= */
    // Click and drag works with no camera and is also available alongside hand
    // tracking. Shift-drag looks around; left/right drag act as the two hands.
    let orbit = null, mouseSide = null;
    const mouse = { x: .5, y: .5, active: false };
    const mouseHands = () => {
      const p = { x: mouse.x, y: mouse.y };
      const h = mouseSide ? { side: mouseSide, kind: 'pinch', pinchAt: p } : null;
      return { hands: h ? [h] : [], pinch: mouseSide ? p : null };
    };
    cvs.addEventListener('contextmenu', e => e.preventDefault());
    cvs.addEventListener('pointerdown', e => {
      cvs.setPointerCapture(e.pointerId);
      mouse.x = e.clientX / innerWidth; mouse.y = e.clientY / innerHeight;
      mouse.active = true;
      if (e.shiftKey || e.button === 1) orbit = { x: e.clientX, y: e.clientY };
      else mouseSide = e.button === 2 ? 'right' : 'left';
    });
    cvs.addEventListener('pointermove', e => {
      mouse.x = e.clientX / innerWidth; mouse.y = e.clientY / innerHeight;
      if (orbit) {
        tgt.yaw = THREE.MathUtils.clamp(tgt.yaw - (e.clientX - orbit.x) * .22, -55, 55);
        tgt.pitch = THREE.MathUtils.clamp(tgt.pitch + (e.clientY - orbit.y) * .16, -40, 26);
        orbit = { x: e.clientX, y: e.clientY };
      }
    });
    const releaseMouse = () => { mouseSide = null; orbit = null; };
    cvs.addEventListener('pointerup', releaseMouse);
    cvs.addEventListener('pointercancel', releaseMouse);
    addEventListener('keydown', e => {
      if (e.key === 'c' || e.key === 'C') {
        noseRef = savedRef = null; hadRef = false;
        tgt.yaw = taskView[JOBS[ji].id].yaw; tgt.pitch = BASE_PITCH;
      }
    });

    /* ================= loop ================= */
    function resize() {
      ren.setSize(innerWidth, innerHeight);
      cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
      hc.width = innerWidth; hc.height = innerHeight;
    }
    addEventListener('resize', resize); resize();

    let last = performance.now(), fpsN = 0, fpsT = last;
    function loop() {
      requestAnimationFrame(loop);
      const now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now;
      if (framedJob !== ji) {
        const frame = taskView[JOBS[ji].id];
        tgt.yaw = frame.yaw; tgt.pitch = BASE_PITCH; tgt.fov = frame.fov;
        framedJob = ji;
      }
      noseTick(); noseDot();
      const hs = window.__forceHands || (mouseSide ? mouseHands() : hands?.state || mouseHands());
      jobTick(hs); drawOverlay(hs);
      popTick();
      const k = .14;
      view.yaw += (tgt.yaw - view.yaw) * k; view.pitch += (tgt.pitch - view.pitch) * k;
      view.fov += (THREE.MathUtils.clamp(tgt.fov, 55, 100) - view.fov) * k;
      cam.fov = innerWidth < 700 ? Math.min(115, view.fov + 46) : view.fov;
      cam.updateProjectionMatrix();
      const phi = THREE.MathUtils.degToRad(90 - view.pitch), th = THREE.MathUtils.degToRad(view.yaw);
      cam.lookAt(Math.sin(phi) * Math.sin(th), Math.cos(phi), -Math.sin(phi) * Math.cos(th));
      palletRing.material.opacity = .5 + Math.sin(now / 300) * .25;
      outRing.material.opacity = .4 + Math.sin(now / 300) * .25;
      drumRing.material.opacity = .4 + Math.sin(now / 300) * .25;
      palletRing.visible = JOBS[ji].id === 'stack';
      outRing.visible = JOBS[ji].id === 'out';
      drumRing.visible = JOBS[ji].id === 'drum';
      forkRing.visible = JOBS[ji].id === 'park';
      ren.render(scene, cam);
      if (++fpsN === 60) { const f = Math.round(60000 / (now - fpsT)); fpsN = 0; fpsT = now;
        if (face) status.textContent = `face · ${face.delegate} · ${f} fps`; }
    }
    loop();
    window.__job = { THREE, view: tgt, scene, set, grabbables, setJob, complete, award, cam,
      get face() { return face; }, get hands() { return hands; },
      get grabbed() { return grabbed; }, get aimed() { return aimed; },
      get powerObj() { return powerObj; } };
  </script>
</body>
</html>
