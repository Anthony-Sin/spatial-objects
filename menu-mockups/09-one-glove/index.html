<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCRAP!</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#FFF8EC; --ink:#2B2118; --coral:#FF6B57; --sun:#FFC53D; --sky:#5DA9E9; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    min-height:100vh; min-height:100svh; display:grid; place-items:center; overflow:hidden;
    background:var(--paper); color:var(--ink);
    font-family:"Fredoka","Baloo 2","Avenir Next","Trebuchet MS",system-ui,sans-serif;
    background-image:radial-gradient(rgba(43,33,24,.055) 1.6px, transparent 1.6px);
    background-size:28px 28px;
  }

  /* ---------- one sticker on paper ---------- */
  .stage { display:flex; flex-direction:column; align-items:center; text-align:center; padding:16px; }

  .glove-wrap { position:relative; width:clamp(200px, 42vmin, 600px); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .glove-bob { transform:rotate(-6deg); }
  .glove-wrap svg { display:block; width:100%; height:auto; filter:drop-shadow(0 .9vmin 0 rgba(43,33,24,.14)); }
  .glove-jab { transform-origin:50% 60%; }

  .glove-shadow {
    position:absolute; left:50%; bottom:-4.5%; width:56%; height:5.5%;
    transform:translateX(-50%); border-radius:50%;
    background:rgba(43,33,24,.10); filter:blur(6px);
  }

  h1 {
    margin-top:-1.2vmin; transform:rotate(-2deg);
    font-weight:700; font-size:clamp(58px, 13vmin, 190px); line-height:.9; letter-spacing:.02em;
    text-shadow:.045em .045em 0 var(--coral), .09em .09em 0 rgba(43,33,24,.10);
    user-select:none;
  }
  h1 .bang { color:var(--coral); text-shadow:.045em .045em 0 var(--ink), .09em .09em 0 rgba(43,33,24,.10); }

  .menu {
    display:flex; flex-direction:row; flex-wrap:wrap;
    gap:clamp(14px,2.5vmin,28px); align-items:flex-end; justify-content:center;
    margin-top:clamp(18px,3.5vmin,40px);
  }
  .menu-col {
    display:flex; flex-direction:column; align-items:center;
    gap:clamp(8px,1.4vmin,14px);
  }
  .tut-check {
    display:inline-flex; align-items:center; gap:9px;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    padding:4px 10px;
    font-size:clamp(12.5px,1.5vmin,15px); font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color:var(--ink);
    transition:transform .15s cubic-bezier(.34,1.7,.5,1);
  }
  .tut-check:hover {
    transform:translateY(-2px) rotate(-.8deg);
  }
  .tut-check:active {
    transform:translateY(1px);
  }
  .tut-input {
    position:absolute; opacity:0; pointer-events:none; width:0; height:0; margin:0;
  }
  .tut-box {
    width:22px; height:22px; border-radius:6px;
    border:2.5px solid var(--ink); background:#fff;
    box-shadow:0 3px 0 var(--ink);
    display:grid; place-items:center; flex-shrink:0;
    transition:background .15s, box-shadow .15s, transform .15s cubic-bezier(.34,1.7,.5,1);
  }
  .tut-check:hover .tut-box {
    box-shadow:0 4px 0 var(--ink);
  }
  .tut-box svg {
    width:14px; height:14px; fill:none;
    stroke:var(--ink); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round;
    opacity:0; transform:scale(.4) rotate(-12deg);
    transition:opacity .15s ease, transform .18s cubic-bezier(.34,1.8,.5,1);
  }
  .tut-input:checked + .tut-box {
    background:var(--sun);
  }
  .tut-input:checked + .tut-box svg {
    opacity:1; transform:scale(1) rotate(0deg);
  }
  .tut-input:focus-visible + .tut-box {
    outline:3px solid var(--sun); outline-offset:3px;
  }
  .tut-label {
    line-height:1;
  }

  .btn {
    display:block; width:min(85vw, clamp(260px, 28vmin, 380px));
    padding:clamp(13px,2.1vmin,22px) clamp(18px,2.5vmin,30px);
    border:3px solid var(--ink); border-radius:999px;
    font-family:inherit; font-weight:700; text-transform:uppercase; text-decoration:none; text-align:center;
    font-size:clamp(13px,1.7vmin,18px); letter-spacing:.13em; line-height:1.2;
    white-space:nowrap;
    box-shadow:0 6px 0 var(--ink);
    transition:transform .18s cubic-bezier(.34,1.7,.5,1), box-shadow .18s cubic-bezier(.34,1.7,.5,1);
  }
  .btn:hover  { transform:translateY(-4px) rotate(-1.2deg); box-shadow:0 10px 0 var(--ink); }
  .btn:active { transform:translateY(3px) scale(.97); box-shadow:0 1px 0 var(--ink); transition-duration:.06s; }
  .btn:focus-visible { outline:4px solid var(--sun); outline-offset:3px; }
  .btn.main { background:var(--coral); color:#fff; }
  .btn.alt  { background:#fff; color:var(--ink); }

  /* the one barely-there hint, pinned to the paper's edge */
  .hint {
    position:fixed; left:0; right:0; bottom:12px; text-align:center; pointer-events:none;
    font-size:10px; font-weight:600; letter-spacing:.3em; text-transform:uppercase; color:#cbbcA0;
  }

  /* ---------- motion ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .glove-bob { animation:bob 3.2s ease-in-out infinite; }
    .glove-shadow { animation:shrink 3.2s ease-in-out infinite; }
    .glove-wrap.jab .glove-jab { animation:jab .5s cubic-bezier(.3,1.6,.5,1); }
    .glove-wrap.jab .glove-bob { animation-play-state:paused; }
  }
  @keyframes bob {
    0%,100% { transform:rotate(-6deg) translateY(0); }
    50%     { transform:rotate(-2.5deg) translateY(-2.4%); }
  }
  @keyframes shrink {
    0%,100% { transform:translateX(-50%) scaleX(1); opacity:1; }
    50%     { transform:translateX(-50%) scaleX(.86); opacity:.6; }
  }
  @keyframes jab {
    0%   { transform:scale(1) translateY(0); }
    35%  { transform:scale(1.22) translateY(-4%); }
    100% { transform:scale(1) translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="glove-wrap" id="glove" title="give it a tap">
      <div class="glove-bob">
        <div class="glove-jab">
          <svg viewBox="0 0 160 96" role="img" aria-label="a pair of boxing gloves, drawn by hand">
            <defs>
              <g id="glove-sil">
                <path d="M30 40 C18 40 12 52 14 64 C16 78 28 88 46 88 C64 88 80 78 82 60 C84 44 76 30 62 28 L58 22 C56 16 48 14 42 18 C40 10 30 8 26 14 C22 20 26 28 30 32 Z"/>
                <rect x="26" y="70" width="44" height="18" rx="8"/>
              </g>
              <g id="glove-art">
                <path d="M30 40 C18 40 12 52 14 64 C16 78 28 88 46 88 C64 88 80 78 82 60 C84 44 76 30 62 28 L58 22 C56 16 48 14 42 18 C40 10 30 8 26 14 C22 20 26 28 30 32 Z"
                      stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
                <rect x="26" y="70" width="44" height="18" rx="8" fill="#fff" stroke="var(--ink)" stroke-width="4"/>
                <path d="M34 74 v10 M44 74 v10 M54 74 v10" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
                <!-- hand-drawn seams -->
                <path d="M63 31 C59 37 58 45 62 52" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
                <path d="M20 56 C24 46 35 41 46 41" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.5 6.5"/>
              </g>
            </defs>
            <!-- right glove: sky, behind, mirrored + tilted the other way -->
            <g transform="translate(56 4) rotate(14 48 48) translate(96 0) scale(-1 1)">
              <use href="#glove-sil" fill="#fff" stroke="#fff" stroke-width="15" stroke-linejoin="round"/>
              <use href="#glove-art" fill="var(--sky)"/>
            </g>
            <!-- left glove: coral, in front -->
            <g transform="translate(6 4) rotate(-14 48 48)">
              <use href="#glove-sil" fill="#fff" stroke="#fff" stroke-width="15" stroke-linejoin="round"/>
              <use href="#glove-art" fill="var(--coral)"/>
            </g>
            <!-- sticker sparkles -->
            <path d="M10 14 l5 -5 M8 22 h7" stroke="var(--sun)" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M148 30 l5 -4" stroke="var(--coral)" stroke-width="3.4" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <div class="glove-shadow" aria-hidden="true"></div>
    </div>

    <h1>SCRAP<span class="bang">!</span></h1>

    <nav class="menu">
      <div class="menu-col">
        <label class="tut-check" for="tut-toggle">
          <input type="checkbox" id="tut-toggle" class="tut-input">
          <span class="tut-box" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M3.2 8.2 l3.2 3.4 l6.4 -7.2"/></svg>
          </span>
          <span class="tut-label">Start a tutorial</span>
        </label>
        <a class="btn main" id="enter-btn" href="../../boxing.html">Enter the Ring</a>
      </div>
      <div class="menu-col">
        <a class="btn alt" href="../../lineup.html">Choose Your Fighter</a>
      </div>
    </nav>
  </main>

  <div class="hint">hold your fists up to the webcam</div>

<script>
  // tap the glove → quick jab toward the camera
  const wrap = document.getElementById('glove');
  wrap.addEventListener('pointerdown', () => {
    wrap.classList.remove('jab');
    void wrap.offsetWidth;           // restart the animation
    wrap.classList.add('jab');
  });
  wrap.addEventListener('animationend', () => wrap.classList.remove('jab'));

  // tutorial checkmark syncs with Enter the Ring destination
  const tutToggle = document.getElementById('tut-toggle');
  const enterBtn = document.getElementById('enter-btn');
  function syncTutorial() {
    enterBtn.href = tutToggle.checked ? '../../boxing.html?practice=1' : '../../boxing.html';
  }
  try {
    if (localStorage.getItem('boxing:tutorial') === '1') {
      tutToggle.checked = true;
    }
  } catch {}
  syncTutorial();
  tutToggle.addEventListener('change', () => {
    syncTutorial();
    try {
      localStorage.setItem('boxing:tutorial', tutToggle.checked ? '1' : '0');
    } catch {}
  });
</script>
</body>
</html>
