<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCRAP! — Webcam Boxing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f6f2;
    --ink: #111111;
    --red: #e30613;
    --rule: 1px solid var(--ink);
    --sans: "Archivo", "Helvetica Neue", Helvetica, Arial, "Nimbus Sans", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100svh;
  }

  /* ---- hairline frame ---- */
  .frame {
    position: fixed;
    inset: clamp(8px, 1.2vw, 20px);
    border: var(--rule);
    pointer-events: none;
    z-index: 10;
  }

  /* ---- top strip ---- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1em;
    flex-wrap: wrap;
    padding: clamp(20px, 3vw, 44px) clamp(24px, 4vw, 64px) clamp(10px, 1.4vw, 20px);
    border-bottom: var(--rule);
    margin: clamp(8px, 1.2vw, 20px);
    margin-bottom: 0;
    border-left: 0;
    border-right: 0;
    border-top: 0;
  }

  .micro {
    font-size: clamp(9px, 0.85vw, 11px);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.6;
  }

  /* ---- hero ---- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 clamp(24px, 4vw, 64px);
  }

  h1 {
    font-weight: 900;
    font-size: clamp(64px, 22.5vw, 78vh);
    line-height: 0.82;
    letter-spacing: -0.045em;
    text-transform: uppercase;
    white-space: nowrap;
    user-select: none;
  }

  h1 .bang { color: var(--red); }

  /* ---- actions ---- */
  .actions {
    display: flex;
    gap: clamp(10px, 1.2vw, 18px);
    margin-top: clamp(24px, 4vh, 56px);
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: clamp(140px, 14vw, 220px);
    padding: clamp(14px, 1.6vh, 20px) clamp(22px, 2.4vw, 36px);
    font-family: var(--sans);
    font-size: clamp(10px, 0.9vw, 12px);
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 0;
    cursor: pointer;
    transition: background-color 160ms linear, color 160ms linear;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
  }
  .btn-primary:hover {
    background: var(--paper);
    color: var(--ink);
  }

  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .btn-secondary:hover {
    background: var(--ink);
    color: var(--paper);
  }

  .btn:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  /* ---- bottom strip ---- */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1em;
    flex-wrap: wrap;
    padding: clamp(10px, 1.4vw, 20px) clamp(24px, 4vw, 64px) clamp(20px, 3vw, 44px);
    border-top: var(--rule);
    margin: 0 clamp(8px, 1.2vw, 20px);
    border-left: 0;
    border-right: 0;
    border-bottom: 0;
  }

  footer .hint { font-weight: 500; }
  footer .idx  { font-weight: 600; }

  @media (max-width: 480px) {
    .actions { flex-direction: column; align-items: stretch; }
    .btn { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>

  <div class="frame" aria-hidden="true"></div>

  <header>
    <span class="micro">SCRAP! — A Webcam Boxing Game</span>
    <span class="micro">Fist-Tracked · No Controller</span>
  </header>

  <main>
    <h1>SCRAP<span class="bang">!</span></h1>

    <nav class="actions" aria-label="Main menu">
      <a class="btn btn-primary" href="../../boxing.html">Start Fight</a>
      <a class="btn btn-secondary" href="../../lineup.html">Lineup</a>
    </nav>
  </main>

  <footer>
    <span class="micro hint">* Fists up · Punch the lens · Lean to dodge</span>
    <span class="micro idx">01</span>
  </footer>

<script>
  // Enter throws the first punch.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var tag = (e.target && e.target.tagName) || "";
      if (tag !== "A" && tag !== "BUTTON" && tag !== "INPUT") {
        window.location.href = "../../boxing.html";
      }
    }
  });
</script>
</body>
</html>
