<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrap! — pip's punch-out</title>
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/loaders/GLTFLoader.js": "./vendor/three/GLTFLoader.js"
} }
</script>
<style>
  :root { --paper:#FFF8EC; --paper2:#FDF3E3; --ink:#2B2118; --coral:#FF6B57;
    --sun:#FFC53D; --leaf:#4FB06D; --sky:#5DA9E9; --berry:#B565D8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #241c12; }
  body { font-family: "Fredoka","Baloo 2","Avenir Next","Trebuchet MS",system-ui,sans-serif;
    color: var(--paper); }
  #world { position: fixed; inset: 0; display: block; }
  #hands { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  /* your bout card rides bottom-centre like a real fight HUD — big segmented
     blocks: each health block ≈ one clean hit left in you, each stamina
     block ≈ one punch you can still throw before the gas tank needs a beat */
  .card { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) rotate(-1deg); z-index: 20;
    min-width: 400px; border: 2.5px solid var(--ink); background: var(--paper);
    border-radius: 20px; padding: 10px 18px 12px; color: var(--ink);
    box-shadow: 0 6px 0 rgba(43,33,24,.45), 0 14px 34px rgba(0,0,0,.45); }
  .card .who { font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--coral); font-weight: 700; }

  /* round + clock — one plate in the top-left corner, opposite the score */
  .timer { position: fixed; top: 18px; left: 28px; z-index: 20;
    text-align: center; color: var(--ink); background: var(--paper);
    border: 2.5px solid var(--ink); border-radius: 16px; padding: 4px 18px 6px;
    box-shadow: 0 5px 0 rgba(43,33,24,.45), 0 12px 28px rgba(0,0,0,.4); }
  .timer .rd { font-size: 10px; font-weight: 800; letter-spacing: .3em; color: var(--coral); }
  .timer .clock { font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: .04em; }

  /* PIP's nameplate floats over its head (positioned every frame from 3D) —
     a paper strip like the timer card: name, health and stamina read clean
     against the bright ring instead of dissolving into it */
  .nameplate { position: fixed; left: 0; top: 0; z-index: 18; pointer-events: none;
    width: 230px; transform: translate(-50%, -100%); text-align: center;
    transition: opacity .25s; will-change: transform; }
  .nameplate.off { opacity: 0; }
  .nameplate .plate { padding: 7px 12px 9px; background: var(--paper);
    border: 2.5px solid var(--ink); border-radius: 15px;
    box-shadow: 0 4px 0 rgba(43,33,24,.45), 0 10px 26px rgba(0,0,0,.4); }
  .nameplate .nm { display: inline-block; margin-bottom: 5px; padding: 1px 11px;
    font-size: 12px; font-weight: 800; letter-spacing: .22em; color: var(--paper);
    background: var(--ink); border-radius: 99px; }
  .nameplate .nm .gas { display: none; color: var(--sun); margin-left: 6px; }
  .nameplate .nm .gas.on { display: inline; }
  .nameplate .bar { height: 15px; border: 2.5px solid var(--ink); border-radius: 9px;
    background: rgba(43,33,24,.35); overflow: hidden; box-shadow: 0 3px 0 rgba(43,33,24,.5);
    position: relative; }
  .nameplate .bar i { display: block; height: 100%; background: var(--sky);
    transform-origin: left; transition: transform .18s cubic-bezier(.34,1.56,.64,1); }
  .nameplate .bar i.ghost { margin-top: -15px; background: rgba(255,248,236,.55);
    transition: transform .6s ease .25s; }
  /* PIP's legs: the thin sliver under the hp bar. It visibly drains on the
     3-punch flurry and glows amber-hot when the next one is loaded — the
     cue to finish your guard-up before the windup. */
  .nameplate .stam { height: 6px; margin: 4px 8px 0; border: 1.5px solid var(--ink);
    border-radius: 5px; background: rgba(43,33,24,.35); overflow: hidden; position: relative; }
  .nameplate .stam i { display: block; height: 100%; background: var(--sun);
    transform-origin: left; transition: transform .3s ease; }
  .nameplate .stam.on { border-color: var(--sun);
    box-shadow: 0 0 8px rgba(255,190,60,.8); animation: stamhot .55s ease-in-out infinite alternate; }
  @keyframes stamhot { to { box-shadow: 0 0 14px rgba(255,190,60,1); } }
  .hp-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .hp-row .lbl { width: 44px; font-size: 11px; font-weight: 800; letter-spacing: .18em;
    text-transform: uppercase; }
  .hp-row .track { flex: 1; height: 16px; border: 2px solid var(--ink); border-radius: 9px;
    background: rgba(43,33,24,.12); overflow: hidden; position: relative; }
  .hp-row .track i { display: block; height: 100%; width: 100%;
    border-radius: 5px; transform-origin: left;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1); }
  /* 8 blocks: read 'em as ~one hit left / ~one punch in the tank each.
     the fill glides under fixed dividers so a draining block still shows
     the partial bite — regen visibly rebuilds the current block */
  .track::after, .nameplate .bar::after, .nameplate .stam::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0,
      transparent calc(12.5% - 2px), var(--ink) calc(12.5% - 2px), var(--ink) 12.5%); }
  .hp-row.you .track i { background: var(--coral); }
  .hp-row.npc .track i { background: var(--sky); }
  .hp-row.stam .track { height: 10px; }
  .hp-row.stam .track i { background: var(--sun); }
  /* COOLING DOWN — gassed: the tank pulses while it catches its breath,
     punches stay weak until the amber rebuilds a block or two */
  .hp-row.stam.on .track i { animation: stamCd .5s ease-in-out infinite alternate; }
  .hp-row.stam.on .lbl { color: var(--coral); }
  @keyframes stamCd { from { filter: brightness(.65); } to { filter: brightness(1.2); } }

  .score { position: fixed; top: 18px; right: 28px; z-index: 20; text-align: right; }
  .score .n { font-weight: 700; font-size: 38px; color: var(--sun);
    text-shadow: 0 2px 0 var(--ink), 0 4px 14px rgba(0,0,0,.55); }
  .score .l { font-size: 9px; letter-spacing: .3em; text-transform: uppercase;
    color: rgba(255,248,236,.65); }
  .score .combo { display: none; margin-top: 7px; padding: 4px 10px;
    border: 2px solid var(--ink); border-radius: 10px; background: var(--coral);
    color: var(--paper); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    box-shadow: 0 3px 0 var(--ink); }
  .score .combo.on { display: inline-block; animation: feedin .2s ease-out; }
  .score .counter { display: none; margin-top: 7px; padding: 5px 10px;
    border: 2px solid var(--ink); border-radius: 10px; background: var(--sky);
    color: var(--ink); font-size: 11px; font-weight: 800; letter-spacing: .1em;
    box-shadow: 0 3px 0 var(--ink); }
  .score .counter.on { display: block; }

  /* event feed — stacked paper pills under the score */
  .feed { position: fixed; top: 150px; right: 28px; z-index: 20; display: flex;
    flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
  .feed div { background: var(--paper); color: var(--ink); border: 2px solid var(--ink);
    border-radius: 999px; padding: 3px 12px; font-size: 10.5px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    animation: feedin .25s cubic-bezier(.34,1.56,.64,1); }
  @keyframes feedin { from { transform: translateX(30px) scale(.6); opacity: 0; } }

  .peep { position: fixed; left: 30px; bottom: 30px; z-index: 20; width: 238px;
    border: 2.5px solid var(--ink); border-radius: 16px; overflow: hidden;
    box-shadow: 0 6px 0 rgba(43,33,24,.45), 0 12px 30px rgba(0,0,0,.5); }
  .peep video { width: 100%; display: block; transform: scaleX(-1); }
  .peep .tag { position: absolute; left: 0; right: 0; bottom: 0; font-size: 8.5px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--paper);
    background: rgba(43,33,24,.7); padding: 4px 8px; }
  .peep canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .peep[hidden] { display: none !important; }
  /* contrast: dark outline behind all paper-light HUD text over bright scene */
  .score .l, .feed div, .tele, .flash {
    text-shadow: 0 1px 2px rgba(20,14,8,.95), 0 0 10px rgba(20,14,8,.6); }

  /* attack and hit callouts stay at the edge, leaving the opponent clear */
  .tele { display: inline-block; margin-top: 6px; white-space: nowrap;
    transform: translateY(6px) scale(.85); padding: 5px 11px;
    border: 2.5px solid var(--ink); border-radius: 12px; background: var(--coral);
    color: var(--paper); font-weight: 800; font-size: 12px; letter-spacing: .04em;
    opacity: 0; box-shadow: 0 4px 0 rgba(43,33,24,.5); transition: transform .12s, opacity .12s; }
  .tele.on { transform: none; opacity: 1; }
  /* POW!/TAGGED! pop beside PIP's head (positioned with the nameplate) */
  .flash { position: fixed; left: 0; top: 0; z-index: 30; white-space: nowrap;
    font-weight: 800; font-size: 34px; color: var(--sun); letter-spacing: .06em;
    text-shadow: 0 3px 0 var(--ink), 0 6px 22px rgba(0,0,0,.7);
    opacity: 0; transition: opacity .35s; pointer-events: none; }
  .count { position: fixed; top: 44%; left: 50%; transform: translate(-50%,-50%); z-index: 30;
    display: none; color: var(--paper); text-align: center; pointer-events: none;
    font-size: clamp(42px, 7vw, 88px); font-weight: 800; line-height: .85;
    text-shadow: 0 5px 0 var(--ink), 0 10px 24px rgba(0,0,0,.6); }
  .count.on { display: block; }
  .count small { display: block; margin-top: 12px; color: var(--sun);
    font-size: 12px; letter-spacing: .24em; text-transform: uppercase; }

  /* damage vignette — red rim pulse when the player eats a hit */
  .vin { position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 42%,
      rgba(200,26,14,.45) 74%, rgba(150,8,6,.75) 100%); }

  /* 40-second tutorial coach — sits low-centre, under PIP, above your gloves */
  .tutor { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(20px);
    z-index: 33; width: min(520px, calc(100vw - 32px)); padding: 10px 18px 12px; text-align: center;
    background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px;
    box-shadow: 0 6px 0 rgba(43,33,24,.5), 0 16px 36px rgba(0,0,0,.45);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.34,1.56,.64,1); }
  .tutor.on { opacity: 1; transform: translateX(-50%); }
  .tutor.nice { background: var(--leaf); color: var(--paper); }
  .tut-head { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 800;
    letter-spacing: .26em; color: var(--coral); }
  .tutor.nice .tut-head { color: var(--paper); }
  .tut-pips { margin-left: auto; display: flex; gap: 5px; }
  .tut-pips i { width: 22px; height: 7px; border-radius: 4px; border: 1.5px solid var(--ink);
    background: rgba(43,33,24,.08); }
  .tut-pips i.cur { background: var(--sun); }
  .tut-pips i.ok { background: var(--leaf); }
  .tut-title { margin-top: 4px; font-size: 24px; font-weight: 900; letter-spacing: .05em; }
  .tut-how { font-size: 13px; font-weight: 600; opacity: .8; min-height: 1.2em; }
  .tut-cue { margin-top: 4px; min-height: 22px; font-size: 18px; font-weight: 900; color: var(--coral);
    letter-spacing: .08em; }
  .tut-time { margin-top: 6px; height: 5px; border-radius: 3px; background: rgba(43,33,24,.12); overflow: hidden; }
  .tut-time i { display: block; height: 100%; background: var(--sky); transform-origin: left; }

  /* halftime corner card — slides up just over your health plate when the
     bout stops for a coach tip: one urgent line, a sliver of break left,
     then the next round bells in. Same paper-card family as .tutor but
     tilted the other way and keyed leaf-green (your corner's got you) */
  .coach { position: fixed; left: 50%; bottom: 148px; z-index: 34;
    transform: translateX(-50%) translateY(26px) rotate(.8deg);
    width: min(500px, calc(100vw - 32px)); padding: 12px 20px 13px; text-align: center;
    background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 20px;
    box-shadow: 0 8px 0 rgba(43,33,24,.5), 0 18px 44px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .22s, transform .3s cubic-bezier(.34,1.56,.64,1); }
  .coach.on { opacity: 1; transform: translateX(-50%) rotate(.8deg); pointer-events: auto; }
  .coach .chead { font-size: 10px; font-weight: 800; letter-spacing: .3em; color: var(--leaf);
    text-transform: uppercase; }
  .coach .cbig { margin-top: 2px; font-size: 30px; font-weight: 900; letter-spacing: .05em;
    color: var(--ink); }
  .coach .ctip { margin: 6px auto 10px; max-width: 42ch; min-height: 2.6em;
    font-size: 15px; font-weight: 700; line-height: 1.32; }
  .coach .crow { display: flex; align-items: center; gap: 12px; }
  .coach .cgo { flex: none; padding: 7px 16px; border: 2.5px solid var(--ink); border-radius: 999px;
    background: var(--leaf); color: var(--paper); font: 800 12px inherit; letter-spacing: .12em;
    text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 0 var(--ink);
    transition: transform .15s, box-shadow .15s; }
  .coach .cgo:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
  .coach .cgo:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .coach .ctime { flex: 1; height: 6px; border-radius: 4px; background: rgba(43,33,24,.12); overflow: hidden; }
  .coach .ctime i { display: block; height: 100%; background: var(--leaf); transform-origin: left; }

  /* 3-2-1 before every round */
  .countdown { position: fixed; left: 50%; top: 42%; z-index: 32; pointer-events: none;
    transform: translate(-50%,-50%); text-align: center; display: none; }
  .countdown.on { display: block; }
  .countdown .rnd { font-size: 14px; font-weight: 800; letter-spacing: .4em; color: var(--sun);
    text-shadow: 0 2px 0 var(--ink); }
  .countdown .n { font-size: clamp(90px, 16vw, 190px); font-weight: 900; line-height: .9;
    color: var(--paper); -webkit-text-stroke: 3px var(--ink);
    text-shadow: 0 8px 0 var(--ink), 0 16px 40px rgba(0,0,0,.6); }
  .countdown .n.pop { animation: cpop .9s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes cpop { 0% { transform: scale(1.9); opacity: 0; } 25% { transform: scale(1); opacity: 1; }
    80% { opacity: 1; } 100% { transform: scale(.85); opacity: .15; } }

  /* corner-break blackout — the walk back to the marks hides under it, then
     the curtain lifts on reset corners. Covers the whole stage, HUD included */
  .wipe { position: fixed; inset: 0; z-index: 40; background: #171009;
    opacity: 0; pointer-events: none; transition: opacity .34s ease; }
  .wipe.on { opacity: 1; }
  /* ROUND N hero card — the pop between the blackout and 3-2-1. The
     countdown number only deals once this card is gone */
  .roundpop { position: fixed; left: 50%; top: 40%; z-index: 32; pointer-events: none;
    transform: translate(-50%,-50%); text-align: center; display: none; }
  .roundpop.on { display: block; }
  .roundpop span { display: inline-block; padding: 0 .16em;
    font-size: clamp(54px, 9.5vw, 128px); font-weight: 900; letter-spacing: .06em;
    color: var(--sun); -webkit-text-stroke: 3px var(--ink);
    text-shadow: 0 8px 0 var(--ink), 0 18px 44px rgba(0,0,0,.6); }
  .roundpop.on span { animation: rpop 1.15s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes rpop { 0% { transform: scale(1.9) rotate(2.5deg); opacity: 0; }
    22% { transform: scale(1) rotate(-1.5deg); opacity: 1; }
    78% { transform: scale(1) rotate(-1.5deg); opacity: 1; }
    100% { transform: scale(.84); opacity: 0; } }

  /* big center callouts — PERFECT! / PUNCH NOW! — the moments that matter */
  .callout { position: fixed; left: 50%; top: 17%; z-index: 31; pointer-events: none;
    transform: translate(-50%,-50%) scale(.4) rotate(-4deg); opacity: 0;
    font-size: clamp(34px, 5.2vw, 70px); font-weight: 900; letter-spacing: .04em;
    color: var(--sun); white-space: nowrap;
    text-shadow: 0 4px 0 var(--ink), 0 0 2px var(--ink), 0 10px 30px rgba(0,0,0,.6);
    -webkit-text-stroke: 2px var(--ink);
    transition: transform .18s cubic-bezier(.34,1.8,.64,1), opacity .12s; }
  .callout.on { transform: translate(-50%,-50%) scale(1) rotate(-4deg); opacity: 1; }
  .callout.perfect { color: #fff8ec; }
  .callout.flurry { color: var(--coral); animation: thump .22s ease-in-out infinite alternate; }
  @keyframes thump { to { transform: translate(-50%,-50%) scale(1.12) rotate(-2deg); } }
  /* slow-mo tint while time crawls after a perfect dodge */
  body.slowmo #world { filter: saturate(.55) contrast(1.15) brightness(1.08); }

  /* end-of-fight card */
  .endcard { position: fixed; bottom: 32px; left: 50%; transform: translate(-50%, 20px) scale(.8);
    transform-origin: center bottom; z-index: 35; background: var(--paper); color: var(--ink); border: 3.5px solid var(--ink);
    border-radius: 28px; padding: clamp(18px, 3vmin, 28px) clamp(24px, 4vmin, 44px); text-align: center;
    box-shadow: 0 10px 0 var(--ink), 0 24px 60px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .2s ease; }
  .endcard.on { transform: translate(-50%, 0) scale(1) rotate(-1deg); opacity: 1; pointer-events: auto; }
  .endcard .big { font-size: clamp(38px, 6vmin, 58px); font-weight: 800; line-height: .95;
    letter-spacing: .03em; color: var(--coral); text-shadow: .04em .04em 0 var(--ink); }
  .endcard.lose .big { color: var(--ink); text-shadow: none; }
  .endcard .sub { margin: 10px 0 18px; font-size: clamp(13px, 1.8vmin, 16px); font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink); opacity: .8; }
  .endcard .actions { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .replay { padding: clamp(11px, 1.8vmin, 16px) clamp(22px, 3vmin, 34px);
    border: 3px solid var(--ink); border-radius: 999px; font: 800 clamp(13px, 1.7vmin, 16px) inherit;
    letter-spacing: .12em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-block;
    box-shadow: 0 5px 0 var(--ink);
    transition: transform .15s cubic-bezier(.34,1.7,.5,1), box-shadow .15s, background .15s; }
  .replay:hover { transform: translateY(-3px) rotate(-1deg); box-shadow: 0 8px 0 var(--ink); }
  .replay:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .replay.main { background: var(--coral); color: #fff; }
  .replay.menu { background: #fff; color: var(--ink); }

  /* narrower windows can't centre a 400px card beside the webcam peep —
     dock it bottom-right instead, clear of the peep's bottom-left corner */
  @media (max-width: 1050px) {
    .card { left: auto; right: 20px; transform: rotate(-1deg); min-width: 300px; }
  }
  @media (max-width: 700px) {
    .card { right: 14px; bottom: 14px; width: calc(100% - 150px); min-width: 0; padding: 8px 12px; }
    .hp-row .lbl { width: 34px; font-size: 9px; }
    .hp-row .track { height: 12px; }
    .hp-row.stam .track { height: 7px; }
    .timer { top: 10px; left: 14px; }
    .score { top: 180px; right: 14px; }
    .score .n { font-size: 24px; }
    .flash { font-size: 22px; }
    .feed { top: 280px; right: 14px; }
    .peep { left: 14px; bottom: 14px; width: 116px; }
    .callout { top: 36%; }
    .coach { bottom: 118px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <canvas id="world"></canvas>
  <canvas id="hands"></canvas>

  <div class="card">
    <div class="who">THE ROOKIE · <span data-npcname>PIP</span>'S CHALLENGER</div>
    <div class="hp-row you"><div class="lbl">YOU</div><div class="track"><i data-php></i></div></div>
    <div class="hp-row stam" data-stamrow><div class="lbl">STAM</div><div class="track"><i data-stam></i></div></div>
  </div>
  <div class="timer"><div class="rd" data-round>RINGSIDE</div><div class="clock" data-time>1:30</div></div>
  <div class="nameplate off" data-plate>
    <div class="plate">
      <div><span class="nm"><span data-npclbl>PIP</span><span class="gas" data-npcgas>· WINDED</span></span></div>
      <div class="bar"><i class="ghost" data-nhpghost></i><i data-nhp></i></div>
      <div class="stam" data-nstamwrap><i data-nstam></i></div>
    </div>
    <div class="tele" data-tele></div>
  </div>
  <div class="tutor" data-tutor></div>
  <div class="coach" data-coach>
    <div class="chead">YOUR CORNER · <span data-coachrd>HALFTIME</span></div>
    <div class="cbig">HALFTIME</div>
    <div class="ctip" data-coachtip></div>
    <div class="crow">
      <button class="cgo" data-coachgo>Gloves up →</button>
      <div class="ctime"><i data-coachtime></i></div>
    </div>
  </div>
  <div class="countdown" data-countdown><div class="rnd" data-cdround>ROUND 1</div><div class="n" data-cdn>3</div></div>
  <div class="roundpop" data-roundpop><span data-rpround>ROUND 2</span></div>
  <div class="wipe" data-wipe></div>

  <div class="score"><div class="n" data-score>0</div><div class="l">ringside pts</div><div class="combo" data-combo></div><div class="counter" data-counter>COUNTER READY</div></div>
  <div class="feed" data-feed></div>
  <div class="vin" data-vin></div>
  <div class="flash" data-flash></div>
  <div class="callout" data-callout></div>
  <div class="count" data-count><span>1</span><small>DOWN FOR THE COUNT</small></div>

  <div class="endcard" data-end>
    <div class="big" data-endtitle>YOU WIN!</div>
    <div class="sub" data-endsub></div>
    <div class="actions">
      <button class="replay main" data-replay>Run it back</button>
      <a class="replay menu" href="./">Return to menu</a>
    </div>
  </div>

  <div class="peep">
    <video data-cam muted playsinline></video>
    <canvas data-nose></canvas>
    <div class="tag" data-peep>face · —</div>
  </div>


  <script type="module">
    import * as THREE from 'three';
    /* contract modules load dynamically — a failed dep degrades instead of
       killing the whole page module (b4-pages): trackers → mouse mode,
       mitt → bare-fist overlay, scene → readable fail card, tutorial →
       straight fight. THREE stays static — without the render engine there
       is no page to degrade to. */
    const handsP = import('./shared/hands.js').catch(() => null);
    const faceP = import('./shared/face.js').catch(() => null);
    const sceneP = import('./shared/boxing/scene.js').catch(() => null);
    const mittP = import('./shared/boxing/mitts/index.js')
      .then(m => m.loadMitt()).catch(() => null);                 // glove pick from the mitt rack
    const gameModP = import('./shared/boxing/game.js');
    const audioModP = import('./shared/boxing/audio.js');

    /* Autoplay policy: an AudioContext only reaches 'running' when built (or
       resumed) inside a DOM user gesture — and a hands-tracked bout can run
       bell-to-KO without a single pointer/key event, which is exactly how the
       audio used to stay silent until the first knockdown panic-keypress.
       Catch the FIRST gesture the moment it lands — even mid-boot — by
       building a context right inside the handler; unlock() below adopts it.
       A suspended grab (shouldn't happen on real input) keeps the listeners
       armed so the next gesture retries the resume. */
    let earlyAC = null;
    try {   // eager grab first — running straight away where the browser
            // allows autoplay; suspended elsewhere until a gesture resumes it
      const ACEarly = window.AudioContext || window.webkitAudioContext;
      earlyAC = ACEarly ? new ACEarly() : null;
      earlyAC?.resume?.();
    } catch { earlyAC = null; }
    const grabAC = () => {
      if (!earlyAC) try {
        const AC = window.AudioContext || window.webkitAudioContext;
        earlyAC = AC ? new AC() : null;
      } catch { earlyAC = null; }
      try { earlyAC?.resume?.(); } catch {}
      if (earlyAC && earlyAC.state !== 'suspended') {
        removeEventListener('pointerdown', grabAC);
        removeEventListener('keydown', grabAC);
      }
    };
    addEventListener('pointerdown', grabAC);
    addEventListener('keydown', grabAC);

    const params = new URLSearchParams(location.search);
    const practice = !!(params.get('practice') || params.get('tutorial'));   // endless spar — nobody goes down
    const tutorialMode = practice;          // ?practice=1 / ?tutorial=1 → the 30s guided tutorial
    const $ = (s) => document.querySelector(s);
    const status = $('[data-peep]');   // boot/face status lives on the webcam tag now
    const el = {
      round: $('[data-round]'), time: $('[data-time]'), php: $('[data-php]'),
      nhp: $('[data-nhp]'), stam: $('[data-stam]'), stamRow: $('[data-stamrow]'),
      score: $('[data-score]'), combo: $('[data-combo]'), counter: $('[data-counter]'), feed: $('[data-feed]'),
      tele: $('[data-tele]'), flash: $('[data-flash]'), count: $('[data-count]'), end: $('[data-end]'),
      callout: $('[data-callout]'), world: $('#world'),
      vin: $('[data-vin]'),
      endTitle: $('[data-endtitle]'), endSub: $('[data-endsub]'),
      npcName: $('[data-npcname]'), npcLbl: $('[data-npclbl]'), peep: $('[data-peep]'),
      plate: $('[data-plate]'), nhpGhost: $('[data-nhpghost]'), npcGas: $('[data-npcgas]'),
      nstam: $('[data-nstam]'), nstamW: $('[data-nstamwrap]'),
      countdown: $('[data-countdown]'), cdRound: $('[data-cdround]'), cdN: $('[data-cdn]'),
      wipe: $('[data-wipe]'), rpop: $('[data-roundpop]'), rpRound: $('[data-rpround]'),
      coach: $('[data-coach]'), coachRd: $('[data-coachrd]'), coachTip: $('[data-coachtip]'),
      coachGo: $('[data-coachgo]'), coachTime: $('[data-coachtime]'),
    };

    /* ================= renderer / stage ================= */
    const cvs = $('#world');
    /* park the module on a readable failure card — top-level module code
       can't early-return, so a never-resolving await parks it here. */
    async function parkFail(title, body) {
      cvs.style.visibility = 'hidden';
      const card = document.createElement('div');
      card.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;' +
        'z-index:50;pointer-events:none';
      card.innerHTML = `<div style="background:#FFF8EC;color:#2B2118;border:4px solid #2B2118;
        border-radius:18px;box-shadow:0 8px 0 #2B2118;padding:22px 30px;max-width:420px;
        text-align:center;font-family:inherit">
        <div style="font-size:34px;font-weight:800;letter-spacing:.04em">${title}</div>
        <div style="margin-top:8px;font-weight:600">${body}</div></div>`;
      document.body.appendChild(card);
      await new Promise(() => {});
    }
    // Probe the GPU BEFORE creating the real renderer: an iGPU/tile rasterizer
    // at 1600×900 pays ~4× fill for MSAA — the single biggest render cost.
    let gpuName = '';
    try {
      const pg = document.createElement('canvas').getContext('webgl2');
      const pe = pg?.getExtension('WEBGL_debug_renderer_info');
      gpuName = pe ? pg.getParameter(pe.UNMASKED_RENDERER_WEBGL) : '';
      pg?.getExtension('WEBGL_lose_context')?.loseContext();
    } catch {}
    const weakGpu = /intel|mesa|swiftshader|llvmpipe|software/i.test(gpuName);
    let ren = null;
    try {
      ren = new THREE.WebGLRenderer({ canvas: cvs, antialias: !weakGpu,
        powerPreference: 'high-performance' });   // hybrid laptops: pick the dGPU, not the iGPU
    } catch (e) {
      console.error('boxing: WebGL context could not be created —', e?.message || e);
    }
    if (ren) {
      cvs.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();                     // let the driver try to restore
        status.textContent = 'gpu hiccup — restoring';
      });
      cvs.addEventListener('webglcontextrestored', () => location.reload());
    } else {
      /* No WebGL = no game, but never a dead black page: park the module on a
         readable failure card (top-level module code can't early-return). */
      status.textContent = 'webgl unavailable';
      await parkFail("CAN'T FIND THE RING",
        "This game needs WebGL and your browser couldn't open a GPU context. " +
        "Try a different browser, enable hardware acceleration, or restart the GPU process.");
    }
    // iGPU render-scale: the scene is fill-bound at desktop sizes, so weak GPUs
    // draw .8× and let the compositor upscale — the 2D gloves/HUD stay 1:1 sharp.
    ren.setPixelRatio(weakGpu ? Math.min(devicePixelRatio, 1) * .8
                              : Math.min(devicePixelRatio, 1.5));
    ren.shadowMap.enabled = true;
    ren.shadowMap.autoUpdate = false;            // refreshed every 2nd frame in loop()
    const cam = new THREE.PerspectiveCamera(68, 1, .05, 120);
    cam.position.set(0, 1.7, 5.8); cam.lookAt(0, 1, 0);

    const buildScene = (await sceneP)?.buildScene;
    if (!buildScene) {              // arena module failed to load — degrade, don't die
      status.textContent = 'ring failed to load';
      await parkFail("CAN'T FIND THE RING",
        "The arena module failed to load — hard-refresh (Ctrl+Shift+R) and try again.");
    }
    const world = buildScene(THREE, ren, { low: weakGpu });
    const scene = world.scene;

    /* ================= webcam + trackers =================
       ?notrack skips camera + landmarkers entirely (e2e drives __forceHands) */
    const video = $('[data-cam]');
    const noTrack = !!params.get('notrack');
    let handStatus = 'loading';
    let videoLive = false;                   // frames actually arriving — a bogus
    const trackWaitT0 = performance.now();   // ?vid URL leaves video.src truthy but
    const TRACK_WAIT_MS = 35000;             // dead: trackers + bell-hold must not fire
    if (!noTrack) try {
      if (params.get('vid')) {
        video.src = params.get('vid'); video.loop = true; video.muted = true; await video.play();
      } else {
        video.srcObject = await navigator.mediaDevices.getUserMedia(
          { video: { width: { ideal: 640 }, height: { ideal: 480 },
            frameRate: { ideal: 30, max: 30 } }, audio: false });
        await video.play();
      }
      videoLive = true;
      status.textContent = 'camera live';
    } catch { status.textContent = 'mouse mode'; $('.peep').hidden = true; }
    if (noTrack) { status.textContent = 'synthetic mode'; $('.peep').hidden = true; }
    let hands = null, face = null;
    const Hands = (await handsP)?.default, Face = (await faceP)?.Face;
    if (!noTrack && videoLive) {
      // each landmarker boots inside its own worker — fire both, wire in when ready.
      // Hands get the whole GPU budget: a tracked hand roughly doubles infer
      // cost, and two fists up is the exact moment tracking must keep 30Hz.
      // FaceLandmarker (~10-20ms on CPU) lives on spare cores instead of competing.
      Face?.create(video, './vendor/mediapipe', { preferCpu: true })
        .then(f => { face = f; status.textContent = `face · ${f.delegate}`; }).catch(() => {});
      if (Hands) Hands.create(video, './vendor/mediapipe', { preferCpu: false }).then(h => {
        hands = h; handStatus = h.delegate === 'none' ? 'unavailable' : 'ready';
      }).catch(() => { handStatus = 'unavailable'; });
      else handStatus = 'unavailable';   // module failed to load — no hold, mouse mode
    } else handStatus = 'unavailable';   // no camera/trackers — never hold the bell
    // camera keeps streaming while the tab hides — pause the device, not the app
    addEventListener('visibilitychange', () => {
      const t = video.srcObject?.getVideoTracks?.()[0];
      if (t) t.enabled = !document.hidden;
    });

    /* ================= game glue =================
       Sibling contract modules may still be in flight — if game.js can't
       load, the page degrades to an idle ring instead of a black screen. */
    const mitt = await mittP;
    let game = null;
    window.__boxing = { THREE, scene, cam, log: [] };
    let tutor = null, tutSteps = 6;         // step count lands with the import
    try {
      const { createGame } = await gameModP;
      game = await createGame({ THREE, renderer: ren, cam, world, hands, face,
        getHands: () => hands, getFace: () => face,   // trackers resolve async — keep game.hands/face live
        skipIntro: true,
        fightOpts: { practice, ai: !tutorialMode } });   // tutorial scripts PIP itself
      game.skipIntro();                     // straight to the fight countdown (no walk-on intro / fighting pose)
      if (tutorialMode) try {
        const { Tutorial, STEPS } = await import('./shared/boxing/tutorial.js');
        tutSteps = STEPS?.length || tutSteps;
        document.body.classList.add('tutorial');
        tutor = new Tutorial({ fight: game.fight, sim: game.sim, root: $('[data-tutor]'),
          onDone: passed => showTutorialEnd(passed) });
      } catch {}                       // coach chunk failed — the fight still runs without it
      const nm = (game.fight.state.npc.name || game.npc.name || 'PIP').toUpperCase();
      el.npcName.textContent = nm;
      el.npcLbl.textContent = nm.split(' ')[0];   // tiny row label gets the short name
      window.__boxing = { THREE, scene, cam, game, npc: game.npc, log: [], ren,
        weakGpu, gpuName,
        get fight() { return game.fight; }, get sim() { return game.sim; },
        get tracker() { return game.tracker; }, get state() { return game.fight.state; },
        get tutor() { return tutor; },
        get hands() { return hands; }, get face() { return face; } };
    } catch (e) {
      console.warn('boxing: game glue unavailable — idle ring only', e);
      status.textContent = 'ring ready — modules pending';
    }

    /* procedural SFX — lazily imported; unlocks on first gesture (autoplay) */
    let audio = null;
    try {
      const { BoxingAudio } = await audioModP;
      audio = new BoxingAudio();
      if (localStorage.getItem('boxing:sound') === '0') audio.muted = true;
      if (localStorage.getItem('boxing:volume') !== null) {
        const v = Number(localStorage.getItem('boxing:volume'));
        if (Number.isFinite(v)) audio.setVolume(Math.min(1, Math.max(0, v / 100)));
      }
      /* a gesture may already have landed during boot — its stashed ctx is
         running; otherwise the first post-boot gesture builds/adopts one.
         NOT once:true — if the adopted ctx is somehow still suspended, the
         listeners stay armed and the next gesture retries resume() instead
         of burning the one shot. */
      if (earlyAC) audio.unlock(earlyAC);
      const un = () => {
        const c = audio.unlock(earlyAC);
        try { c?.resume?.(); } catch {}
        if (c && c.state !== 'suspended') {
          removeEventListener('pointerdown', un);
          removeEventListener('keydown', un);
        }
      };
      addEventListener('pointerdown', un);
      addEventListener('keydown', un);
      /* a tracked bout may never produce a DOM gesture — keep nudging the
         ctx so any activation that lands mid-boot (nav-propagated gesture,
         cam-allow click, autoplay-permitted profile) flips it live on its
         own instead of waiting for a click that never comes */
      const nudge = () => {
        try { earlyAC?.resume?.(); audio?.ctx?.resume?.(); } catch {}
        if (earlyAC?.state === 'running' || audio?.ctx?.state === 'running') {
          clearInterval(pump); return true;
        }
      };
      let pumps = 0;
      const pump = setInterval(() => { if (++pumps > 60 || nudge()) clearInterval(pump); }, 350);
      addEventListener('pagehide', () => clearInterval(pump));
      addEventListener('pageshow', nudge);
      document.addEventListener('visibilitychange', () => {
        try { document.hidden ? audio?.ctx?.suspend?.() : nudge(); } catch {}
      });
    } catch {}

    /* ================= HUD ================= */
    const FEED = {
      'round-start': (s) => `ROUND ${s.round} — GLOVES UP`,
      'player-hit': (s, lb) => lb?.dmg ? `${String(lb.kind).toUpperCase()} −${Math.round(lb.dmg)}` : 'CONNECTED',
      'player-miss': (s, lb) => `WHIFF${lb?.reason ? ' · ' + String(lb.reason).toUpperCase() : '…'}`,
      'npc-blocked': () => 'BLOCKED',
      'npc-punch': () => 'INCOMING',
      'npc-special': (s) => `${s.npc.telegraph?.special || 'SPECIAL'} — WATCH IT`,
      'player-hit-taken': (s, lb) => lb?.reason === 'ducked-into' ? `DUCKED INTO IT −${Math.round(lb.dmg)}`
        : lb?.dmg ? `${lb.special ? lb.special + ' ' : ''}OUCH −${Math.round(lb.dmg)}` : 'OUCH',
      'player-blocked': (s, lb) => lb?.special ? `${lb.special} — ON THE GLOVES` : 'BLOCKED IT',
      'player-dodged': (s, lb) => lb?.perfect ? 'PERFECT DODGE — UNLOAD!' : 'DODGED · COUNTER!',
      'counter': () => 'COUNTER! +35% POWER',
      'corner': () => 'CORNER — LISTEN UP',
      'rise': (s) => s.rise.depth > 1
        ? `DOWN AGAIN ×${s.rise.depth} — MORE RINGS NOW`
        : 'DOWN — TAG THE RINGS TO GET UP',
      'rise-hit': (s) => `RING TAGGED ${s.rise.got}/${s.rise.need}`,
      'rise-miss': () => 'OFF THE MARK',
      'rise-fade': () => 'RING FADED — NEXT ONE',
      'revive': () => 'BACK UP AT 25%!',
    };
    const FLASH = {
      'player-hit': 'POW!', 'npc-hit': 'POW!', 'player-hit-taken': 'TAGGED!',
      'ko': 'K.O.!', 'player-blocked': 'BLOCKED', 'player-dodged': 'SLIPPED!',
      'counter': 'COUNTER!', 'rise-hit': 'TAGGED!', 'revive': 'UP!',
    };
    let flashT = 0, vinT = 0, calloutT = 0;
    const flash = (t) => { el.flash.textContent = t; el.flash.style.opacity = 1; flashT = performance.now(); };
    const callout = (t, cls = '', ms = 700) => {
      el.callout.textContent = t; el.callout.className = `callout on ${cls}`;
      calloutT = performance.now() + ms;
    };
    const feed = (t) => {
      const d = document.createElement('div'); d.textContent = t;
      el.feed.prepend(d);
      while (el.feed.children.length > 2) el.feed.lastChild.remove();   // just the latest beats
    };
    /* career record — the numbers the lineup's locks read.
       boxing:ko = {n, sum} — every KO adds the round it happened in;
       avg KO round = sum/n (a decimal, e.g. 2.3). Decisions don't count. */
    const store = {
      get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
      set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };
    // stored career numbers are user-editable JSON — a primitive or NaN in
    // there used to crash recordKo (`ko.n +=` on a number) mid-KO
    const num = (v, d = 0) => Number.isFinite(+v) ? +v : d;
    let ended = false;
    const recordEnd = (win, st) => {
      if (practice) return 0;
      const score = st.player.score || 0;
      const best = Math.max(num(store.get('boxing:best', 0)), score);
      store.set('boxing:best', best);
      if (win) store.set('boxing:wins', num(store.get('boxing:wins', 0)) + 1);
      return best;
    };
    const recordKo = (st) => {
      if (practice || st.phase !== 'npcdown') return;
      const s = store.get('boxing:ko', null);
      const ko = s && Number.isFinite(s.n) && Number.isFinite(s.sum) ? s : { n: 0, sum: 0 };
      ko.n += 1; ko.sum += st.round || 1;
      store.set('boxing:ko', ko);
    };
    const showEnd = (win, st) => {
      if (ended) return; ended = true;
      document.body.classList.add('ended');
      el.feed.innerHTML = '';
      el.end.classList.toggle('lose', !win);
      el.endTitle.textContent = win ? 'YOU WIN!' : 'DOWN YOU GO!';
      const name = (st.npc.name || 'PIP').toUpperCase();
      const score = (st.player.score || 0).toLocaleString();
      const best = recordEnd(win, st);
      const tail = best ? ` · BEST ${best.toLocaleString()}` : '';
      el.endSub.textContent = (win ? `${name} DEFEATED · ${score} PTS` : `ROUND ${st.round || 1} · ${score} PTS`) + tail;
      el.end.classList.add('on');
    };
    $('[data-replay]').onclick = () => location.reload();
    /* tutorial wrap-up reuses the end card — the verdict scales with the
       score: sweep the lessons and you're ready; flub most of them and your
       corner has opinions. Straight into the real fight either way. */
    const TUT_QUIPS = [    // indexed by lessons passed — scales to STEPS.length
      'PIP BARELY SWEATED',        // 0
      'YOUR CORNER IS CONCERNED',  // 1
      'WARMING UP, ROOKIE',        // 2
      'HALF A FIGHTER',            // 3
      'CLOSE ENOUGH FOR A BRAWL',  // 4
      'ALMOST A CONTENDER',        // 5
      "YOU'RE READY!",             // 6+ — the lot
    ];
    function showTutorialEnd(passed) {
      if (ended) return; ended = true;
      document.body.classList.add('ended');
      el.feed.innerHTML = '';
      /* tally the LIVE list, not the callback's slice: a final _pass can land
         between _finish()'s snapshot and the endcard paint (the TOTAL failsafe
         fires _finish outside _next, so a just-passed drill reads short) */
      const n = Math.max(passed.length, tutor?.passed?.length ?? 0);
      el.endTitle.textContent = n >= tutSteps ? "YOU'RE READY!"
        : TUT_QUIPS[Math.min(n, TUT_QUIPS.length - 2)];   // partial runs never reach the last quip
      el.endSub.textContent = `BASICS · ${n} / ${tutSteps} NAILED`;
      const go = $('[data-replay]');
      go.textContent = n >= tutSteps ? 'Fight the champ →' : 'Fight anyway →';
      go.onclick = () => { location.href = './boxing.html'; };
      el.end.classList.add('on');
    }

    // ceil the WHOLE remaining time first — ceil(t%60) alone hits 60 for
    // t in (59,60) and printed "0:60" for a second at every minute boundary
    const clock = (t) => { const s = Math.max(0, Math.ceil(t));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
    /* HUD DOM writes are expensive — dirty-check everything: textContent only
       on change, bars via GPU-cheap scaleX (width = layout), class toggles
       behind a compare. ~15 avoided writes/frame at 60fps. */
    const hLast = {};
    const txt = (k, elm, v) => { if (hLast[k] !== v) { hLast[k] = v; elm.textContent = v; } };
    const bar = (k, elm, v) => { v = Math.max(0, Math.min(1, +v || 0));
      if (hLast[k] !== v) { hLast[k] = v; elm.style.transform = `scaleX(${v})`; } };
    const tog = (k, elm, on) => { on = !!on;
      if (hLast[k] !== on) { hLast[k] = on; elm.classList.toggle('on', on); } };
    const togN = (k, on) => { on = !!on;
      if (hLast[k] !== on) { hLast[k] = on; document.body.classList.toggle(k, on); } };
    /* PIP's nameplate rides 3D → screen: projected above the head each frame,
       eased so footwork glides it instead of jittering it. The POW!-style
       flash pops just beside it — where your eyes already are. */
    const plateV = new THREE.Vector3(), plate = { x: -999, y: -999 };
    const placePlate = (st) => {
      const n = game?.npc;
      const show = !!n?.group.visible && st.phase !== 'intro' && st.phase !== 'win' && st.phase !== 'lose';
      if (hLast.plateShow !== show) { hLast.plateShow = show; el.plate.classList.toggle('off', !show); }
      if (!show) return;
      plateV.set(n.group.position.x, (n.height || 1.3) + .2, n.group.position.z).project(cam);
      if (plateV.z > 1) return;
      const tx = (plateV.x + 1) * innerWidth / 2;
      // the plate is anchored by its BOTTOM edge and grows ~105px upward
      // (paper card + tele slot, all always in layout) — clamp low enough
      // that its top edge can never slide under the top HUD strip (~75px)
      const ty = Math.max(180, (1 - plateV.y) * innerHeight / 2);
      if (plate.x < -900) { plate.x = tx; plate.y = ty; }
      plate.x += (tx - plate.x) * .25; plate.y += (ty - plate.y) * .25;
      const pxr = Math.round(plate.x), pyr = Math.round(plate.y);
      if (hLast.plX !== pxr || hLast.plY !== pyr) {
        hLast.plX = pxr; hLast.plY = pyr;
        el.plate.style.transform = `translate(${pxr}px, ${pyr}px) translate(-50%, -100%)`;
        el.flash.style.transform = `translate(${pxr + 125}px, ${pyr + 10}px)`;
      }
    };
    const hud = (out) => {
      const st = out.state;
      /* game.reset() (debug rematch / fresh bout) drops the fight back to
         'intro' — a latched endcard + 'ended' class would otherwise sit
         over the new bout forever and swallow every later verdict. Re-arm
         on a fresh-bout phase (intro OR countdown): a same-tick
         reset()+skipIntro() lands in 'countdown' without hud ever seeing
         'intro'. Round must be 1 — a fresh bout's only countdown — so the
         tutorial card (which shows during mid-bout phases and survives its
         fight's round-2+ transitions) never gets un-latched. */
      if (ended && (st.phase === 'intro' || (st.phase === 'countdown' && st.round === 1))) {
        ended = false;
        document.body.classList.remove('ended');
        el.end.classList.remove('on');
      }
      const intro = st.phase === 'intro';
      togN('fighting', !intro && st.phase !== 'countdown');
      bar('php', el.php, st.player.hp / (st.player.maxHp || 100));
      const nf = st.npc.hp / (st.npc.maxHp || 100);
      bar('nhp', el.nhp, nf);
      bar('nhpG', el.nhpGhost, nf);                 // lagging white chunk shows the bite
      tog('npcGas', el.npcGas, st.npc.gassed && st.phase === 'fighting');
      bar('nstam', el.nstam, st.npc.stamina);
      tog('nstamR', el.nstamW, st.npc.specialReady && st.phase === 'fighting');
      bar('stam', el.stam, st.player.stamina);
      tog('stamCd', el.stamRow, st.player.gassed && st.phase === 'fighting');   // tank's catching its breath
      placePlate(st);
      // 3-2-1: the big number pops in fresh every second — while the bell
      // is held for booting trackers, the countdown slot explains the wait
      const cd = st.phase === 'countdown' ? st.countdown : 0;
      tog('cdOn', el.countdown, cd > 0 || out.entranceWaiting);
      if (out.entranceWaiting) {
        if (hLast.cd !== 'WAIT') { hLast.cd = 'WAIT';
          el.cdRound.textContent = 'FINDING YOUR HANDS'; el.cdN.textContent = '…'; }
      } else if (cd && hLast.cd !== cd) {
        hLast.cd = cd; el.cdN.textContent = cd;
        el.cdRound.textContent = tutorialMode ? 'TUTORIAL' : `ROUND ${st.round}`;
        el.cdN.classList.remove('pop'); void el.cdN.offsetWidth; el.cdN.classList.add('pop');
      } else if (!cd) hLast.cd = 0;
      const rd = intro ? 'RINGSIDE' : tutorialMode ? 'TUTORIAL' : st.round;   // compare the number — the string only builds on change
      if (hLast.rd !== rd) { hLast.rd = rd; el.round.textContent = typeof rd === 'string' ? rd : `ROUND ${rd} / 3`; }
      const clk = Math.ceil(st.timeLeft);           // seconds change ~1/s, not per frame
      if (hLast.clk !== clk) { hLast.clk = clk; el.time.textContent = tutorialMode ? '∞' : clock(st.timeLeft); }
      txt('score', el.score, st.player.score);
      if (hLast.combo !== st.player.combo) { hLast.combo = st.player.combo;
        el.combo.textContent = `${st.player.combo} HIT COMBO`; }
      tog('comboOn', el.combo, st.player.combo >= 2);
      tog('counterOn', el.counter, st.player.counterT > 0 && st.phase === 'fighting');
      const down = st.phase === 'npcdown' || st.phase === 'playerdown';
      tog('countOn', el.count, down);
      if (down) {
        /* a player down runs the ref's full count over the get-up window
           (riseT → 1..10) — the rings + progress live on the hand canvas */
        const rise = st.phase === 'playerdown' && st.rise?.active;
        const n = rise
          ? Math.min(10, Math.floor(game.fight._phaseT / (game.fight._T.riseT / 10)) + 1)
          : Math.min(3, Math.floor(game.fight._phaseT / .8) + 1);
        if (hLast.cntN !== n) { hLast.cntN = n; el.count.firstElementChild.textContent = n; }
        txt('cntLbl', el.count.lastElementChild,
          rise ? `TAG THE RINGS · ${st.rise.got}/${st.rise.need}`
            : st.phase === 'npcdown' ? `${st.npc.name} IS DOWN` : 'YOU ARE DOWN');
      }
      tog('teleOn', el.tele, st.npc.action === 'windup');
      if (st.npc.telegraph) {
        const tg = st.npc.telegraph;
        // telegraph.side is the NPC's glove — it lands on the player's
        // opposite side, so the cue names the guard to raise
        const guardSide = tg.side === 'left' ? 'R' : 'L';
        const how = tg.kind === 'upper' ? 'UPPERCUT · SLIP ⟷ — NO DUCK!'
          : tg.kind === 'hook' ? `HOOK · DUCK ↓ / GUARD ${guardSide}`
          : `JAB · SLIP ⟷ / GUARD ${guardSide}`;
        const name = tg.special ? `${tg.special} — ` : '';
        txt('teleTxt', el.tele, tg.combo ? `COMBO ×${tg.combo + 1} — ${name}${how}` : `${name}${how}`);
      }
      for (const e of out.events) {
        const lg = window.__boxing.log;
        if (lg.length < 4000) lg.push(e);          // debug trace — cap long sessions
        const f = FEED[e]; if (f) feed(f(st, st.lastBlow));
        if (e === 'player-hit-taken') cstats.took++;
        else if (e === 'player-blocked') cstats.blocked++;
        else if (e === 'player-dodged') cstats.slipped++;
        else if (e === 'player-dodge') cstats.slips++;
        else if (e === 'player-hit') cstats.landed++;
        else if (e === 'player-punch' && cstats.thrown[st.lastBlow?.kind] != null)
          cstats.thrown[st.lastBlow.kind]++;
        if (FLASH[e]) flash(FLASH[e]);
        if (e === 'player-hit-taken' || (e === 'ko' && st.phase === 'playerdown')) vinT = performance.now();
        if (e === 'perfect-dodge') callout('PERFECT!', 'perfect', 650);
        if (e === 'rise') callout('GET UP!', 'flurry', 1600);
        if (e === 'revive') callout('BACK IN IT!', 'perfect', 900);
        if (e === 'round-start') callout('FIGHT!', '', 750);
        if (e === 'npc-special') callout(`${st.npc.telegraph?.special || 'SPECIAL'}!`, 'flurry', 850);
        if (e === 'ko') recordKo(st);
        if (e === 'player-hit-taken' && st.lastBlow?.reason === 'ducked-into') callout('DUCKED INTO IT!', '', 800);
        if (e === 'win') showEnd(true, st);
        if (e === 'lose') showEnd(false, st);
      }
      // reeling PIP → the flurry prompt owns the center until it recovers
      const now = performance.now();
      if (st.npc.action === 'stunned' && st.phase === 'fighting' && now > calloutT)
        callout('PUNCH! PUNCH!', 'flurry', 120);
      else if (calloutT && now > calloutT) { el.callout.className = 'callout'; calloutT = 0; }
      // fullscreen CSS filters re-run per composited frame on the live canvas —
      // the biggest single per-frame GPU cost on weak iGPUs, and they fire
      // exactly during hit/slow-mo moments; vin pulse + flash carry the juice
      togN('slowmo', !weakGpu && (out.slow ?? 1) < .9);
      // rung bell: crisp while the glove is planted in your face, THEN the
      // world smears as you reel back from it — harder on heavy shots
      const blur = !weakGpu && st.phase === 'fighting' && !(out.holdT > 0)
        ? Math.min(3.5, st.player.hurtT * 9) : 0;
      const bq = Math.round(blur * 4) / 4;
      if (hLast.blur !== bq) { hLast.blur = bq; el.world.style.filter = bq ? `blur(${bq}px)` : ''; }
      if (flashT && performance.now() - flashT > 1100) { el.flash.style.opacity = 0; flashT = 0; }
      // blood edge: persistent base scales with hp lost + a hot pulse on hits
      const blood = 1 - st.player.hp / (st.player.maxHp || 100);
      const vinPulse = vinT ? Math.max(0, 1 - (performance.now() - vinT) / 500) : 0;
      const vin = Math.min(.92, blood * .55 + vinPulse * .75);
      if (Math.abs(vin - (hLast.vin ?? -1)) > .004) { hLast.vin = vin; el.vin.style.opacity = vin; }
    };

    /* ================= halftime corner =================
       On the ropes — two-thirds of the tank gone — the bout takes ONE coach
       timeout per fight: the card slides up over your health plate with a
       live corner tip (TensorMux glm-4-7-flash; canned wisdom when it's
       unreachable) while cornerHold freezes the whole bout behind it, then
       the next round bells in with a partial patch-up — never a full heal.
       Off in practice/tutorial (scripted bout) and ?notrack (e2e soaks the
       player — a mid-test freeze would hang the KO waits); ?coach=0 forces
       it off, ?coach=1 forces it on. */
    const COACH = {
      url: '/api/coach',    // server.mjs proxies TensorMux — the key stays off the page
      hold: 8000,           // break length — then the bell deals the next round
      apiMs: 5000,          // the tip can never hold up the restart
      wipeIn: 340,          // blackout falls — the walk back to the marks hides under it
      wipeHold: 260,        // a beat at full black before the curtain lifts
      pop: 1150,            // ROUND card length — 3-2-1 only deals once it's gone
    };
    const coachOn = params.get('coach') === '1'
      || (params.get('coach') !== '0' && params.get('coach') !== 'off' && !practice && !noTrack);
    const corner = { on: false, used: false, t0: 0, skip: false, voice: null,
      stage: 'idle', stageT: 0, resetDone: false, tip: null, voiced: false,
      bout: -1 };
    /* what the corner actually SAW: punches by kind, where each glove sits
       (guard level = hand raised into the face band, sampled every fighting
       frame), slips/ducks attempted, hits eaten vs blocked vs landed. This is
       the scouting report the tip is built on — not just the scoreline. */
    const cstats = { took: 0, blocked: 0, slipped: 0, landed: 0, slips: 0,
      thrown: { jab: 0, cross: 0, hook: 0, uppercut: 0 },
      gL: 0, gR: 0, gN: 0, duckSum: 0 };
    const cstatsReset = () => {
      cstats.took = cstats.blocked = cstats.slipped = cstats.landed = cstats.slips = 0;
      for (const k in cstats.thrown) cstats.thrown[k] = 0;
      cstats.gL = cstats.gR = cstats.gN = cstats.duckSum = 0;
    };
    const COACH_TIPS = [    // offline corner wisdom — same voice, no network
      'Hands up, chin down — make them miss before you make them pay.',
      'Stop trading. Slip the jab, counter the hook, steal the round back.',
      'Breathe. Jab in, touch and move — no more brawling.',
      'Cover the side the hook keeps finding. Duck under it and unload.',
    ];
    let tipN = 0;
    /* scouting report from the hands themselves: which glove drifts, what
       gets thrown, whether they move their head. Reads like what a real
       corner watched from the stool — the model turns it into the tip. */
    const scoutReport = () => {
      const th = cstats.thrown, tot = th.jab + th.cross + th.hook + th.uppercut;
      const kinds = Object.keys(th).filter(k => th[k] > 0)
        .sort((a, b) => th[b] - th[a]).map(k => `${th[k]} ${k}s`);
      const gL = cstats.gN ? cstats.gL / cstats.gN : 0,
            gR = cstats.gN ? cstats.gR / cstats.gN : 0;
      const drifts = Math.abs(gL - gR) < .18 ? null : gL < gR ? 'left' : 'right';
      const duckAvg = cstats.gN ? cstats.duckSum / cstats.gN : 0;
      return `Fighter habits: ${tot ? `threw ${tot} punches (${kinds.join(', ')})` : 'threw almost nothing'}, ` +
        `left glove up ${(gL * 100) | 0}% of the time, right ${(gR * 100) | 0}%` +
        `${drifts ? ` — ${drifts} glove drifts` : ''}, slipped ${cstats.slips}x, ` +
        `ducked ${(duckAvg * 100) | 0}% of the time.`;
    };
    async function coachAdvice(hpPct, st) {
      const prompt =
        `You are a boxing corner coach at halftime — ONE urgent tip, under 20 words, ` +
        `plain speech, no quotes, never recite the stats back. ` +
        `Your fighter: ${hpPct}% health, took ${cstats.took} clean hits, ` +
        `blocked ${cstats.blocked}, dodged ${cstats.slipped}, landed ${cstats.landed}. ` +
        `${scoutReport()} ` +
        `Opponent ${st.npc.name || 'PIP'}: ${Math.round(st.npc.hp / (st.npc.maxHp || 1) * 100)}% health` +
        `${st.npc.gassed ? ', winded' : ''}.`;
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), COACH.apiMs);
      try {
        const r = await fetch(COACH.url, { method: 'POST', signal: ctl.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }) });
        const d = await r.json().catch(() => null);
        const t = String(d?.tip || '').trim();
        if (t) return t.slice(0, 140);
      } catch {} finally { clearTimeout(to); }
      return COACH_TIPS[tipN++ % COACH_TIPS.length];
    }
    /* the corner TALKS: tip text → mp3 via /api/coach-voice (ElevenLabs key
       stays server-side). A muted game keeps a silent corner; a clip can't
       outlive its own card (stale fetch → discarded, close → paused) — a
       late fetch must never start talking over the blackout/round card. */
    async function coachVoice(t, myT0) {
      if (audio?.muted) return;
      try {
        const r = await fetch('/api/coach-voice', { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: t, voice: params.get('voice') || undefined }) });
        if (!r.ok) return;                       // 501 no-key / 502 upstream — quiet card
        const buf = await r.arrayBuffer();
        if (!corner.on || corner.t0 !== myT0 || corner.stage !== 'coach' || !buf.byteLength) return;
        corner.voice?.pause?.();
        const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/mpeg' })));
        corner.voice = a; a.play().catch(() => {});
      } catch {}
    }
    /* trigger + break clock — runs every frame from the main loop:
       fresh bout re-arms the one-time flag and wipes the prompt stats;
       two-thirds gone while fighting → patch up + next round's countdown.
       The scramble folds to black FIRST (never a mid-fight freeze frame):
       under the curtain both fighters walk back to their marks, the coach
       card talks over the reset corners, then the ROUND card pops, and only
       once it's gone does the 3-2-1 deal the bell. corner.on (→ cornerHold)
       holds the freeze through every beat. */
    const cornerTick = (st, now) => {
      /* a fresh bout re-arms the corner on ANY frame — the bout epoch bumps
         inside reset(), so the sighting survives step-bursts that burn
         intro/countdown between rAFs (the old phase-sighting could miss the
         window entirely and latch `used` for the whole bout) */
      if (st.bout !== corner.bout) {
        corner.bout = st.bout;
        if (corner.on || corner.stage !== 'idle') {   // rematch mid-break — every stage prop dies with it
          corner.on = false; corner.stage = 'idle'; corner.voice?.pause?.();
          el.coach.classList.remove('on');
          el.wipe.classList.remove('on');
          el.rpop.classList.remove('on');
        }
        corner.used = false;
        cstatsReset();
      }
      // keep watching the gloves — the report's only honest if it's live
      if (st.phase === 'fighting') {
        const g = game?.tracker?.guard;
        cstats.gL += g?.left || 0; cstats.gR += g?.right || 0; cstats.gN++;
        cstats.duckSum += game?.tracker?.duck || 0;
      }
      if (coachOn && !corner.on && !corner.used && st.phase === 'fighting'
          && st.player.hp > 0 && st.player.hp / (st.player.maxHp || 1) <= 1 / 3) {
        corner.used = true;
        const hpPct = Math.round(st.player.hp / (st.player.maxHp || 1) * 100);
        if (game?.fight.corner?.()) {
          corner.on = true; corner.skip = false; corner.t0 = now;
          corner.stage = 'wipe'; corner.stageT = now; corner.resetDone = false;
          corner.tip = null; corner.voiced = false;
          txt('ctip', el.coachTip, '— your corner is shouting over the crowd —');
          el.wipe.classList.add('on');                       // the scramble folds to black FIRST
          audio?.play('whoosh', { kind: 'uppercut', miss: true, peak: .5 });   // heavy curtain swish
          // the tip fetch starts NOW — it can land mid-wipe, ready when the card opens
          const myT0 = corner.t0;         // a slow tip can't land into the NEXT break
          coachAdvice(hpPct, st).then(t => {
            const good = corner.on && corner.t0 === myT0
              && (corner.stage === 'wipe' || corner.stage === 'coach');
            if (!good) return;
            corner.tip = t; txt('ctip', el.coachTip, t);
            if (corner.stage === 'coach' && !corner.voiced) { corner.voiced = true; coachVoice(t, myT0); }
          });
        }
      }
      if (!corner.on) return;
      switch (corner.stage) {
        case 'wipe': {
          const u = now - corner.stageT;
          if (!corner.resetDone && u >= COACH.wipeIn + COACH.wipeHold * .5) {
            game?.recenter?.();      // back to the original marks — invisible at black
            corner.resetDone = true;
          }
          if (u >= COACH.wipeIn + COACH.wipeHold) {
            el.wipe.classList.remove('on');                   // curtain lifts on reset marks —
            corner.stage = 'coach'; corner.stageT = now;      // THEN the corner talks
            el.coachRd.textContent = `ROUND ${st.round} UP NEXT · PATCHED TO ${Math.round(st.player.hp / st.player.maxHp * 100)}%`;
            el.coach.classList.add('on');
            feed('CORNER — LISTEN UP');
            callout('HALFTIME', 'perfect', 1200);
            // a tip that beat the card in gets its voice the moment it opens
            if (corner.tip && !corner.voiced) { corner.voiced = true; coachVoice(corner.tip, corner.t0); }
          }
          break;
        }
        case 'coach': {
          const left = COACH.hold - (now - corner.stageT);
          bar('ctime', el.coachTime, left / COACH.hold);
          if (left <= 0 || corner.skip) {
            corner.stage = 'card'; corner.stageT = now;
            corner.voice?.pause?.();
            el.coach.classList.remove('on');
            txt('rpn', el.rpRound, `ROUND ${st.round}`);
            el.rpop.classList.remove('on'); void el.rpop.offsetWidth;   // restart the pop
            el.rpop.classList.add('on');
            audio?.play('bell', { times: 1 });                // the card announces the round
          }
          break;
        }
        case 'card': {
          // the countdown waits its turn — it only deals once the card's gone
          if (now - corner.stageT >= COACH.pop) {
            el.rpop.classList.remove('on');
            corner.stage = 'idle'; corner.on = false;         // freeze off → 3-2-1 ticks
          }
          break;
        }
        default: corner.stage = 'idle'; corner.on = false;
      }
    };
    el.coachGo.onclick = () => { corner.skip = true; };

    /* ================= mouse fallback =================
       left-drag = left glove thrust, right-drag = right glove,
       shift-drag = sway. Synthetic fists whose landmark span swells on
       press — the same "hand grows bigger = punch" signal the tracker eats. */
    const mouse = { l: false, r: false, lx: .3, ly: .55, rx: .7, ry: .55, tL: 9, tR: 9,
      swaying: false, sway: 0 };
    const SH = [[0,1.15],[.55,.78],[.8,.5],[1.0,.32],[1.12,.18],   // mitten-ish 21-pt
      [.36,-.12],[.4,-.4],[.42,-.6],[.44,-.74],                     // cloud; span(lm0→lm9)=1.35·s
      [0,-.2],[0,-.48],[0,-.7],[0,-.86],
      [-.34,-.12],[-.38,-.36],[-.4,-.55],[-.42,-.68],
      [-.6,-.05],[-.66,-.26],[-.7,-.42],[-.72,-.52]];
    // two persistent synth hands — tracker reads them fresh each frame, so
    // rebuilding the 21-pt cloud + wrapper objects per frame was pure churn
    const mkHand = (side) => ({ side, kind: 'fist',
      lm: SH.map(() => ({ x: 0, y: 0, z: 0 })),
      palm: { x: 0, y: 0 }, wrist: { x: 0, y: 0 },
      indexTip: { x: 0, y: 0 }, pinchAt: { x: 0, y: 0 },
      pinchD: .2, nExt: 0, nExtAll: 0 });
    const synthL = mkHand('left'), synthR = mkHand('right');
    const mouseArr = [];
    const MOUSE_HS = { hands: mouseArr, pinch: null, point: null, orbit: null, zoom: null, spread: null };
    const synth = (h, cx, cy, s) => {
      const lm = h.lm;
      for (let i = 0; i < 21; i++) { lm[i].x = cx + SH[i][0] * s; lm[i].y = cy + SH[i][1] * s; }
      h.palm.x = cx; h.palm.y = cy; h.wrist.x = cx; h.wrist.y = cy + s * 1.15;
      h.indexTip.x = cx + s * .4; h.indexTip.y = cy - s * .7;
      h.pinchAt.x = cx + s * .6; h.pinchAt.y = cy - s * .4;
      return h;
    };
    // A press makes one deliberate throw. Dragging steers that glove, while
    // release ends the reach; holding the button cannot auto-punch forever.
    const spanFor = (t) => {
      return .04 + .055 * Math.min(1, t / .2);
    };
    const mouseHands = () => {
      mouseArr.length = 0;
      if (mouse.l) mouseArr.push(synth(synthL, mouse.lx, mouse.ly, spanFor(mouse.tL)));
      if (mouse.r) mouseArr.push(synth(synthR, mouse.rx, mouse.ry, spanFor(mouse.tR)));
      return MOUSE_HS;
    };
    const mFace = { found: true, manual: true, nose: { x: .5, y: .45 }, size: .3, center: { x: .5, y: .45 } };
    const mouseFace = () => { mFace.nose.x = mFace.center.x = .5 + mouse.sway * .38; return mFace; };
    const mouseLive = () => mouse.l || mouse.r || mouse.swaying;

    cvs.addEventListener('contextmenu', e => e.preventDefault());
    cvs.addEventListener('pointerdown', e => {
      cvs.setPointerCapture(e.pointerId);
      const x = e.clientX / innerWidth, y = e.clientY / innerHeight;
      if (e.shiftKey || e.button === 1) { mouse.swaying = true; mouse.sway = (x - .5) * 2; }
      else if (e.button === 2) { mouse.r = true; mouse.rx = x; mouse.ry = y; mouse.tR = 0; }
      else { mouse.l = true; mouse.lx = x; mouse.ly = y; mouse.tL = 0; }
    });
    cvs.addEventListener('pointermove', e => {
      const x = e.clientX / innerWidth, y = e.clientY / innerHeight;
      if (mouse.swaying) mouse.sway = THREE.MathUtils.clamp((x - .5) * 2, -1, 1);
      if (mouse.l) { mouse.lx = x; mouse.ly = y; }
      if (mouse.r) { mouse.rx = x; mouse.ry = y; }
    });
    const releaseMouse = (e) => {
      if (e.button === 2) mouse.r = false;
      else if (e.button === 1 || e.shiftKey) { mouse.swaying = false; mouse.sway = 0; }
      else mouse.l = false;
    };
    cvs.addEventListener('pointerup', releaseMouse);
    cvs.addEventListener('pointercancel', releaseMouse);
    const moveKeys = { forward: false, back: false, left: false, right: false, duck: false, guard: false };
    Object.defineProperty(window.__boxing, 'moveKeys', { get: () => moveKeys });
    const DODGE_KEYS = { a: 'left', A: 'left', ArrowLeft: 'left', d: 'right', D: 'right', ArrowRight: 'right', ' ': 'duck',
      f: 'guard', F: 'guard' };
    let dodgeTap = 0, duckTap = false;
    const entranceInput = { sign: null, until: 0 };
    // emotes are a post-fight victory lap (or a sheepish wave after a loss)
    const entrancePose = sign => { entranceInput.sign = sign; entranceInput.until = performance.now() + 1800; };
    document.querySelectorAll('[data-sign]').forEach(button =>
      button.addEventListener('click', () => entrancePose(button.dataset.sign)));
    $('[data-skip-intro]')?.addEventListener('click', () => game?.skipIntro());
    addEventListener('keydown', e => {
      const ph = game?.fight.state.phase;
      if (corner.on && e.key === 'Enter') { corner.skip = true; e.preventDefault(); }
      if (ph === 'intro' && e.key === 'Enter') { game.skipIntro(); e.preventDefault(); }
      if (ph === 'win' || ph === 'lose') {
        const signs = { '1': 'wave', '2': 'hype', '3': 'point', '4': 'victory', '5': 'ready' };
        if (signs[e.key]) { entrancePose(signs[e.key]); e.preventDefault(); }
      }
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') { moveKeys.forward = true; e.preventDefault(); }
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') { moveKeys.back = true; e.preventDefault(); }
      if (DODGE_KEYS[e.key] && !e.repeat) {
        const k = DODGE_KEYS[e.key];
        moveKeys[k] = true; e.preventDefault();
        if (k === 'left' || k === 'right') dodgeTap = k === 'left' ? -1 : 1;   // latched — a sub-frame tap still slips
        else if (k === 'duck') duckTap = true;
      }
      if (e.key === 'c' || e.key === 'C') { game?.calibrate(); mouse.sway = 0; }
      if (e.key === 'm' || e.key === 'M') { if (audio) { audio.unlock(earlyAC); audio.muted = !audio.muted; } }
    });
    addEventListener('keyup', e => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') moveKeys.forward = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') moveKeys.back = false;
      if (DODGE_KEYS[e.key]) moveKeys[DODGE_KEYS[e.key]] = false;
    });
    addEventListener('blur', () => { for (const k in moveKeys) moveKeys[k] = false; });

    /* ================= glove overlay =================
       The first-person mitts represent visible tracked hands. A hand with no
       current landmarks leaves the canvas; the avatar's third-person gloves
       are meshes attached to its arms. */
    const hc = $('#hands'), hx = hc.getContext('2d');
    const mkGlove = (x, y) => ({ x, y, size: 60, ang: 0, dim: 0, reach: 1,
      lastP: null,
      /* tracking results land at camera rate (~30Hz) while we render 40-60fps —
         tx/ty/tsize/tang is the newest measured pose, tT when it arrived,
         vx/vy/vsize/vang its EMA velocity for ≤80ms of extrapolation */
      tx: x, ty: y, tsize: 60, tang: 0, tT: -9,
      vx: 0, vy: 0, vsize: 0, vang: 0, hasT: false });
    const gloves = { left: mkGlove(.3, .68), right: mkGlove(.7, .68) };
    const GLOVE_SIDES = ['left', 'right'];
    const MCP = [0, 5, 9, 13, 17];
    // persistent landmark pixel buffers + mitt args — nothing allocates per frame
    const gloveLM = {   // raw target shape (latest result)
      left:  Array.from({ length: 21 }, () => ({ x: 0, y: 0 })),
      right: Array.from({ length: 21 }, () => ({ x: 0, y: 0 })),
    };
    const dispLM = {    // eased displayed shape — chases gloveLM at the follow rate
      left:  Array.from({ length: 21 }, () => ({ x: 0, y: 0 })),
      right: Array.from({ length: 21 }, () => ({ x: 0, y: 0 })),
    };
    const found = { left: null, right: null };
    const mittPos = { x: 0, y: 0, size: 0, ang: 0 };
    const mittOpts = { side: 'left', kind: 'fist', reach: 1, squash: 0, dim: 1, lm: null };
    const wrapAng = (a) => ((a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    const blockFx = { t: -9, side: 'right' };        // white shield burst on a caught block
    const hitFx = { t: -9, x: .5, y: .5, heavy: false };   // comic impact frame when you get tagged
    // fixed pseudo-random spoke table — impact lines never allocate per frame
    const SPOKES = Array.from({ length: 34 }, (_, i) => ({
      a: i / 34 * Math.PI * 2 + Math.sin(i * 12.9898) * .08,
      w: .55 + (Math.sin(i * 78.233) * .5 + .5) * .9, r0: .5 + (Math.sin(i * 4.1) * .5 + .5) * .2 }));
    const drawImpact = (nowS) => {
      const u = (nowS - hitFx.t) / (hitFx.heavy ? .5 : .38);
      if (u < 0 || u >= 1) return;
      const W = hc.width, H = hc.height, cx = W * hitFx.x, cy = H * hitFx.y, R = Math.hypot(W, H) * .6;
      if (u < .1) {                                     // 1-2 frame white pop
        hx.globalAlpha = (1 - u / .1) * (hitFx.heavy ? .85 : .6);
        hx.fillStyle = '#fff8ec'; hx.fillRect(0, 0, W, H);
      }
      hx.globalAlpha = (1 - u) * .9;                     // ink speed-lines converge on the glove
      hx.fillStyle = '#2b2118';
      hx.beginPath();
      for (const s of SPOKES) {
        const r0 = R * (s.r0 + u * .12), w = s.w * .022;
        hx.moveTo(cx + Math.cos(s.a) * R, cy + Math.sin(s.a) * R);
        hx.lineTo(cx + Math.cos(s.a - w) * r0, cy + Math.sin(s.a - w) * r0);
        hx.lineTo(cx + Math.cos(s.a + w) * r0, cy + Math.sin(s.a + w) * r0);
        hx.closePath();
      }
      hx.fill();
      hx.globalAlpha = 1;
    };
    const KEY_GUARD = { left: 1, right: 1 };
    const liveGuard = () => moveKeys.guard ? KEY_GUARD : game?.tracker?.guard || {};   // F key shows too
    const drawOverlay = (hs, dt, out) => {
      const nowS = performance.now() / 1000;
      const k = 1;  // direct hand-to-glove mapping; tracker cadence sets the update rate
      hx.clearRect(0, 0, hc.width, hc.height);
      const reach = game?.tracker?.reach;                 // live view — debug() allocates
      found.left = found.right = null;
      for (const hnd of (hs.hands || []))
        // NaN-safe: a malformed landmark set must never poison the glove pose —
        // the mitt draws all 21 points, so every one must be finite
        if (hnd?.lm?.length >= 21 && hnd.side && found[hnd.side] == null
          && hnd.lm.every(p => Number.isFinite(p?.x) && Number.isFinite(p?.y))) found[hnd.side] = hnd;
      for (const side of GLOVE_SIDES) {
        const g = gloves[side], hnd = found[side];
        if (hnd) {
          const P = gloveLM[side], lm = hnd.lm;
          for (let i = 0; i < 21; i++) { P[i].x = lm[i].x * hc.width; P[i].y = lm[i].y * hc.height; }
          let mx = 0, my = 0;
          for (const i of MCP) { mx += P[i].x; my += P[i].y; }
          if (!g.lastP) {   // first sight — snap the eased shape too
            const D = dispLM[side];
            for (let i = 0; i < 21; i++) { D[i].x = P[i].x; D[i].y = P[i].y; }
          }
          g.lastP = dispLM[side];
          // newest measured pose + arrival interval → EMA velocity. Tracking
          // drops in at ~30Hz; we render at 40-60, so the glove extrapolates
          // up to 80ms past the latest result instead of stair-stepping.
          const nx = mx / 5, ny = my / 5;
          const nsize = Math.max(26, Math.hypot(P[0].x - P[9].x, P[0].y - P[9].y));
          const nang = Math.atan2(P[9].y - P[0].y, P[9].x - P[0].x);
          // only a NEW result moves the target — identical numbers mean the
          // last landmark set is still current (hnd object is per-result too)
          if (nx !== g.tx || ny !== g.ty || nsize !== g.tsize || nang !== g.tang) {
            const dtIn = Math.min(.2, Math.max(.005, nowS - g.tT));
            if (g.hasT) {
              const k2 = 1 - Math.exp(-dtIn * 8);           // heavy vel smoothing
              let vx = (nx - g.tx) / dtIn, vy = (ny - g.ty) / dtIn;
              const vs = Math.hypot(vx, vy), VMAX = 3200;   // px/s sanity cap
              if (vs > VMAX) { vx *= VMAX / vs; vy *= VMAX / vs; }
              g.vx += (vx - g.vx) * k2; g.vy += (vy - g.vy) * k2;
              g.vsize += ((nsize - g.tsize) / dtIn - g.vsize) * k2;
              g.vang += (wrapAng(nang - g.tang) / dtIn - g.vang) * k2;
            } else {   // first sight — snap, don't glide in from the corner
              g.hasT = true; g.vx = g.vy = g.vsize = g.vang = 0;
              g.x = nx; g.y = ny; g.size = nsize; g.ang = nang;
            }
            g.tx = nx; g.ty = ny; g.tsize = nsize; g.tang = nang; g.tT = nowS;
          }
          // ease the drawn landmark cloud toward the freshest result —
          // knuckle/finger shape glides instead of snapping each ~30Hz update
          {
            const D = dispLM[side];
            for (let i = 0; i < 21; i++) {
              D[i].x += (P[i].x - D[i].x) * k;
              D[i].y += (P[i].y - D[i].y) * k;
            }
          }
          g.dim += (1 - g.dim) * .35;
        } else {
          g.lastP = null;
          g.hasT = false;
          g.vx = g.vy = g.vsize = g.vang = 0;
          continue;
        }
        // Draw the latest measured pose. Extrapolation made the glove move at
        // a different speed from the camera hand during stops and reversals.
        g.x = g.tx;
        g.y = g.ty;
        g.size = g.tsize;
        g.ang = g.tang;
        // contact clamp — display reach capped by ring distance
        let dispReach = reach?.[side] ?? 1;
        const d = game?.sim?.distance?.() ?? 9;
        dispReach = Math.min(dispReach, d <= 1.6 ? 1.3 : 1.05);
        g.reach = dispReach;
        const squash = Math.max(0, Math.min(1, (g.reach - 1.04) * 2.4));
        // "this side is covered" — a soft shield glow behind the mitt while
        // its guard is up; the threatened-side chevron reads against this
        const guardNow = liveGuard();
        if ((guardNow[side] || 0) >= .55) {
          hx.beginPath(); hx.arc(g.x, g.y, g.size * .72, 0, Math.PI * 2);
          hx.fillStyle = `rgba(255,248,236,${.12 + (guardNow[side] - .55) * .35})`; hx.fill();
        }
        // afterimage on fast mitts — the trail is what makes a punch LOOK
        // fast; the glove itself stays sharp on top
        const spd = Math.hypot(g.vx, g.vy);
        if (spd > 700) {
          const t = Math.min(.05, 900 / spd * .04);
          mittPos.x = g.x - g.vx * t; mittPos.y = g.y - g.vy * t;
          mittPos.size = g.size; mittPos.ang = g.ang;
          mittOpts.side = side; mittOpts.kind = hnd?.kind || 'fist';
          mittOpts.reach = g.reach; mittOpts.squash = squash;
          mittOpts.dim = g.dim * .22; mittOpts.lm = g.lastP;
          mittOpts.cap = 96; mittOpts.arm = null;
          mitt?.draw(hx, mittPos, mittOpts);
        }
        mittPos.x = g.x; mittPos.y = g.y; mittPos.size = g.size; mittPos.ang = g.ang;
        mittOpts.side = side; mittOpts.kind = hnd?.kind || 'fist';
        mittOpts.reach = g.reach; mittOpts.squash = squash;
        mittOpts.dim = g.dim; mittOpts.lm = g.lastP;
        mittOpts.cap = 96; mittOpts.arm = null;
        mitt?.draw(hx, mittPos, mittOpts);
      }
      /* ---- fight-read cues ------------------------------------------------
         telegraph: which side to cover. telegraph.side names the NPC's glove;
         it lands on the player's OPPOSITE side. The chevron pulses faster as
         the swing charges and flips green the moment that side is guarded. */
      if (out?.events) for (const e of out.events) {
        if (e === 'player-blocked') {
          blockFx.t = nowS;
          blockFx.side = out.state?.lastBlow?.side === 'left' ? 'right'
            : out.state?.lastBlow?.side === 'right' ? 'left' : blockFx.side;
          const bg = gloves[blockFx.side];
          blockFx.x = bg?.x ?? hc.width * (blockFx.side === 'left' ? .35 : .65);
          blockFx.y = bg?.y ?? hc.height * .55;
        }
        if (e === 'player-hit-taken') {
          const lb = out.state?.lastBlow || {};
          hitFx.t = nowS; hitFx.heavy = (lb.dmg || 0) >= 12;
          // PIP's left glove lands on your right; uppercuts come up the middle
          hitFx.x = lb.kind === 'upper' ? .5 : lb.side === 'left' ? .58 : .42;
          hitFx.y = lb.kind === 'upper' ? .6 : .5;
        }
      }
      drawImpact(nowS);
      const tel = out?.telegraph;
      const g2 = liveGuard();

      // Active guard visual cues — raised mitts show an energetic protective aura
      for (const side of GLOVE_SIDES) {
        const gLev = g2[side] || 0;
        if (gLev >= .45) {
          const g = gloves[side];
          if (g && g.lastP) {
            hx.save();
            const pulse = .5 + .5 * Math.sin(nowS * 14);
            const gR = (g.size || 55) * (1.1 + pulse * .08);
            hx.globalAlpha = Math.min(.85, (gLev - .45) * 2 * (.6 + pulse * .4));
            hx.lineWidth = 3.5;
            hx.strokeStyle = '#FFE17A';
            hx.setLineDash([7, 5]);
            hx.beginPath();
            hx.arc(g.x, g.y, gR, 0, Math.PI * 2);
            hx.stroke();
            hx.setLineDash([]);
            // little guard corner pips
            hx.lineWidth = 2.5;
            hx.strokeStyle = '#2B2118';
            hx.stroke();
            hx.restore();
          }
        }
      }

      if (tel && out?.state?.phase === 'fighting') {
        const side = tel.side === 'left' ? 'right' : 'left';
        const u = Math.min(1, tel.t01 || 0);
        const covered = (g2[side] || 0) >= .55;
