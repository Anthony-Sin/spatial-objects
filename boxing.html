        const cx = side === 'left' ? hc.width * .12 : hc.width * .88;
        const cy = hc.height * .40;
        const pulse = .5 + .5 * Math.sin(nowS * (9 + u * 26));
        const R = (30 + u * 22 + pulse * 9) * OVSC;
        const dir = side === 'left' ? 1 : -1;
        hx.globalAlpha = .55 + .45 * pulse;
        hx.fillStyle = covered ? '#4fb06d'
          : `rgb(255,${Math.round(140 - 80 * u)},${Math.round(70 - 50 * u)})`;
        hx.beginPath();                                   // inward chevron
        hx.moveTo(cx - dir * R * .75, cy - R);
        hx.lineTo(cx + dir * R * .45, cy);
        hx.lineTo(cx - dir * R * .75, cy + R);
        hx.quadraticCurveTo(cx - dir * R * .3, cy, cx - dir * R * .75, cy - R);
        hx.fill();
        hx.globalAlpha = .92;
        hx.fillStyle = covered ? '#fff8ec' : '#2b2118';     // kind glyph
        const gy = cy - R * .18, gsz = R * .5;
        if (tel.kind === 'upper') {                        // ▲ comes up
          hx.beginPath(); hx.moveTo(cx, gy - gsz * .5);
          hx.lineTo(cx + gsz * .55, gy + gsz * .5);
          hx.lineTo(cx - gsz * .55, gy + gsz * .5); hx.closePath(); hx.fill();
        } else if (tel.kind === 'hook') {                  // ~ whips sideways
          hx.lineWidth = gsz * .3; hx.lineCap = 'round'; hx.strokeStyle = hx.fillStyle;
          hx.beginPath(); hx.arc(cx, gy + gsz * .15, gsz * .55,
            side === 'left' ? -1.4 : Math.PI - 1.4, side === 'left' ? 1.4 : Math.PI + 1.4,
            side !== 'left'); hx.stroke();
        } else {                                           // ! straight at you
          hx.beginPath(); hx.roundRect(cx - gsz * .12, gy - gsz * .55, gsz * .24, gsz * .7, gsz * .12); hx.fill();
          hx.beginPath(); hx.arc(cx, gy + gsz * .42, gsz * .16, 0, Math.PI * 2); hx.fill();
        }
        hx.globalAlpha = 1;
      }
      // caught it on the gloves — comic shield burst at the blocking mitt
      const bt = (nowS - blockFx.t) / .42;
      if (bt >= 0 && bt < 1) {
        const gx = blockFx.x || gloves[blockFx.side]?.x || hc.width * .5;
        const gy = blockFx.y || gloves[blockFx.side]?.y || hc.height * .5;
        const gsz = gloves[blockFx.side]?.size || 70;
        const easeOut = 1 - Math.pow(1 - bt, 3);
        const R = gsz * (.55 + easeOut * 1.5);
        const alpha = Math.max(0, 1 - bt);

        hx.save();
        // 1. Dual shockwave rings with ink borders
        hx.lineWidth = 4 * alpha + 1;
        hx.strokeStyle = '#2B2118';
        hx.beginPath(); hx.arc(gx, gy, R + 3, 0, Math.PI * 2); hx.stroke();
        hx.strokeStyle = '#FFE17A';
        hx.lineWidth = 5 * alpha + 1.5;
        hx.beginPath(); hx.arc(gx, gy, R, 0, Math.PI * 2); hx.stroke();

        // 2. Comic hex-shield flash in the first half of the pop
        if (bt < .5) {
          const su = bt / .5;
          const sR = gsz * (.7 + su * .9);
          hx.globalAlpha = (1 - su) * .85;
          hx.fillStyle = '#FFF8EC';
          hx.strokeStyle = '#2B2118';
          hx.lineWidth = 3;
          hx.beginPath();
          for (let i = 0; i < 6; i++) {
            const ang = i * Math.PI / 3 - Math.PI / 6;
            const px = gx + Math.cos(ang) * sR;
            const py = gy + Math.sin(ang) * sR;
            if (i === 0) hx.moveTo(px, py); else hx.lineTo(px, py);
          }
          hx.closePath();
          hx.fill(); hx.stroke();
        }

        // 3. Radial comic spark rays with diamond tips
        hx.globalAlpha = alpha;
        hx.fillStyle = '#FFD13B';
        hx.strokeStyle = '#2B2118';
        hx.lineWidth = 2.2;
        const rayLen = gsz * (.7 + easeOut * .8);
        const rayDist = gsz * (.35 + easeOut * .5);
        for (let i = 0; i < 8; i++) {
          const ang = i * Math.PI / 4 + .2;
          const sx = gx + Math.cos(ang) * rayDist;
          const sy = gy + Math.sin(ang) * rayDist;
          const ex = gx + Math.cos(ang) * (rayDist + rayLen * .4);
          const ey = gy + Math.sin(ang) * (rayDist + rayLen * .4);
          hx.beginPath();
          hx.moveTo(sx, sy); hx.lineTo(ex, ey);
          hx.stroke();
          const spz = 5.5 * alpha;
          hx.beginPath();
          hx.moveTo(ex, ey - spz);
          hx.lineTo(ex + spz * .7, ey);
          hx.lineTo(ex, ey + spz);
          hx.lineTo(ex - spz * .7, ey);
          hx.closePath();
          hx.fill(); hx.stroke();
        }

        // 4. Punchy comic text pop: "BLOCK!"
        if (bt < .82) {
          const tu = bt / .82;
          const scale = tu < .2 ? tu / .2 * 1.15 : 1.15 - (tu - .2) * .2;
          const ty = gy - gsz * (.75 + tu * .35);
          hx.globalAlpha = Math.min(1, (1 - tu) * 1.4);
          hx.save();
          hx.translate(gx, ty);
          hx.rotate(blockFx.side === 'left' ? -.12 : .12);
          hx.scale(scale, scale);
          hx.font = '900 24px "Outfit", system-ui, sans-serif';
          hx.textAlign = 'center';
          hx.textBaseline = 'middle';
          hx.fillStyle = '#2B2118';
          hx.fillText('BLOCK!', 2, 3);
          hx.fillStyle = '#FFD13B';
          hx.strokeStyle = '#2B2118';
          hx.lineWidth = 4;
          hx.strokeText('BLOCK!', 0, 0);
          hx.fillText('BLOCK!', 0, 0);
          hx.restore();
        }

        hx.restore();
      }

      /* ---- get-up QTE ------------------------------------------------------
         You're down, the ref's counting — tag `need` rings before it ends.
         One ring pops at a time (sun donut, ink rims) with a coral fuse arc
         draining its own per-ring timer; tagged rings light the pips and the
         top bar is the whole count window running out. */
      const rise = out?.state?.rise;
      if (rise?.active && out.state.phase === 'playerdown') {
        const W = hc.width, H = hc.height;
        const cx = rise.x * W, cy = rise.y * H, R = rise.r * W;
        const popIn = Math.min(1, (1 - rise.each01) * 9);        // springy spawn
        const pulse = 1 + Math.sin(nowS * 9) * .045;
        const RR = Math.max(6, R * (.55 + .45 * popIn) * pulse);
        hx.save();
        hx.globalAlpha = .94;
        // target donut: sun ring, ink rim, paper heart — punch the heart
        hx.beginPath(); hx.arc(cx, cy, RR, 0, Math.PI * 2);
        hx.fillStyle = '#FFC53D'; hx.fill();
        hx.lineWidth = Math.max(5, RR * .13); hx.strokeStyle = '#2B2118'; hx.stroke();
        hx.beginPath(); hx.arc(cx, cy, RR * .46, 0, Math.PI * 2);
        hx.fillStyle = '#FFF8EC'; hx.fill();
        hx.lineWidth = Math.max(3, RR * .07); hx.stroke();
        hx.beginPath(); hx.arc(cx, cy, RR * .17, 0, Math.PI * 2);
        hx.fillStyle = '#FF6B57'; hx.fill();
        // per-ring fuse — coral arc drains until this pop times out
        hx.beginPath();
        hx.arc(cx, cy, RR * 1.24, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rise.each01);
        hx.lineWidth = Math.max(4, RR * .1); hx.lineCap = 'round';
        hx.strokeStyle = '#FF6B57'; hx.stroke();
        // progress: tagged pips + the count window draining, top-centre
        const pipR = Math.max(7, R * .2), pipY = Math.max(96, H * .105);
        for (let i = 0; i < rise.need; i++) {
          const gx = W / 2 + (i - (rise.need - 1) / 2) * pipR * 3.1;
          hx.beginPath(); hx.arc(gx, pipY, pipR, 0, Math.PI * 2);
          hx.fillStyle = i < rise.got ? '#4FB06D' : 'rgba(255,248,236,.3)';
          hx.fill();
          hx.lineWidth = 3; hx.strokeStyle = '#2B2118'; hx.stroke();
        }
        const bw = Math.min(340, W * .3), bx = W / 2 - bw / 2, by = pipY + pipR + 8;
        hx.beginPath(); hx.roundRect(bx, by, bw, 9, 4.5);
        hx.fillStyle = 'rgba(43,33,24,.35)'; hx.fill();
        hx.beginPath(); hx.roundRect(bx, by, bw * Math.max(0, rise.t01), 9, 4.5);
        hx.fillStyle = '#FF6B57'; hx.fill();
        hx.restore();
      }
    };

    /* face landmarks on the peephole — sparse mesh dots + the nose */
    const nc = $('[data-nose]'), nx = nc.getContext('2d');
    let ncW = 0, ncH = 0;                       // clientWidth is a layout read — cache it
    const noseDot = () => {
      const fs = face?.state;
      if (!fs?.found) { if (nc.width) { nc.width = 0; } return; }  // nothing to draw — zero layout reads
      if (!ncW) { ncW = nc.clientWidth || 0; ncH = nc.clientHeight || 0; }
      if (!ncW) return;
      if (nc.width !== ncW || nc.height !== ncH) { nc.width = ncW; nc.height = ncH; }  // resize clears — only when needed
      nx.clearRect(0, 0, ncW, ncH);
      const lm = fs.lm;
      if (lm?.length) {                          // 478-pt mesh → 1px dot cloud
        nx.fillStyle = 'rgba(210,235,255,.5)';
        for (let i = 0, n = lm.length; i < n; i += 3)
          nx.fillRect(lm[i].x * ncW - .5, lm[i].y * ncH - .5, 1, 1);
      }
      nx.beginPath(); nx.arc(fs.nose.x * ncW, fs.nose.y * ncH, 4, 0, 7);
      nx.fillStyle = '#ff6b57'; nx.fill();
    };

    /* ================= loop ================= */
    const OVSC = weakGpu ? .85 : 1;             // overlay backing scale — gloves are
    function resize() {                          // big soft blobs; 15% less blend is invisible
      ren.setSize(innerWidth, innerHeight);
      cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
      hc.width = Math.round(innerWidth * OVSC); hc.height = Math.round(innerHeight * OVSC);
      ncW = ncH = 0;   // peep canvas is CSS-sized (media query) — re-measure next frame
    }
    addEventListener('resize', resize); resize();

    const EMPTY_HS = { hands: [], pinch: null, point: null, orbit: null, zoom: null, spread: null };
    /* __forceHands is a debug/e2e hook — its values must never be able to
       throw a frame away. A non-array `hands`, a non-array `lm`, or one NaN
       landmark once crashed drawOverlay outright. Anything not drawable is
       dropped so it counts as lost tracking; a clean state
       passes through untouched (object identity matters to the tracker). */
    const saneHands = (hs) => {
      const hands = hs && typeof hs === 'object' && Array.isArray(hs.hands) ? hs.hands : null;
      if (!hands) return EMPTY_HS;
      const drawable = h => {
        const lm = h && h.lm;
        if (!Array.isArray(lm) || lm.length < 21) return false;
        for (let i = 0; i < 21; i++)
          if (!Number.isFinite(lm[i]?.x) || !Number.isFinite(lm[i]?.y)) return false;
        return true;
      };
      for (const h of hands) if (!drawable(h)) return { ...hs, hands: hands.filter(drawable) };
      return hs;
    };
    const controls = { step: 0, sign: null, waitForHands: false, dodge: 0, duck: 0 };    // persistent input
    let last = performance.now(), fpsN = 0, fpsT = last, orbitT = 0, frameI = 0;
    function loop() {
      requestAnimationFrame(loop);
      const now = performance.now(), dt = Math.min(.1, (now - last) / 1000); last = now;
      mouse.tL += dt; mouse.tR += dt;
      noseDot();
      const hs = saneHands(window.__forceHands || (mouseLive() ? mouseHands() : hands?.state || EMPTY_HS));
      const fs = window.__forceFace || (mouse.swaying ? mouseFace() : face?.state || null);
      let out = null;
      if (game) {
        controls.step = Number(moveKeys.forward) - Number(moveKeys.back);
        controls.dodge = dodgeTap || Number(moveKeys.right) - Number(moveKeys.left);   // game.js edge-triggers
        controls.duck = moveKeys.duck || duckTap ? 1 : 0;
        controls.guard = moveKeys.guard;                     // F = both gloves up
        dodgeTap = 0; duckTap = false;
        controls.sign = performance.now() < entranceInput.until ? entranceInput.sign : null;
        // hold the bell while the landmarker boots (deadline so a hopeless
        // link can't wedge the countdown forever — hands still adopt late)
        controls.waitForHands = !noTrack && videoLive
          && handStatus === 'loading' && performance.now() - trackWaitT0 < TRACK_WAIT_MS;
        controls.cornerHold = corner.on;         // halftime freezes the bout, not the page
        out = game.step(dt, hs, fs, controls);
        // distance trace while the NPC presses — __boxing.pressLog for tests
        if (out.state.phase === 'fighting' && game.fight.npcDir() === 'press') {
          const pl = window.__boxing.pressLog || (window.__boxing.pressLog = []);
          if (pl.length < 600) pl.push(out.sim.distance());
        }
        hud(out);
        cornerTick(out.state, now);
        if (audio) {
          for (const e of out.events) audio.handleEvent(e, out.state);
          audio.update(dt, out.state);
        }
      } else {
        // idle ring: slow orbit while contract modules land
        orbitT += dt; world.update(dt, {});
        cam.position.set(Math.sin(orbitT * .2) * 5, 2.2, Math.cos(orbitT * .2) * 5);
        cam.lookAt(0, .9, 0);
      }
      const ph = game?.fight.state.phase;
      // Third-person gloves are part of the avatar; clear the first-person canvas.
      if (ph === 'intro' || ph === 'win' || ph === 'lose')
        hx.clearRect(0, 0, hc.width, hc.height);
      else drawOverlay(hs, dt, out);
      if (tutor) tutor.update(out, performance.now() / 1000);
      // NPC animates every frame, but a blob-soft shadow at 30Hz reads the
      // same — the 1024² pass runs every other frame instead (20Hz on iGPU)
      if (frameI++ % (weakGpu ? 3 : 2) === 1) ren.shadowMap.needsUpdate = true;
      ren.render(scene, cam);
      if (++fpsN === 60) { const f = Math.round(60000 / (now - fpsT)); fpsN = 0; fpsT = now;
        if (!noTrack && videoLive) {
          const count = hands?.state?.hands?.length ?? 0;
          const tr = hands?.stats;
          status.textContent = handStatus === 'ready'
            ? `hands ${count}/2 · cam ${Math.round(tr?.cameraHz || 0)}/s · track ${Math.round(tr?.trackHz || 0)}/s · ${Math.round(tr?.roundTripMs || 0)}ms · render ${f} fps`
            : `hands ${handStatus} · ${f} fps`;
        }
      }
    }
    loop();
  </script>
</body>
