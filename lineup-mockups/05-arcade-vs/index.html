<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>lineup mock 05 — arcade vs</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#14101e; }
  iframe { width:100vw; height:100vh; border:0; display:block; }
</style>
</head>
<body>
<iframe id="f" src="../../lineup.html" title="lineup mock — arcade vs"></iframe>
<script>
/* MOCK 05 · ARCADE VS — the character-select screen of a cabinet fighter:
   scanlines, a neon horizon glow, light bars and a scatter of pixels */
document.getElementById('f').addEventListener('load', (e) => {
  const s = e.target.contentDocument.createElement('style');
  s.textContent = `
    html { background:#100c1a; }
    body { color:#FFF8EC; background:#161126;
      background-image:
        repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 2px, transparent 2px 4px),
        linear-gradient(105deg, rgba(255,107,87,.5) 0 2.5%, transparent 3%),
        linear-gradient(-105deg, rgba(93,169,233,.5) 0 2.5%, transparent 3%),
        radial-gradient(115% 55% at 50% 104%, rgba(255,107,87,.42), rgba(181,101,216,.32) 46%, transparent 78%),
        linear-gradient(#161126 58%, #1d1430); }
    body::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:
        radial-gradient(2px 2px at 11% 16%, #fff, transparent),
        radial-gradient(2px 2px at 79% 11%, #fff, transparent),
        radial-gradient(1.6px 1.6px at 38% 7%, rgba(255,248,236,.8), transparent),
        radial-gradient(1.8px 1.8px at 62% 21%, rgba(255,248,236,.7), transparent),
        radial-gradient(1.5px 1.5px at 89% 29%, rgba(255,197,61,.9), transparent),
        radial-gradient(1.4px 1.4px at 24% 33%, rgba(255,197,61,.8), transparent),
        radial-gradient(1.6px 1.6px at 52% 14%, rgba(93,169,233,.9), transparent),
        radial-gradient(1.4px 1.4px at 68% 36%, rgba(255,107,87,.8), transparent); }
    body::after { content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
      background:radial-gradient(120% 95% at 50% 42%, transparent 55%, rgba(6,4,12,.6)); }
    body > * { position:relative; z-index:1; }
    .wm, .back { color:#FFF8EC; }
    .cell, .pill, .enterbar { color:#2B2118; }
    .wm { text-shadow:0 0 18px rgba(255,107,87,.45); }
    .wm span, .note { color:rgba(255,248,236,.65); }
    .back { border-color:rgba(255,248,236,.4); }
    .cell { box-shadow:0 5px 0 rgba(0,0,0,.55), 0 0 30px rgba(181,101,216,.10); }
    .enterbar { box-shadow:0 6px 0 rgba(0,0,0,.5), 0 14px 34px rgba(0,0,0,.45); }
  `;
  e.target.contentDocument.head.appendChild(s);
});
</script>
</body>
</html>
