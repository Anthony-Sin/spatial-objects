<style>
  :root { --paper:#FFF8EC; --paper2:#FDF3E3; --ink:#2B2118; --coral:#FF6B57;
    --sun:#FFC53D; --leaf:#4FB06D; --sky:#5DA9E9; --berry:#B565D8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; background: var(--paper2); }
  body { font-family: "Fredoka","Baloo 2","Avenir Next","Trebuchet MS",system-ui,sans-serif;
    color: var(--ink); padding: 20px 34px 132px; text-align: center;
    min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }

  .mast { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    justify-content: center; }
  .wm { font-weight: 700; font-size: 26px; letter-spacing: .08em; color: var(--ink); }
  .wm span { display: block; font-weight: 500; font-size: 10px; letter-spacing: .3em;
    text-transform: uppercase; color: rgba(43,33,24,.55); margin-top: 3px; }
  .back { font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink); text-decoration: none; border-bottom: 2px solid rgba(43,33,24,.35);
    padding-bottom: 2px; }
  .back + .back { margin-left: 14px; }
  .back:hover { color: var(--coral); border-color: var(--coral); }
  .note { margin-top: 8px; font-size: 12px; color: rgba(43,33,24,.6); letter-spacing: .06em;
    text-align: center; }

  /* career record strip — best points, KOs, average KO round */
  .pills { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 15px;
    background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px;
    box-shadow: 0 3.5px 0 rgba(43,33,24,.35); font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; }
  .pill b { color: var(--coral); font-size: 14px; }
  .pill .ko-ic { width: 13px; height: 13px; border-radius: 50%; background: var(--sun);
    border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--paper); }

  /* the grid OWNS the leftover height — cards stretch to fill the page
     instead of floating in a sea of paper */
  .grid { flex: 1; display: grid; width: 100%;
    grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr));
    justify-content: center; align-content: center; align-items: stretch;
    gap: 28px; margin: 16px auto 0; max-width: 1400px; }
  .cell { position: relative; background: var(--paper); border: 2.5px solid var(--ink);
    border-radius: 22px; overflow: hidden; cursor: pointer; text-align: left;
    display: flex; flex-direction: column;
    box-shadow: 0 5px 0 rgba(43,33,24,.35); transition: transform .18s cubic-bezier(.34,1.56,.64,1); }
  .cell:nth-child(3n+1) { transform: rotate(-1.2deg); }
  .cell:nth-child(3n+2) { transform: rotate(.8deg); }
  .cell:hover { transform: translateY(-4px) rotate(0deg); }
  .cell canvas { width: 100%; display: block; aspect-ratio: 6 / 5; }
  .cell .nm { padding: 12px 18px 2px; font-weight: 700; font-size: 19px; letter-spacing: .04em; }
  .cell .lic { padding: 0 18px 6px; font-size: 10.5px; letter-spacing: .16em;
    text-transform: uppercase; color: rgba(43,33,24,.55); }
  .cell .st { position: absolute; top: 12px; right: 12px; font-size: 10px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; padding: 4px 11px; border-radius: 999px;
    border: 2px solid var(--ink); background: var(--sun); z-index: 3; }
  .cell.sel { border-color: var(--coral); border-width: 3.5px;
    box-shadow: 0 7px 0 rgba(255,107,87,.55); }
  .cell.sel .st { background: var(--coral); color: var(--paper); }
  .cell.dead { cursor: not-allowed; opacity: .45; filter: grayscale(.7); }
  .cell.dead .st { background: rgba(43,33,24,.15); }
  .cell.proto .st { background: var(--leaf); color: var(--paper); }
  .cell.locked .st { background: var(--ink); color: var(--paper); }

  /* paper stats — atk / def / spd pips + the signature move */
  .stats { padding: 4px 18px 14px; display: flex; flex-direction: column; gap: 5px;
    margin-top: auto; }
  .srow { display: flex; align-items: center; gap: 9px; font-size: 10px; font-weight: 800;
    letter-spacing: .18em; color: rgba(43,33,24,.6); }
  .srow em { width: 30px; font-style: normal; }
  .pips { display: flex; gap: 4px; }
  .pips i { width: 16px; height: 8px; border-radius: 4px; border: 1.5px solid var(--ink);
    background: rgba(43,33,24,.08); }
  .pips i.on { background: var(--coral); }
  .spec { padding: 0 18px 16px; font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--berry); }

  /* lock overlay — covers the card until your record says you're ready */
  .lock { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: rgba(43,33,24,.55); backdrop-filter: blur(2.5px) grayscale(.3); }
  .lock svg { width: 54px; height: 54px; fill: var(--paper);
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.45)); }
  .lock .req { padding: 5px 15px; border-radius: 999px; border: 2px solid var(--ink);
    background: var(--sun); color: var(--ink); font-size: 11px; font-weight: 800;
    letter-spacing: .14em; text-transform: uppercase; }
  .lock .hint { font-size: 10px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: rgba(255,248,236,.85); }
  .cell.no { animation: nudge .38s ease-in-out; }
  @keyframes nudge { 25% { transform: translateX(-5px) rotate(-1deg); }
    75% { transform: translateX(5px) rotate(1deg); } }

  .enterbar { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px; background: var(--paper);
    border: 3px solid var(--ink); border-radius: 20px; padding: 12px 18px;
    box-shadow: 0 6px 0 rgba(43,33,24,.4), 0 14px 34px rgba(0,0,0,.18); z-index: 10; }
  .enterbar .pick { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .enterbar .pick b { color: var(--coral); }
  .enterbar a { display: inline-block; background: var(--leaf); color: var(--paper);
    text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: .1em;
    text-transform: uppercase; padding: 10px 20px; border-radius: 14px;
    border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
    transition: transform .15s; }
  .enterbar a:hover { background: var(--coral); transform: translateY(-2px); }
  .enterbar a:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .enterbar a.dim { background: rgba(43,33,24,.25); pointer-events: none; }

  @media (max-width: 560px) {
    body { padding: 16px 16px 120px; }
    .grid { gap: 16px; }
  }
</style>
<style>
  /* lineup-mock env — 07-big-top */
  .env { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .env > div { position:absolute; inset:0; }
  body > *:not(.env) { position:relative; z-index:1; }

    html { background:#221831; }
    body { color:#fdf0d0; background:#3a2c44; }
    /* tent canvas — converging stripes read as the big-top roof */
    .env .far { background:
      repeating-conic-gradient(from 0deg at 50% -38%,
        rgba(178,59,50,.30) 0deg 7deg, rgba(242,216,168,.20) 7deg 14deg),
      linear-gradient(#453050, #2e2140); }
    .env .far::before { content:""; position:absolute; inset:0;
      background:radial-gradient(85% 70% at 50% 30%, transparent 55%, rgba(24,16,36,.55)); }
    /* pennant bunting strung across the upper third */
    .env .mid .bunting { position:absolute; left:2%; right:2%; top:9%; height:40px;
      display:flex; justify-content:space-between; align-items:flex-start;
      border-top:2px solid rgba(20,12,28,.55); }
    .env .mid .bunting i { width:34px; height:var(--h); background:var(--c);
      clip-path:polygon(0 0, 100% 0, 50% 100%); margin-top:2px;
      transform-origin:top; animation:penn 4.4s ease-in-out infinite; }
    .env .mid .bunting i:nth-child(3n) { animation-delay:-1.4s; }
    .env .mid .bunting i:nth-child(3n+2) { animation-delay:-2.6s; }
    /* festoon bulbs — warm orbs on a sagging string */
    .env .mid .fb { position:absolute; width:13px; height:13px; border-radius:50%;
      background:radial-gradient(circle at 36% 30%, #fff2c8, #e8b74a 60%, #a06a20);
      box-shadow:0 0 18px 5px rgba(232,183,74,.35); animation:twinkle 3.4s ease-in-out infinite;
      animation-delay:var(--d); }
    /* striped booth corner-posts */
    .env .mid .post { position:absolute; top:0; bottom:0; width:26px;
      background:repeating-linear-gradient(0deg, #8a2f28 0 34px, #e8d8b0 34px 68px);
      box-shadow:0 0 24px rgba(0,0,0,.4); opacity:.85; }
    .env .mid .pL { left:1.2%; transform:skewX(1.4deg); }
    .env .mid .pR { right:1.2%; transform:skewX(-1.4deg); }
    /* festoon glow washing down over the cards */
    .env .light { background:
      radial-gradient(60% 42% at 50% 30%, rgba(255,206,110,.22), transparent 74%),
      radial-gradient(90% 60% at 50% 100%, rgba(58,44,68,.0), rgba(24,16,36,.4)); }
    /* sawdust motes drifting sideways + dusk fireflies */
    .env .fx .dust { inset:-6%;
      background-image:radial-gradient(rgba(255,236,190,.5) 1px, transparent 1.4px),
                       radial-gradient(rgba(255,236,190,.35) 1.2px, transparent 1.6px);
      background-size:150px 150px, 230px 230px; background-position:0 0, 70px 50px;
      animation:dustDrift 30s linear infinite; }
    .env .fx .dusk { inset:0; background-image:
      radial-gradient(rgba(255,210,120,.9) 1.4px, transparent 1.8px),
      radial-gradient(rgba(255,210,120,.7) 1.2px, transparent 1.6px),
      radial-gradient(rgba(255,210,120,.8) 1.6px, transparent 2px);
      background-size:0 0; }
    .env .fx .dusk { background-image:none; }
    .env .fx .dusk::before { content:""; position:absolute; inset:0;
      background-image:
        radial-gradient(rgba(255,214,130,.95) 1.6px, transparent 2px),
        radial-gradient(rgba(255,214,130,.8) 1.4px, transparent 1.8px),
        radial-gradient(rgba(255,214,130,.9) 1.8px, transparent 2.2px);
      background-size:410px 340px, 520px 430px, 640px 520px;
      background-position:40px 60px, 200px 120px, 320px 40px;
      animation:firefly 7s ease-in-out infinite; }
    /* sawdust ring floor + tent-edge vignette */
    .env .near { background:
      linear-gradient(transparent 78%, #5a4a30 78%),
      radial-gradient(115% 95% at 50% 38%, transparent 58%, rgba(20,12,30,.66)); }
    .env .near::after { content:""; position:absolute; left:0; right:0; bottom:0; height:22%;
      background:repeating-linear-gradient(90deg, rgba(40,28,16,.25) 0 2px, transparent 2px 60px); }
    @keyframes penn { 0%,100% { transform:skewX(-4deg); } 50% { transform:skewX(4deg); } }
    @keyframes twinkle { 0%,100% { opacity:.75; } 50% { opacity:1; } }
    @keyframes dustDrift { to { background-position:150px -30px, 300px -60px; } }
    @keyframes firefly { 0%,100% { opacity:.55; } 50% { opacity:.95; } }
    .wm span, .note { color:rgba(253,240,208,.62); }
    .wm, .back { color:#fdf0d0; }
    .back { border-color:rgba(253,240,208,.4); }
    .cell, .pill, .enterbar { color:#2B2118; }
    .cell { box-shadow:0 6px 0 rgba(0,0,0,.5), 0 0 26px rgba(232,183,74,.09); }
  </style>

<body>
    <div class="env" aria-hidden="true">
      <div class="far"></div>
      <div class="mid">
        <div class="bunting">
          <i style="--h:14px;--c:#b23b32"></i><i style="--h:20px;--c:#f2d8a8"></i>
          <i style="--h:26px;--c:#4a6e8a"></i><i style="--h:20px;--c:#b23b32"></i>
          <i style="--h:14px;--c:#f2d8a8"></i><i style="--h:20px;--c:#4a6e8a"></i>
          <i style="--h:26px;--c:#b23b32"></i><i style="--h:20px;--c:#f2d8a8"></i>
          <i style="--h:14px;--c:#4a6e8a"></i><i style="--h:20px;--c:#b23b32"></i>
          <i style="--h:26px;--c:#f2d8a8"></i><i style="--h:20px;--c:#4a6e8a"></i>
        </div>
        <i class="fb" style="left:8%;top:16%;--d:0s"></i><i class="fb" style="left:20%;top:19%;--d:-.7s"></i>
        <i class="fb" style="left:32%;top:21%;--d:-1.4s"></i><i class="fb" style="left:44%;top:22%;--d:-2.1s"></i>
        <i class="fb" style="left:56%;top:22%;--d:-.4s"></i><i class="fb" style="left:68%;top:21%;--d:-1.1s"></i>
        <i class="fb" style="left:80%;top:19%;--d:-1.8s"></i><i class="fb" style="left:92%;top:16%;--d:-2.5s"></i>
        <div class="post pL"></div><div class="post pR"></div>
      </div>
      <div class="light"></div>
      <div class="fx"><i class="dust"></i><i class="dusk"></i></div>
      <div class="near"></div>
    </div>
  <header class="mast">
    <div class="wm">PICK YOUR RIVAL<span>scrap! · character lineup</span></div>
    <a class="back" href="./">menu</a>
  </header>
  <div class="pills">
    <span class="pill">BEST <b data-best>0</b> PTS</span>
    <span class="pill"><b data-wins>0</b> WINS</span>
    <span class="pill"><i class="ko-ic"></i><b data-kos>0</b> KOs</span>
    <span class="pill">AVG KO <b data-koavg>—</b></span>
  </div>
  <div class="note" data-note>loading the lineup…</div>
  <div class="grid" data-grid></div>

  <div class="enterbar">
    <div class="pick">your rival: <b data-pick>—</b></div>
    <a data-enter class="dim" href="./boxing.html">enter the ring →</a>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const $ = (s) => document.querySelector(s);
    const grid = $('[data-grid]'), note = $('[data-note]');
    const SLOT_W = 380, SLOT_H = 317, GAP = 3;

    /* ---------- career record — the lock gate ----------
       Every KO win writes {n, sum} into boxing:ko; a fighter unlocks when
       your average KO round is early enough (proto VARIANT_INFO .koAvg). */
    const ls = {
      get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }
        catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };
    const ko = ls.get('boxing:ko', { n: 0, sum: 0 });
    const koAvg = ko.n > 0 ? ko.sum / ko.n : 0;
    const best = ls.get('boxing:best', 0), wins = ls.get('boxing:wins', 0);
    $('[data-best]').textContent = best.toLocaleString();
    $('[data-wins]').textContent = wins;
    $('[data-kos]').textContent = ko.n;
    $('[data-koavg]').textContent = ko.n ? koAvg.toFixed(1) : '—';

    const practice = new URLSearchParams(location.search).get('practice') ? '?practice=1' : '';

    /* ---------- roster: manifest candidates + protoBoxer VARIANTS ---------- */
    const manifest = await fetch('./shared/boxing/assetManifest.json')
      .then(r => r.ok ? r.json() : { candidates: [] })
      .catch(() => ({ candidates: [] }));
    const proto = await import('./shared/boxing/protoBoxer.js').catch(() => null);
    const VARIANTS = proto?.VARIANTS || [];
    const VINFO = proto?.VARIANT_INFO || {};
    // locked = has a KO-round gate you haven't cleared yet
    const isLocked = (e) => {
      const need = e.info?.koAvg;
      return need != null && !(ko.n > 0 && koAvg <= need);
    };
    const pips = (v) => '<span class="pips">' + Array.from({ length: 5 },
      (_, i) => `<i${i < v ? ' class="on"' : ''}></i>`).join('') + '</span>';
    const statsHtml = (info) => !info?.stats ? '' :
      `<div class="stats">${['atk', 'def', 'spd'].map(k =>
        `<div class="srow"><em>${k.toUpperCase()}</em>${pips(info.stats[k])}</div>`).join('')}</div>`;
    const specHtml = (info) => !info?.special ? '' :
      `<div class="spec">★ ${info.special.name} — ${info.special.desc}</div>`;
    const LOCK_SVG = `<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9zm3 4a1.8 1.8 0 0 1 .9 3.35V19a.9.9 0 1 1-1.8 0v-1.65A1.8 1.8 0 0 1 12 14z"/></svg>`;

    // manifest "PROP" entries (ring/gloves/bag) are set dressing, not fighters
    const fighters = (manifest.candidates || [])
      .filter(c => !/^PROP/i.test(c.notes || '') && (c.type || 'glb') === 'glb');
    // full roster: house-made proto variants FIRST (they're the favorites),
    // then the downloaded GLB contenders
    const protos = VARIANTS.map(v => ({ id: `proto:${v}`, name: VINFO[v]?.label || v,
      type: 'proto', lic: VINFO[v]?.desc || 'original fighter', variant: v, info: VINFO[v] }));
    const entries = [...protos,
      ...fighters.map(c => ({ id: c.id, name: c.name || c.id,
        type: c.type || 'glb', lic: c.license || 'unknown', cand: c }))];
    if (!entries.length)
      note.textContent = 'no rivals found yet — check assetManifest.json + protoBoxer.js';
    else note.textContent = `${entries.length} contenders in the lineup · choose your rival`;

    /* ---------- DOM cells ---------- */
    const cells = entries.map((e, i) => {
      const locked = isLocked(e);
      const d = document.createElement('div');
      d.className = 'cell' + (e.type === 'proto' ? ' proto' : '') + (locked ? ' locked' : '');
      d.innerHTML = `<canvas width="${SLOT_W}" height="${SLOT_H}"></canvas>
        <div class="st">${locked ? 'locked' : e.type === 'proto' ? 'original' : 'glb'}</div>
        <div class="nm">${e.name}</div><div class="lic">${e.lic}</div>
        ${statsHtml(e.info)}${specHtml(e.info)}
        ${locked ? `<div class="lock">${LOCK_SVG}
          <div class="req">${e.info.unlock || `avg KO ≤ R${e.info.koAvg}`}</div>
          <div class="hint">${ko.n ? `your avg KO: ${koAvg.toFixed(1)}` : 'no KOs yet — go fight'}</div>
        </div>` : ''}`;
      grid.append(d);
      const rec = { e, i, el: d, locked, ctx: d.querySelector('canvas').getContext('2d'),
        obj: null, impl: null, ok: false };
      d.onclick = () => rec.locked
        ? (rec.el.classList.add('no'),
           setTimeout(() => rec.el.classList.remove('no'), 420),
           note.textContent = `${e.name} is locked — ${e.info.unlock || `drop your avg KO to round ${e.info.koAvg}`} first`)
        : select(rec);
      return rec;
    });

    /* ---------- one shared render pass for every thumbnail ----------
       Each fighter lives at x = i*GAP*… in one scene; we render each slot
       column of an offscreen WebGL canvas, then drawImage into the cells. */
    const glc = document.createElement('canvas');
    // WebGL can fail outright (blocked GPU, no swiftshader) — the lineup must
    // still let you pick a rival by name + stats, so the renderer is optional.
    // probe first: THREE's ctor logs an error when the context request fails
    let ren = null;
    const glOk = !!(document.createElement('canvas').getContext('webgl2')
      || document.createElement('canvas').getContext('webgl'));
    if (!glOk) {
      note.textContent = 'no 3D on this machine — pick a rival by name + stats below';
    } else try {
      ren = new THREE.WebGLRenderer({ canvas: glc, antialias: true,
        preserveDrawingBuffer: true, alpha: true, powerPreference: 'low-power' });
    } catch (e) {
      console.warn('lineup: WebGL unavailable — thumbnails skipped', e);
      note.textContent = 'no 3D on this machine — pick a rival by name + stats below';
    }
    // wrap the strip into rows — one N-wide line can blow past the 16k canvas
    // cap on big rosters; grid keeps the backing store small either way
    const COLS = Math.min(Math.max(1, cells.length), Math.floor(8192 / SLOT_W));
    const ROWS = Math.ceil(cells.length / COLS);
    if (ren) {
      ren.setSize(SLOT_W * COLS, SLOT_H * ROWS, false);
      ren.setPixelRatio(1);
    }
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfdf3e3);
    const hemi = new THREE.HemisphereLight(0xfff2dd, 0x8a7f6c, 1.15);
    const key = new THREE.DirectionalLight(0xffe6bd, 1.6); key.position.set(3, 6, 4);
    scene.add(hemi, key);
    // each slot gets its own layer — a cell's camera can never see the
    // neighbor's disc/pedestal/fighter bleeding in at the frame edge.
    // Lights shine on every layer so the isolated fighters stay lit.
    hemi.layers.enableAll(); key.layers.enableAll();
    const cam = new THREE.PerspectiveCamera(40, SLOT_W / SLOT_H, .1, 60);
    const ACC = [0xff6b57, 0xffc53d, 0x4fb06d, 0x5da9e9, 0xb565d8];
    for (const c of cells) {
      const x = c.i * 3;
      c.lay = (c.i % 31) + 1;                 // layer 0 stays clear for lights
      // paper pedestal + accent disc backdrop per slot
      const disc = new THREE.Mesh(new THREE.CircleGeometry(.95, 40),
        new THREE.MeshBasicMaterial({ color: ACC[c.i % ACC.length] }));
      disc.position.set(x, .78, -.8); disc.layers.set(c.lay); scene.add(disc);
      const ped = new THREE.Mesh(new THREE.CylinderGeometry(.8, .9, .12, 28),
        new THREE.MeshStandardMaterial({ color: 0xfff8ec, roughness: .9 }));
      ped.position.set(x, -.06, 0); ped.layers.set(c.lay); scene.add(ped);
      const trim = new THREE.Mesh(new THREE.TorusGeometry(.85, .035, 10, 40).rotateX(Math.PI / 2),
        new THREE.MeshStandardMaterial({ color: 0x2b2118, roughness: .9 }));
      trim.position.set(x, .01, 0); trim.layers.set(c.lay); scene.add(trim);
    }

    const die = (c, why) => {
      c.el.classList.add('dead'); c.el.querySelector('.st').textContent = why;
    };
    const loadGlb = (c) => new Promise((res) => {
      const cand = c.e?.cand || c.cand;
      if (!cand?.path) return res(null);
      new GLTFLoader().load('./' + String(cand.path).replace(/^\.?\//, ''),
        g => {
          const o = g.scene || g.scenes?.[0]; if (!o) return res(null);
          if (cand.scale) o.scale.setScalar(cand.scale);
          else {
            const b = new THREE.Box3().setFromObject(o);
            const h = b.max.y - b.min.y || 1; o.scale.setScalar(1.5 / h);
          }
          {   // manifest yOffset = the lift that grounds the feet; else auto-rest
            const b = new THREE.Box3().setFromObject(o);
            o.position.y += cand.yOffset ?? -b.min.y;
          }
          o.rotation.y = cand.yaw || 0;
          res({ o, clips: g.animations || [] });
        }, undefined, () => res(null));
    });

    const loaders = cells.map(async (c) => {
      const x = c.i * 3;
      if (c.e.type === 'proto') {
        try {
          c.impl = proto.buildBoxer(THREE, { variant: c.e.variant });
          c.impl.group.position.set(x, .02, 0);
          c.impl.group.traverse(o => o.layers.set(c.lay));
          c.impl.snap?.('idle', 0);            // instant idle pose for the thumb
          scene.add(c.impl.group); c.ok = true;
        } catch { die(c, 'not built'); }
      } else if (c.e.type === 'glb') {
        const got = await loadGlb(c);
        if (got) {
          c.obj = got.o;
          c.obj.position.x += x; c.obj.position.y += .02;
          c.obj.traverse(o => o.layers.set(c.lay));
          const idle = got.clips.find(k => k.name.toLowerCase().includes('idle'));
          if (idle) { c.mixer = new THREE.AnimationMixer(c.obj); c.mixer.clipAction(idle).play(); }
          scene.add(c.obj); c.ok = true;
        }
        else die(c, 'missing');
      } else die(c, c.e.type);
    });
    await Promise.allSettled(loaders);
    if (!cells.some(c => c.ok)) note.textContent = 'nobody showed up to the weigh-in…';

    /* ---------- selection ---------- */
    const pickEl = $('[data-pick]'), enterEl = $('[data-enter]');
    let picked = null;
    try { picked = localStorage.getItem('boxing:npc'); } catch {}
    function select(rec) {
      if (!rec.ok || rec.locked || rec.el.classList.contains('dead')) return;
      picked = rec.e.id;
      try { localStorage.setItem('boxing:npc', picked); } catch {}
      for (const c of cells) c.el.classList.toggle('sel', c === rec);
      pickEl.textContent = rec.e.name.toUpperCase();
      enterEl.classList.remove('dim');
      enterEl.href = './boxing.html' + practice;
      note.textContent = `${rec.e.name} wraps their hands — see you in the ring`;
    }
    const pre = cells.find(c => c.e.id === picked && c.ok && !c.locked)
      || cells.find(c => c.ok && !c.locked);
    if (pre) select(pre);

    /* ---------- thumbnail loop ---------- */
    let last = performance.now(), t = 0, acc = 0;
    const slotCam = new THREE.Vector3(), look = new THREE.Vector3();
    function loop() {
      requestAnimationFrame(loop);
      const now = performance.now(), dt = Math.min(.1, (now - last) / 1000); last = now;
      acc += dt;
      if (acc < 1 / 30) return;   // picker thumbs don't need vsync — 30fps halves GPU
      t += acc;
      for (const c of cells) {
        if (c.impl) c.impl.tick(acc, {});
        if (c.mixer) c.mixer.update(acc);
        if (c.obj && !c.mixer) {   // rigless GLBs idle-sway so cells feel alive
          c.obj.rotation.y = Math.sin(t * .8 + c.i) * .35;
          c.obj.position.y = .02 + Math.sin(t * 2.2 + c.i * 1.7) * .03;
        }
      }
      acc = 0;
      for (const c of cells) {
        const x = c.i * 3;
        const col = c.i % COLS, row = (c.i / COLS) | 0;
        slotCam.set(x + .78, 1.3, 2.55); look.set(x, .66, 0);
        cam.position.copy(slotCam); cam.lookAt(look);
        cam.layers.set(c.lay);
        ren.setViewport(col * SLOT_W, row * SLOT_H, SLOT_W, SLOT_H);
        ren.setScissor(col * SLOT_W, row * SLOT_H, SLOT_W, SLOT_H);
        ren.setScissorTest(true);
        ren.render(scene, cam);
        c.ctx.clearRect(0, 0, SLOT_W, SLOT_H);
        // GL viewport rows run bottom→top, drawImage runs top→bottom — flip
        c.ctx.drawImage(glc, col * SLOT_W, (ROWS - 1 - row) * SLOT_H, SLOT_W, SLOT_H, 0, 0, SLOT_W, SLOT_H);
      }
    }
    if (cells.length && ren) loop();
  </script>
</body>
</html>
