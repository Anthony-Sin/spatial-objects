<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lineup mock 17-main-event — scrap!</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@700;800&family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/loaders/GLTFLoader.js": "./vendor/three/GLTFLoader.js"
} }
</script>
<style>
  :root { --paper:#FFF8EC; --cream:#FFFDF6; --ink:#2B2118; --coral:#FF6B57;
    --sun:#FFC53D; --leaf:#4FB06D; --sky:#5DA9E9; --berry:#B565D8;
    --arena:#141008; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { min-height:100vh; min-height:100svh; overflow:hidden; user-select:none;
    background:var(--arena); color:var(--paper);
    font-family:"Fredoka","Baloo 2","Avenir Next",system-ui,sans-serif; }

  /* faint arena dust so the dark isn't a dead void */
  body::after { content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(rgba(255,248,236,.05) 1.2px, transparent 1.2px);
    background-size:30px 30px; }

  #webgl-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:1;
    cursor:grab; outline:none; }
  #webgl-canvas:active { cursor:grabbing; }

  /* ---------- top mast ---------- */
  .mast { position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:14px 22px; pointer-events:none;
    background:linear-gradient(180deg, rgba(20,16,8,.9), rgba(20,16,8,.35) 65%, transparent); }
  .mast > * { pointer-events:auto; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 13px;
    background:var(--paper); color:var(--ink); border:2.5px solid var(--ink);
    border-radius:999px; box-shadow:0 3px 0 rgba(0,0,0,.5);
    font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
  .pill b { color:var(--coral); font-size:13px; }
  .pill .ko-ic { width:11px; height:11px; border-radius:50%;
    background:var(--sun); border:1.5px solid var(--ink); }
  .back { position:absolute; top:14px; right:22px;
    font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink); text-decoration:none; background:var(--paper);
    border:2.5px solid var(--ink); padding:6px 14px; border-radius:10px;
    box-shadow:0 3px 0 rgba(0,0,0,.5); transition:all .15s; }
  .back:hover { background:var(--coral); color:var(--paper); transform:translateY(-2px); }

  /* ---------- hero type — the words ABOVE the model ---------- */
  .hero { position:fixed; top:11%; left:0; right:0; z-index:6; text-align:center;
    pointer-events:none; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.42em;
    text-transform:uppercase; color:var(--sun);
    text-shadow:0 2px 10px rgba(0,0,0,.8); }
  .hero-name { font-family:"Baloo 2",sans-serif; font-weight:800;
    font-size:clamp(54px, 9vw, 108px); line-height:.9; letter-spacing:.02em;
    color:var(--paper); transform:rotate(-1.6deg); margin-top:6px;
    text-shadow:
      -3px -3px 0 var(--ink), 3px -3px 0 var(--ink),
      -3px 3px 0 var(--ink), 3px 3px 0 var(--ink),
      0 5px 0 var(--ink), 0 9px 0 rgba(255,197,61,.85),
      0 14px 28px rgba(0,0,0,.65); }
  .hero-desc { font-family:"Caveat",cursive; font-size:clamp(20px,2.6vw,28px);
    color:rgba(255,248,236,.88); margin-top:14px;
    text-shadow:0 2px 8px rgba(0,0,0,.8); }
  .hbadge { display:inline-block; vertical-align:middle; margin-left:14px;
    font-family:"Fredoka",sans-serif; font-size:11px; font-weight:700;
    letter-spacing:.16em; padding:4px 13px; border-radius:999px;
    border:2.5px solid var(--ink); transform:rotate(2deg); text-shadow:none; }
  .hbadge.open { background:var(--leaf); color:var(--paper);
    box-shadow:0 3px 0 var(--ink); }
  .hbadge.locked { background:var(--coral); color:var(--paper);
    box-shadow:0 3px 0 var(--ink); }
  .pop { animation:pop .28s cubic-bezier(.34,1.4,.64,1); }
  @keyframes pop { 0% { transform:scale(.96) rotate(-2.4deg); opacity:.7; }
    100% { transform:scale(1) rotate(-1.6deg); opacity:1; } }
  .dockpop.pop { animation:dockpop .28s cubic-bezier(.34,1.4,.64,1); }
  @keyframes dockpop { 0% { transform:translateX(-50%) scale(.98); opacity:.85; }
    100% { transform:translateX(-50%) scale(1); opacity:1; } }

  .note { position:absolute; bottom:calc(100% + 10px); left:0; right:0;
    text-align:center; font-family:"Patrick Hand",cursive; font-size:15px;
    color:rgba(255,248,236,.65); pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.9); }

  /* ---------- bottom dock: chips + paper card ---------- */
  .dock { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    width:min(600px, calc(100vw - 24px)); z-index:10; }
  .chips { display:flex; gap:8px; margin-bottom:10px; }
  .chip { flex:1; padding:7px 10px; cursor:pointer;
    background:var(--paper); color:var(--ink);
    border:2.5px solid var(--ink); border-radius:11px;
    font-family:"Fredoka",sans-serif; font-size:10.5px; font-weight:700;
    letter-spacing:.13em; text-transform:uppercase;
    box-shadow:0 3px 0 rgba(0,0,0,.5);
    transition:all .18s cubic-bezier(.34,1.56,.64,1);
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .chip:nth-child(odd) { transform:rotate(-.8deg); }
  .chip:nth-child(even) { transform:rotate(.7deg); }
  .chip:hover { transform:translateY(-2px) rotate(0); background:var(--sun); }
  .chip.sel { background:var(--coral); color:var(--paper);
    transform:translateY(-3px) rotate(0); box-shadow:0 5px 0 var(--ink); }
  .chip.locked { opacity:.7; }
  .chip .lic { font-size:9px; }
  .chip.no { animation:shake .38s ease-in-out; }
  @keyframes shake { 20% { transform:translateX(-5px) rotate(-1deg); }
    40% { transform:translateX(5px) rotate(1deg); }
    60% { transform:translateX(-3px); } 80% { transform:translateX(3px); } }

  .card { background:var(--cream); color:var(--ink);
    border:3px solid var(--ink); border-radius:18px;
    box-shadow:0 6px 0 rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.5);
    padding:13px 18px 15px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin-bottom:10px; }
  .stat { display:flex; flex-direction:column; gap:4px; }
  .stat .lbl { font-size:9.5px; font-weight:800; letter-spacing:.2em;
    color:rgba(43,33,24,.6); }
  .stat .lbl b { color:var(--ink); }
  .pips { display:flex; gap:4px; }
  .pips i { flex:1; height:7px; border-radius:4px;
    background:rgba(43,33,24,.1); border:1.5px solid var(--ink); }
  .pips i.on { background:var(--coral); }
  .spec { display:flex; align-items:center; gap:7px; font-size:11px;
    font-weight:700; letter-spacing:.06em; color:var(--ink);
    background:rgba(181,101,216,.14); border:2px dashed var(--berry);
    border-radius:10px; padding:5px 12px; margin-bottom:12px; }
  .spec .star { color:var(--berry); }
  .spec .sd { color:rgba(43,33,24,.6); font-weight:500; }
  .act { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .pick { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(43,33,24,.6); }
  .pick b { color:var(--coral); font-size:13px; }
  .enter { flex:1; display:inline-flex; align-items:center; justify-content:center;
    font-family:"Baloo 2",sans-serif; font-size:14px; font-weight:800;
    letter-spacing:.12em; text-transform:uppercase; text-decoration:none;
    padding:10px 16px; border-radius:13px; cursor:pointer;
    background:var(--leaf); color:var(--paper); border:2.5px solid var(--ink);
    box-shadow:0 4px 0 var(--ink); transition:all .15s cubic-bezier(.34,1.56,.64,1); }
  .enter:hover { background:var(--coral); transform:translateY(-2px);
    box-shadow:0 6px 0 var(--ink); }
  .enter:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .enter.locked { background:rgba(43,33,24,.2); color:rgba(43,33,24,.5);
    box-shadow:none; cursor:not-allowed; }

  @media (max-width:640px) {
    .mast { padding:10px 14px; }
    .pills { display:none; }
    .hero { top:9%; }
    .hero-name { font-size:clamp(44px,13vw,68px); }
    .dock { bottom:10px; }
  }
</style>
</head>
<body>
<canvas id="webgl-canvas"></canvas>

<header class="mast">
  <div class="pills">
    <span class="pill">BEST <b data-best>0</b> PTS</span>
    <span class="pill"><b data-wins>0</b> WINS</span>
    <span class="pill"><i class="ko-ic"></i><b data-kos>0</b> KOs</span>
    <span class="pill">AVG KO <b data-koavg>—</b></span>
  </div>
  <a class="back" href="./">← MENU</a>
</header>

<div class="hero" data-pop>
  <div class="eyebrow">tonight's exhibition bout</div>
  <h1 class="hero-name"><span data-hero-name>BUBBLE</span><span class="hbadge open" data-hero-badge data-cls-open="hbadge open" data-cls-locked="hbadge locked">READY TO SCRAP</span></h1>
  <div class="hero-desc" data-hero-desc>sprout crown · springy stance</div>
</div>
<div class="dock dockpop" data-pop>
  <div class="note" data-note>the contenders await your challenge</div>
  <div class="chips">
    <button class="chip sel" data-sel="0">№ 1 · <span data-sel-name>BUBBLE</span>
      <span class="lic" data-lockic style="display:none"><svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M3.6 5V3.7a2.4 2.4 0 0 1 4.8 0V5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></button>
    <button class="chip" data-sel="1">№ 2 · <span data-sel-name>BLOCKY</span>
      <span class="lic" data-lockic style="display:none"><svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M3.6 5V3.7a2.4 2.4 0 0 1 4.8 0V5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></button>
    <button class="chip" data-sel="2">№ 3 · <span data-sel-name>BEAN</span>
      <span class="lic" data-lockic style="display:none"><svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M3.6 5V3.7a2.4 2.4 0 0 1 4.8 0V5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></button>
  </div>
  <div class="card">
    <div class="stats">
      <div class="stat"><div class="lbl">ATK <b data-stat-atk>3</b>/5</div><div class="pips" data-pip-atk></div></div>
      <div class="stat"><div class="lbl">DEF <b data-stat-def>3</b>/5</div><div class="pips" data-pip-def></div></div>
      <div class="stat"><div class="lbl">SPD <b data-stat-spd>4</b>/5</div><div class="pips" data-pip-spd></div></div>
    </div>
    <div class="spec"><span class="star">★</span><span data-spec-name>TRIPLE TAP</span><span class="sd" data-spec-desc>— 3 hits, one stamina</span></div>
    <div class="act">
      <div class="pick">your rival: <b data-pick>BUBBLE</b></div>
      <a class="enter" data-enter href="./boxing.html">ENTER THE RING →</a>
    </div>
  </div>
</div>

<script type="module">
  import { boot } from './lineup-mockups/_hero/engine.mjs';
  boot({
    bg: 0x141008, fogNear: 9, fogFar: 30,
    hemiSky: 0x9a8a70, hemiGround: 0x14100a, hemiInt: 0.5,
    floor: 0x231c12, floorRough: 0.8,
    plinth: 0xf6ecd6, rim: 0xffc53d, rimMetal: 0.55, rimRough: 0.4,
    spotColor: 0xffd9a0, spotHot: 44, spotDim: 1.4,
    glowHot: 0.4, glowDim: 0.02,
    camRad: 5.9, camPhi: 1.16, camTgtY: 1.0,
    fixedCam: true,
  });
</script>
</body>
</html>
