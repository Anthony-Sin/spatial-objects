<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>lineup mock 04 — corkboard</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#d9b88a; }
  iframe { width:100vw; height:100vh; border:0; display:block; }
</style>
</head>
<body>
<iframe id="f" src="../../lineup.html" title="lineup mock — corkboard"></iframe>
<script>
/* MOCK 04 · CORKBOARD — the rivals pinned to the gym notice board: kraft
   cork speckle, a faded rubber-stamp ring and a strip of washi tape */
document.getElementById('f').addEventListener('load', (e) => {
  const s = e.target.contentDocument.createElement('style');
  s.textContent = `
    html { background:#d0ac7c; }
    body { color:#332619; background:#d9b88a;
      background-image:
        radial-gradient(rgba(43,33,24,.11) 1.3px, transparent 1.4px),
        radial-gradient(rgba(255,248,236,.30) 1.3px, transparent 1.4px),
        radial-gradient(rgba(43,33,24,.05) 2.8px, transparent 3px);
      background-size:25px 25px, 25px 25px, 72px 72px;
      background-position:0 0, 9px 11px, 22px 31px; }
    body::before { content:""; position:fixed; right:3.5%; top:13%; width:190px; height:190px;
      z-index:0; pointer-events:none; transform:rotate(-13deg); border-radius:50%;
      border:5px double rgba(181,101,60,.45); }
    body::after { content:""; position:fixed; left:4%; top:15.5%; width:132px; height:36px;
      z-index:0; pointer-events:none; transform:rotate(-8deg);
      background:rgba(255,248,236,.42); border-left:2px dashed rgba(43,33,24,.25);
      border-right:2px dashed rgba(43,33,24,.25);
      box-shadow:0 2px 4px rgba(43,33,24,.18); }
    body > * { position:relative; z-index:1; }
    .cell { box-shadow:0 5px 0 rgba(43,33,24,.45), 0 10px 22px rgba(43,33,24,.16); }
    .wm span, .note { color:rgba(51,38,25,.62); }
    .back { color:#332619; border-color:rgba(51,38,25,.4); }
  `;
  e.target.contentDocument.head.appendChild(s);
});
</script>
</body>
</html>
