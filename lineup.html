<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick Your Rival — SCRAP!</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@700;800&family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/loaders/GLTFLoader.js": "./vendor/three/GLTFLoader.js"
} }
</script>
<style>
  :root { --paper:#FFF8EC; --cream:#FFFDF6; --ink:#2B2118; --coral:#FF6B57;
    --sun:#FFC53D; --leaf:#4FB06D; --sky:#5DA9E9; --berry:#B565D8;
    --arena:#141008; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { min-height:100vh; min-height:100svh; overflow:hidden; user-select:none;
    background:var(--arena); color:var(--paper);
    font-family:"Fredoka","Baloo 2","Avenir Next",system-ui,sans-serif; }

  /* faint arena dust so the dark isn't a dead void */
  body::after { content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(rgba(255,248,236,.05) 1.2px, transparent 1.2px);
    background-size:30px 30px; }

  #webgl-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:1;
    outline:none; }

  /* ---------- top mast ---------- */
  .mast { position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:14px 22px; pointer-events:none;
    background:linear-gradient(180deg, rgba(20,16,8,.9), rgba(20,16,8,.35) 65%, transparent); }
  .mast > * { pointer-events:auto; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 13px;
    background:var(--paper); color:var(--ink); border:2.5px solid var(--ink);
    border-radius:999px; box-shadow:0 3px 0 rgba(0,0,0,.5);
    font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
  .pill b { color:var(--coral); font-size:13px; }
  .pill .ko-ic { width:11px; height:11px; border-radius:50%;
    background:var(--sun); border:1.5px solid var(--ink); }
  .back { position:absolute; top:14px; right:22px;
    font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink); text-decoration:none; background:var(--paper);
    border:2.5px solid var(--ink); padding:6px 14px; border-radius:10px;
    box-shadow:0 3px 0 rgba(0,0,0,.5); transition:all .15s; }
  .back:hover { background:var(--coral); color:var(--paper); transform:translateY(-2px); }

  /* ---------- hero type — the words ABOVE the model ---------- */
  .hero { position:fixed; top:11%; left:0; right:0; z-index:6; text-align:center;
    pointer-events:none; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.42em;
    text-transform:uppercase; color:var(--sun);
    text-shadow:0 2px 10px rgba(0,0,0,.8); }
  .hero-name { font-family:"Baloo 2",sans-serif; font-weight:800;
    font-size:clamp(54px, 9vw, 108px); line-height:.9; letter-spacing:.02em;
    color:var(--paper); transform:rotate(-1.6deg); margin-top:6px;
    text-shadow:
      -3px -3px 0 var(--ink), 3px -3px 0 var(--ink),
      -3px 3px 0 var(--ink), 3px 3px 0 var(--ink),
      0 5px 0 var(--ink), 0 9px 0 rgba(255,197,61,.85),
      0 14px 28px rgba(0,0,0,.65); }
  .hero-desc { font-family:"Caveat",cursive; font-size:clamp(20px,2.6vw,28px);
    color:rgba(255,248,236,.88); margin-top:14px;
    text-shadow:0 2px 8px rgba(0,0,0,.8); }
  .hbadge { display:inline-block; vertical-align:middle; margin-left:14px;
    font-family:"Fredoka",sans-serif; font-size:11px; font-weight:700;
    letter-spacing:.16em; padding:4px 13px; border-radius:999px;
    border:2.5px solid var(--ink); transform:rotate(2deg); text-shadow:none; }
  .hbadge.open { background:var(--leaf); color:var(--paper);
    box-shadow:0 3px 0 var(--ink); }
  .hbadge.locked { background:var(--coral); color:var(--paper);
    box-shadow:0 3px 0 var(--ink); }
  .pop { animation:pop .28s cubic-bezier(.34,1.4,.64,1); }
  @keyframes pop { 0% { transform:scale(.96) rotate(-2.4deg); opacity:.7; }
    100% { transform:scale(1) rotate(-1.6deg); opacity:1; } }
  .dockpop.pop { animation:dockpop .28s cubic-bezier(.34,1.4,.64,1); }
  @keyframes dockpop { 0% { transform:translateX(-50%) scale(.98); opacity:.85; }
    100% { transform:translateX(-50%) scale(1); opacity:1; } }

  .note { position:absolute; bottom:calc(100% + 10px); left:0; right:0;
    text-align:center; font-family:"Patrick Hand",cursive; font-size:15px;
    color:rgba(255,248,236,.65); pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.9); }

  /* ---------- bottom dock: chips + paper card ---------- */
  .dock { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    width:min(600px, calc(100vw - 24px)); z-index:10; }
  .chips { display:flex; gap:8px; margin-bottom:10px; }
  .chip { flex:1; padding:7px 10px; cursor:pointer;
    background:var(--paper); color:var(--ink);
    border:2.5px solid var(--ink); border-radius:11px;
    font-family:"Fredoka",sans-serif; font-size:10.5px; font-weight:700;
    letter-spacing:.13em; text-transform:uppercase;
    box-shadow:0 3px 0 rgba(0,0,0,.5);
    transition:all .18s cubic-bezier(.34,1.56,.64,1);
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .chip:nth-child(odd) { transform:rotate(-.8deg); }
  .chip:nth-child(even) { transform:rotate(.7deg); }
  .chip:hover { transform:translateY(-2px) rotate(0); background:var(--sun); }
  .chip.sel { background:var(--coral); color:var(--paper);
    transform:translateY(-3px) rotate(0); box-shadow:0 5px 0 var(--ink); }
  .chip.locked { opacity:.7; }
  .chip .lic { font-size:9px; }
  .chip.no { animation:shake .38s ease-in-out; }
  @keyframes shake { 20% { transform:translateX(-5px) rotate(-1deg); }
    40% { transform:translateX(5px) rotate(1deg); }
    60% { transform:translateX(-3px); } 80% { transform:translateX(3px); } }

  .card { background:var(--cream); color:var(--ink);
    border:3px solid var(--ink); border-radius:18px;
    box-shadow:0 6px 0 rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.5);
    padding:13px 18px 15px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin-bottom:10px; }
  .stat { display:flex; flex-direction:column; gap:4px; }
  .stat .lbl { font-size:9.5px; font-weight:800; letter-spacing:.2em;
    color:rgba(43,33,24,.6); }
  .stat .lbl b { color:var(--ink); }
  .pips { display:flex; gap:4px; }
  .pips i { flex:1; height:7px; border-radius:4px;
    background:rgba(43,33,24,.1); border:1.5px solid var(--ink); }
  .pips i.on { background:var(--coral); }
  .spec { display:flex; align-items:center; gap:7px; font-size:11px;
    font-weight:700; letter-spacing:.06em; color:var(--ink);
    background:rgba(181,101,216,.14); border:2px dashed var(--berry);
    border-radius:10px; padding:5px 12px; margin-bottom:12px; }
  .spec .star { color:var(--berry); }
  .spec .sd { color:rgba(43,33,24,.6); font-weight:500; }
  .act { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .pick { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(43,33,24,.6); }
  .pick b { color:var(--coral); font-size:13px; }
  .enter { flex:1; display:inline-flex; align-items:center; justify-content:center;
    font-family:"Baloo 2",sans-serif; font-size:14px; font-weight:800;
    letter-spacing:.12em; text-transform:uppercase; text-decoration:none;
    padding:10px 16px; border-radius:13px; cursor:pointer;
    background:var(--leaf); color:var(--paper); border:2.5px solid var(--ink);
    box-shadow:0 4px 0 var(--ink); transition:all .15s cubic-bezier(.34,1.56,.64,1); }
  .enter:hover { background:var(--coral); transform:translateY(-2px);
    box-shadow:0 6px 0 var(--ink); }
  .enter:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .enter.locked { background:rgba(43,33,24,.2); color:rgba(43,33,24,.5);
    box-shadow:none; cursor:not-allowed; }

  /* every keyboard-focusable control needs a visible indicator — the UA
     ring is thin against the dark arena; use the house sun color */
  .chip:focus-visible, .enter:focus-visible, .back:focus-visible {
    outline:3px solid var(--sun); outline-offset:2px; }

  /* ---------- a11y media queries ---------- */
  @media (prefers-contrast: more) {
    .pick, .stat .lbl, .spec .sd { color:var(--ink); }
    .note { color:rgba(255,248,236,.95); }
    .pill, .chip, .enter, .back, .card { border-width:3.5px; }
  }
  @media (forced-colors: active) {
    /* pip fill + chip selection are pure-color state — forced-colors
       flattens backgrounds and the info is gone; use system Highlight */
    .pips i.on { background:Highlight; }
    .chip.sel { outline:3px solid Highlight; }
    .enter.locked { outline:2px dashed ButtonText; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
  }

  @media (max-width:640px) {
    .mast { padding:10px 14px; }
    .pills { display:none; }
    .hero { top:9%; }
    .hero-name { font-size:clamp(44px,13vw,68px); }
    .dock { bottom:10px; }
  }
</style>
</head>
<body>
<canvas id="webgl-canvas"></canvas>

<header class="mast">
  <div class="pills">
    <span class="pill">BEST <b data-best>0</b> PTS</span>
    <span class="pill"><b data-wins>0</b> WINS</span>
    <span class="pill"><i class="ko-ic"></i><b data-kos>0</b> KOs</span>
    <span class="pill">AVG KO <b data-koavg>—</b></span>
  </div>
  <a class="back" href="./">← MENU</a>
</header>

<div class="hero" data-pop>
  <div class="eyebrow">tonight's exhibition bout</div>
  <h1 class="hero-name"><span data-hero-name>BUBBLE</span></h1>
  <div class="hero-desc" data-hero-desc>sprout crown · springy stance</div>
</div>

<!-- kept for backward compat with older scripts/tests -->
<div data-grid style="display:none;"></div>

<div class="dock dockpop" data-pop>
  <div class="note" data-note>the contenders await your challenge</div>
  <!-- .cell + data-idx are kept on purpose: qe-e2e clicks .cell[data-idx] -->
  <div class="chips plinth-tabs">
    <button class="chip cell" data-sel="0" data-idx="0">№ 1 · <span data-sel-name>BUBBLE</span>
      <span class="lic" data-lockic style="display:none"><svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M3.6 5V3.7a2.4 2.4 0 0 1 4.8 0V5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></button>
    <button class="chip cell" data-sel="1" data-idx="1">№ 2 · <span data-sel-name>BEAN</span>
      <span class="lic" data-lockic style="display:none"><svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M3.6 5V3.7a2.4 2.4 0 0 1 4.8 0V5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></button>
    <button class="chip cell" data-sel="2" data-idx="2">№ 3 · <span data-sel-name>SUMO</span>
      <span class="lic" data-lockic style="display:none"><svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M3.6 5V3.7a2.4 2.4 0 0 1 4.8 0V5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></button>
  </div>
  <div class="card">
    <div class="stats">
      <div class="stat"><div class="lbl">ATK <b data-stat-atk>3</b>/5</div><div class="pips" data-pip-atk></div></div>
      <div class="stat"><div class="lbl">DEF <b data-stat-def>3</b>/5</div><div class="pips" data-pip-def></div></div>
      <div class="stat"><div class="lbl">SPD <b data-stat-spd>4</b>/5</div><div class="pips" data-pip-spd></div></div>
    </div>
    <div class="spec"><span class="star">★</span><span data-spec-name>TRIPLE TAP</span><span class="sd" data-spec-desc>— 3 hits, one stamina</span></div>
    <div class="act">
      <div class="pick">your rival: <b data-pick>BUBBLE</b></div>
      <a class="enter" data-enter href="./boxing.html">ENTER THE RING →</a>
    </div>
  </div>
</div>

<script type="module">
  /* menu tune + pick blips — the same lazy BoxingAudio as the menu: the ctx
     is grabbed immediately (running where the browser allows autoplay —
     the tune carries over from the menu without a dead beat), else the
     queued resume() + this fallback flips it live on the first gesture. */
  const lineAudioP = import('./shared/boxing/audio.js').catch(() => null);
  let lineAC = null, lineAudio = null;
  try {
    const ACEarly = window.AudioContext || window.webkitAudioContext;
    lineAC = ACEarly ? new ACEarly() : null;
    lineAC?.resume?.();
  } catch { lineAC = null; }
  const lineUp = () => { try {
    if (!lineAudio) return;
    const c = lineAudio.unlock(lineAC);
    try { c?.resume?.(); } catch {}
    if (!lineAudio.muted) { lineAudio.crowd(true); lineAudio.menuTune(true); }
    if (c && c.state !== 'suspended') {
      removeEventListener('pointerdown', lineUnlock);
      removeEventListener('keydown', lineUnlock);
    }
  } catch {} };
  lineAudioP.then(m => { try {
    if (!m) return;
    if (!lineAudio) {
      lineAudio = new m.BoxingAudio();
      if (localStorage.getItem('boxing:sound') === '0') lineAudio.muted = true;
      const rawV = localStorage.getItem('boxing:volume');
      if (rawV !== null) {
        const v = Number(rawV);
        if (Number.isFinite(v)) lineAudio.setVolume(Math.min(1, Math.max(0, v / 100)));
      }
    }
    lineUp();
  } catch {} });
  const lineUnlock = () => {
    if (!lineAC) try {
      const AC = window.AudioContext || window.webkitAudioContext;
      lineAC = AC ? new AC() : null;
    } catch { lineAC = null; }
    try { lineAC?.resume?.(); } catch {}
    lineAudioP.then(() => lineUp());
  };
  addEventListener('pointerdown', lineUnlock);
  addEventListener('keydown', lineUnlock);
  /* same resume-pump as the ring: any activation that lands after load
     flips the parked ctx instead of waiting on a gesture */
  let linePumps = 0;
  const linePump = setInterval(() => { try {
    if (++linePumps > 60) return clearInterval(linePump);
    lineAC?.resume?.(); lineAudio?.ctx?.resume?.();
    if (lineAC?.state === 'running' || lineAudio?.ctx?.state === 'running')
      clearInterval(linePump);
  } catch {} }, 350);
  document.addEventListener('visibilitychange', () => { try {
    if (!lineAC) return;
    document.hidden ? lineAC.suspend?.() : lineAC.resume?.();
  } catch {} });
  /* every rival picks their own chirp — BUBBLE pops up, BEAN springs down,
     SUMO lands like a dropped kettlebell; a locked pick answers with a dull
     denied thunk */
  const RIVAL_SFX = {
    bubble: { f: 1046.5, f1: 1568, dur: .09, peak: .22 },
    bean:   { f: 880, f1: 659.25, dur: .11, peak: .22 },
    sumo:   { f: 392, f1: 196, dur: .16, peak: .3 },
  };
  const rivalSfx = (c) => { try {
    if (!lineAudio) return;
    if (c?.locked) { lineAudio.play('thud', { dmg: 6 }); return; }
    lineAudio.play('blip', RIVAL_SFX[c?.variant] || RIVAL_SFX.bubble);
  } catch {} };
  /* chips tick softly on a pass-over too — the highlight doesn't move for
     a hover, but the ear should still feel it */
  document.querySelectorAll('[data-sel]').forEach((el, i) =>
    el.addEventListener('pointerenter', () => { try {
      lineAudio?.play('blip', { f: 620 + i * 120, dur: .05, peak: .07 });
    } catch {} }));

  /* The stage engine lives in lineup-mockups/_hero. It's a dynamic import on
     purpose: if the engine (or one of its deps — protoBoxer, three) fails to
     load, a static import would kill this module and leave a black stage
     with no explanation. The static card below still picks a rival and the
     ENTER link still navigates, so a failed stage degrades to a note. */
  try {
    const { boot } = await import('./lineup-mockups/_hero/engine.mjs');
    boot({
      bg: 0x141008, fogNear: 9, fogFar: 30,
      hemiSky: 0x9a8a70, hemiGround: 0x14100a, hemiInt: 0.5,
      floor: 0x231c12, floorRough: 0.8,
      plinth: 0xf6ecd6, rim: 0xffc53d, rimMetal: 0.55, rimRough: 0.4,
      spotColor: 0xffd9a0, spotHot: 44, spotDim: 1.4,
      glowHot: 0.4, glowDim: 0.02,
      sideSlot: { x: 2.75, z: -0.65, s: 0.8 },
      centerSlot: { x: 0, z: 0.1, s: 1.0 },
    camRad: 9.0, camPhi: 1.42, camTgtY: 1.0,
      fixedCam: true,
      onSelect: (i, c, userDriven) => { if (userDriven) rivalSfx(c); },
    });
  } catch (e) {
    console.warn('lineup: stage engine unavailable — card below still works:', e);
    const cv = document.getElementById('webgl-canvas');
    if (cv) cv.style.visibility = 'hidden';
    const n = document.querySelector('[data-note]');
    if (n) n.textContent = 'the stage lights are out — the card below still picks your rival';
    /* keep that note honest: without the engine nothing wired the chips, so
       a dead stage used to mean a dead picker — clicks did nothing and the
       stored pick never updated. Fallback: chips select + persist, the
       whole card (hero, stats, pips, spec, pick, ENTER) follows like the
       engine would drive it, career pills still read the real record, and
       the engine's keymap works the same. Lock gating stays server-side
       (npc.js re-checks koAvg), so an ungated pick can't sneak a locked
       fighter into the ring. */
    try {
      const get = (k, d) => { try { const v = localStorage.getItem(k);
        return v == null ? d : JSON.parse(v); } catch { return d; } };
      const num = (v) => (typeof v === 'number' && Number.isFinite(v)) ? v : 0;
      const cnt = (v) => Math.max(0, Math.floor(num(v)));   // career counters are whole, non-negative — corrupt storage renders 0, never '-5 KOs'
      const ko = get('boxing:ko', { n: 0, sum: 0 });
      const koN = cnt(ko?.n), koSum = Math.max(0, num(ko?.sum));
      const put = (sel, v) => { const el = document.querySelector(sel); if (el) el.textContent = v; };
      put('[data-best]', cnt(get('boxing:best', 0)).toLocaleString());
      put('[data-wins]', cnt(get('boxing:wins', 0)));
      put('[data-kos]', koN);
      put('[data-koavg]', koN && koSum
        ? Math.min(Math.max(koSum / koN, 1), 99.9).toFixed(1) : '—');

      /* display copy mirrors VARIANT_INFO in shared/boxing/protoBoxer.js —
         the engine's own static dep likely failed with it, so a small local
         table is the only honest source left. Keyed by the chip labels. */
      const INFO = {
        BUBBLE: { desc: 'sprout crown · springy stance', stats: [3, 3, 4],
          spec: ['TRIPLE TAP', '3 hits, one stamina'] },
        BEAN: { desc: 'tall bean · snappy reach', stats: [4, 4, 3],
          spec: ['BEAN BARRAGE', "the bean's heavy 1-2"] },
        SUMO: { desc: 'heavyweight boss · massive frame · iron palm', stats: [5, 5, 2],
          spec: ['SUMO SLAM', 'iron palm guard crusher'] },
      };
      const practice = new URLSearchParams(location.search).get('practice') ? '?practice=1' : '';
      const chips = [...document.querySelectorAll('[data-sel]')];
      const pickEl = document.querySelector('[data-pick]');
      const enterEl = document.querySelector('[data-enter]');
      const nameOf = (c) => c?.querySelector('[data-sel-name]')?.textContent?.trim() || '';
      const pips = (sel_, n) => {
        const el = document.querySelector(sel_);
        if (!el) return;
        el.innerHTML = '';
        for (let i = 0; i < 5; i++) {
          const p = document.createElement('i');
          if (i < n) p.className = 'on';
          el.appendChild(p);
        }
      };
      let sel = -1;
      const choose = (i, store) => {
        const name = nameOf(chips[i]);
        if (!name) return;
        sel = i;
        const info = INFO[name] || { desc: 'original contender', stats: [3, 3, 3],
          spec: ['MYSTERY MOVE', 'unscouted'] };
        chips.forEach((c, j) => c.classList.toggle('sel', i === j));
        put('[data-hero-name]', name);
        put('[data-hero-desc]', info.desc);
        put('[data-stat-atk]', info.stats[0]);
        put('[data-stat-def]', info.stats[1]);
        put('[data-stat-spd]', info.stats[2]);
        pips('[data-pip-atk]', info.stats[0]);
        pips('[data-pip-def]', info.stats[1]);
        pips('[data-pip-spd]', info.stats[2]);
        put('[data-spec-name]', info.spec[0]);
        put('[data-spec-desc]', `— ${info.spec[1]}`);
        if (pickEl) pickEl.textContent = name;
        if (enterEl) enterEl.href = `./boxing.html${practice}`;
        if (store) {
          rivalSfx({ variant: name.toLowerCase() });   // user-driven pick — same chirp as the live stage
          try { localStorage.setItem('boxing:npc', `proto:${name.toLowerCase()}`); } catch {}
        }
      };
      chips.forEach((c, i) => c.addEventListener('click', () => choose(i, true)));
      /* the engine's keymap, degraded edition — chips are <button>s so
         Tab+Enter always worked; ←/→/digits keep parity for keyboard-only
         rivals on a dead stage */
      addEventListener('keydown', (e) => {
        const len = chips.length;
        if (!len || sel < 0) return;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A')
          choose((sel + len - 1) % len, true);
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D')
          choose((sel + 1) % len, true);
        else if (e.key >= '1' && e.key <= String(len)) choose(+e.key - 1, true);
      });
      // reflect a stored pick so the card matches what the ring will load —
      // blocked storage must not skip the default pick
      let stored = null;
      try { stored = localStorage.getItem('boxing:npc'); } catch {}
      const cur = (stored || '').replace(/^proto:/, '').toUpperCase();
      const idx = chips.findIndex(c => nameOf(c).toUpperCase() === cur);
      if (idx >= 0) choose(idx, false);
      else choose(0, false);   // nothing stored/matched — show the house favorite
    } catch {}
  }
</script>
</body>
</html>
