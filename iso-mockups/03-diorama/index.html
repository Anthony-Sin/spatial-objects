<style>
  body { margin: 0; background: #171310; overflow: hidden;
    font-family: Georgia,"Times New Roman",serif; }
  #hud { position: fixed; top: 18px; left: 18px; z-index: 5;

    border-radius: 10px; padding: 13px 15px; font-size: 11px;

  #hud h1 { font-size: 13px; margin: 0; letter-spacing: .14em;
    font-weight: 600; color: #f0dfba; font-variant: small-caps; }
  #hud .sub { font-size: 9px; color: #9c8460; letter-spacing: .22em;
    text-transform: uppercase; margin: 2px 0 10px; }
  #hud .keys { color: #8f7a58; font-size: 9.5px; line-height: 1.65;
    margin-bottom: 9px; font-style: italic; }
  #hud .keys b { color: #d9c294; font-style: normal; }
  #hud button { display: block; width: 100%; text-align: left; margin: 3px 0;
    padding: 6px 10px; border: 1px solid rgba(212,175,105,.4); border-radius: 6px;
    background: transparent; font: inherit; font-size: 10.5px;
    letter-spacing: .08em; cursor: pointer; color: #e6d5b8;
    transition: all .15s; }
  #hud button:hover { background: rgba(212,175,105,.12); border-color: #d4af69; }
  #hud select { width: 100%; margin-top: 8px; font: inherit; font-size: 10.5px;
    padding: 5px; border: 1px solid rgba(212,175,105,.4); border-radius: 6px;
    background: #1c1611; color: #e6d5b8; }
  #hud label.t { display: flex; gap: 7px; align-items: center;
    font-size: 10px; margin-top: 9px; color: #9c8460; font-style: italic; }

    font-variant: small-caps;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }

<div id="hud">
  <h1>The Collection</h1>
  <div class="sub">four contenders · one case</div>
  <div class="keys">
    <b>drag</b> orbit · <b>wheel</b> zoom · <b>shift-drag</b> pan<br>
    <b>click / 1–4</b> focus · <b>0</b> all · <b>b</b> bounds
  </div>
  <div id="list"></div>
  <select id="pose"></select>
  <label class="t"><input type="checkbox" id="spin"> turntable</label>
</div>
<div class="plate">gallery no.3 · acquisition record below each plinth</div>
<script type="module">
import * as THREE from 'three';
import { initIso, ROSTER, POSES } from '../shared/core.js';

const GLOW = [0xff6b57, 0x5da9e9, 0xb565d8, 0xffc53d];

const iso = initIso({
  bg: 0x171310, floor: 0x1f1914, shadows: true,
  fog: { color: 0x171310, near: 9, far: 26 },
  grid: null,
  cam: { theta: .3, phi: 1.24, tgt: [0, .85, 0] },
  tagLift: .55,
  tagFmt: (i, m) => [`${m.r.label}`,
    `№ ${i + 1} · h ${m.h.toFixed(3)}u`],
  lights(scene, T) {
    scene.add(new T.HemisphereLight(0x887755, 0x1a140f, .5));
  },
  dress(scene, x, i, m, T) {
    // ivory plinth + brass rim
    const ped = new T.Mesh(new T.CylinderGeometry(.55, .62, .14, 36),
      new T.MeshStandardMaterial({ color: 0xefe6d2, roughness: .75 }));
    ped.position.set(x, .07, 0); ped.receiveShadow = true; scene.add(ped);
    const rim = new T.Mesh(new T.TorusGeometry(.585, .018, 10, 48).rotateX(Math.PI / 2),
      new T.MeshStandardMaterial({ color: 0xd4af69, metalness: .6, roughness: .35 }));
    rim.position.set(x, .142, 0); scene.add(rim);
    // pool of warm light from above — museum track lighting
    const spot = new T.SpotLight(0xffe2b0, 28, 7, .42, .45, 1.6);
    spot.position.set(x + .3, 3.4, .9);
    spot.target.position.set(x, .1, 0);
    spot.castShadow = true;
    spot.shadow.mapSize.set(1024, 1024);
    spot.shadow.bias = -.0004;
    scene.add(spot, spot.target);
    // hidden accent glow under the plinth
    const glow = new T.Mesh(new T.CircleGeometry(.68, 40),
      new T.MeshBasicMaterial({ color: GLOW[i % 4], transparent: true,
        opacity: .16, blending: T.AdditiveBlending, depthWrite: false }));
    glow.rotation.x = -Math.PI / 2; glow.position.set(x, .004, 0);
    scene.add(glow);
  },
});
/* fighters stand ON the plinths */
iso.chars.forEach(b => b.group.position.y = .14);

const list = document.getElementById('list');
ROSTER.forEach((r, i) => {
  const b = document.createElement('button');
  b.textContent = `№ ${i + 1} — ${r.label}`;
  b.onclick = () => iso.focus(i);
  list.appendChild(b);
});
const all = document.createElement('button');
all.textContent = '№ 0 — the whole case';
all.onclick = () => iso.fitAll();
list.appendChild(all);

const sel = document.getElementById('pose');
for (const p of POSES) {
  const o = document.createElement('option'); o.value = o.textContent = p;
  sel.appendChild(o);
}
sel.onchange = () => iso.setPose(sel.value);
document.getElementById('spin').onchange = e => iso.toggleSpin(e.target.checked);
</script>
