<script type="module">
import * as THREE from 'three';
import { initIso, ROSTER, POSES } from '../shared/core.js';

const GLOW = [0xff6b57, 0x5da9e9, 0xb565d8, 0xffc53d];
const INK = 0x2b2118;

/* ---- v2 retune: applied to a built boxer, original file untouched ----
   1. hide the leaf detail meshes on the upper-front chest (pec / shoulder
      "nipple" dots) — inked parts have hull children, details don't
   2. recolor every non-ink glove surface to the variant's single glove color
   3. wrap the head's contents in a lift group + bridge the gap with a neck   */
/* neck fit: HB = head half-height (head-space); lifting the head contents
   by `lift` opens a gap between the torso top and the lifted head bottom.
   The capsule top is buried r-deep inside the head so it reads as a neck,
   not a collar — visible band ends up ≈ lift over the torso line. */
const NECK = {
  bubble: { lift: .26, r: .13, len: .38, hb: .30 },
  blocky: { lift: .13, r: .11, len: .30, hb: .24 },
  bean:   { lift: .30, r: .15, len: .40, hb: .2565 },
  you:    { lift: .26, r: .13, len: .38, hb: .30 },
};
function retune(b, key, THREE) {
  const torso = b.parts.torso;
  for (const m of torso.children)                    // 1 — nipples
    if (m.isMesh && !m.children.length && m.position.y > .04 && m.position.z > .12)
      m.visible = false;

  for (const g of [b.parts.gloveL, b.parts.gloveR])  // 2 — solid gloves
    g.traverse(m => {
      if (m.isMesh && m.material?.color && m.material.color.getHex() !== INK)
        m.material.color.set(b.gloveColor);
    });

  const N = NECK[key] || NECK.bubble;
  const head = b.parts.head;                          // 3 — neck
  const liftG = new THREE.Group();                    // carry existing head
  liftG.position.y = N.lift;                          // contents upward so
  head.add(liftG);                                    // marked parts keep
  while (head.children[0] !== liftG)                  // their rest targets
    liftG.add(head.children[0]);
  const skin = liftG.children.find(m => m.isMesh)?.material;
  const geo = new THREE.CapsuleGeometry(N.r, N.len - 2 * N.r, 6, 14);
  const neck = new THREE.Mesh(geo, skin);
  const hull = new THREE.Mesh(geo,
    new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide }));
  hull.scale.setScalar(1.06);
  neck.add(hull);
  const headBottom = -N.hb + N.lift;                  // head-space, lifted
  neck.position.y = headBottom + N.r - N.len / 2;     // top buried r into head
  head.add(neck);
  console.log(`[v2] ${key}: lift ${N.lift}, neck r${N.r} len${N.len}`);
}

const iso = initIso({
  bg: 0x171310, floor: 0x1f1914, shadows: true,
  fog: { color: 0x171310, near: 9, far: 26 },
  grid: null,
  cam: { theta: .3, phi: 1.24, tgt: [0, .92, 0] },
  tagLift: .55,
  tagFmt: (i, m) => [`${m.r.label} v2`,
    `№ ${i + 1} · h ${m.h.toFixed(3)}u`],
  lights(scene, T) {
    scene.add(new T.HemisphereLight(0x887755, 0x1a140f, .5));
  },
  dress(scene, x, i, m, T) {
    const ped = new T.Mesh(new T.CylinderGeometry(.55, .62, .14, 36),
      new T.MeshStandardMaterial({ color: 0xefe6d2, roughness: .75 }));
    ped.position.set(x, .07, 0); ped.receiveShadow = true; scene.add(ped);
    const rim = new T.Mesh(new T.TorusGeometry(.585, .018, 10, 48).rotateX(Math.PI / 2),
      new T.MeshStandardMaterial({ color: 0xd4af69, metalness: .6, roughness: .35 }));
    rim.position.set(x, .142, 0); scene.add(rim);
    const spot = new T.SpotLight(0xffe2b0, 28, 7, .42, .45, 1.6);
    spot.position.set(x + .3, 3.4, .9);
    spot.target.position.set(x, .1, 0);
    spot.castShadow = true;
    spot.shadow.mapSize.set(1024, 1024);
    spot.shadow.bias = -.0004;
    scene.add(spot, spot.target);
    const glow = new T.Mesh(new T.CircleGeometry(.68, 40),
      new T.MeshBasicMaterial({ color: GLOW[i % 4], transparent: true,
        opacity: .16, blending: T.AdditiveBlending, depthWrite: false }));
    glow.rotation.x = -Math.PI / 2; glow.position.set(x, .004, 0);
    scene.add(glow);
  },
});
iso.chars.forEach(b => b.group.position.y = .14);

/* measurements are pre-retune; patch first, then re-tag with true heights */
const box = new THREE.Box3();
iso.chars.forEach((b, i) => {
  retune(b, ROSTER[i].id, THREE);
  b.group.updateMatrixWorld(true);
  box.setFromObject(b.group);
  const h = box.max.y - box.min.y;
  document.querySelectorAll('.tag')[i].querySelector('.s').textContent =
    `№ ${i + 1} · h ${h.toFixed(3)}u (+${(h - iso.meta[i].h).toFixed(2)})`;
});

const list = document.getElementById('list');
ROSTER.forEach((r, i) => {
  const b = document.createElement('button');
  b.textContent = `№ ${i + 1} — ${r.label}`;
  b.onclick = () => iso.focus(i);
  list.appendChild(b);
});
const all = document.createElement('button');
all.textContent = '№ 0 — the whole case';
all.onclick = () => iso.fitAll();
list.appendChild(all);

const sel = document.getElementById('pose');
for (const p of POSES) {
  const o = document.createElement('option'); o.value = o.textContent = p;
  sel.appendChild(o);
}
sel.onchange = () => iso.setPose(sel.value);
document.getElementById('spin').onchange = e => iso.toggleSpin(e.target.checked);
</script>
